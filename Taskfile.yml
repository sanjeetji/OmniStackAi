version: "3"

silent: true

tasks:
  doctor:
    desc: Validate repository structure and available local toolchains
    cmds:
      - bash scripts/doctor.sh

  bootstrap:
    desc: Install declared local dependencies deterministically
    cmds:
      - bash scripts/bootstrap.sh

  lint:
    desc: Run static repository checks
    cmds:
      - bash scripts/lint.sh

  test:
    desc: Run repository contract tests
    cmds:
      - bash scripts/test.sh

  build:
    desc: Build implemented targets
    cmds:
      - echo "No application build target exists through R-003."

  check:
    desc: Run lint and tests
    deps: [lint, test]

  preview:
    desc: Start the lowest-cost eligible preview
    cmds:
      - echo "No preview target exists through R-003. Instant Browser Preview will be added first."

  db:config:
    desc: Validate the local PostgreSQL Compose configuration
    cmds:
      - bash scripts/db.sh config

  db:up:
    desc: Start local PostgreSQL with pgvector and wait until healthy
    cmds:
      - bash scripts/db.sh up

  db:status:
    desc: Show local PostgreSQL container status
    cmds:
      - bash scripts/db.sh status

  db:verify:
    desc: Verify local PostgreSQL, pgvector, and migration version
    cmds:
      - bash scripts/db.sh verify

  db:down:
    desc: Stop local PostgreSQL without deleting its data volume
    cmds:
      - bash scripts/db.sh down

  ollama:config:
    desc: Validate the loopback-only local Ollama configuration
    cmds:
      - bash scripts/ollama.sh config

  ollama:serve:
    desc: Run the configured local Ollama server in the foreground
    cmds:
      - bash scripts/ollama.sh serve

  ollama:status:
    desc: Check local Ollama health and version
    cmds:
      - bash scripts/ollama.sh status

  ollama:models:
    desc: List models discovered from the local Ollama runtime
    cmds:
      - bash scripts/ollama.sh models

  ollama:pull:
    desc: Pull the local model selected in environment configuration
    cmds:
      - bash scripts/ollama.sh pull

  ollama:verify:
    desc: Verify model discovery and one real local inference
    cmds:
      - bash scripts/ollama.sh verify

  control-plane:lint:
    desc: Check formatting and vet the Go control-plane
    cmds:
      - bash scripts/control-plane.sh lint

  control-plane:test:
    desc: Run Go control-plane unit tests
    cmds:
      - bash scripts/control-plane.sh test

  control-plane:build:
    desc: Compile the Go control-plane locally
    cmds:
      - bash scripts/control-plane.sh build

  control-plane:verify:
    desc: Build and verify control-plane liveness and PostgreSQL readiness in Compose
    cmds:
      - bash scripts/control-plane.sh verify

  agent-engine:lint:
    desc: Compile and policy-check the Python agent-engine contracts
    cmds:
      - bash scripts/agent-engine.sh lint

  agent-engine:test:
    desc: Run the Python agent-engine contract tests
    cmds:
      - bash scripts/agent-engine.sh test

  agent-engine:ollama:verify:
    desc: Prove the ModelProvider adapter against the configured loopback Ollama runtime
    cmds:
      - bash scripts/agent-engine.sh ollama-verify

  agent-engine:gateway:run:
    desc: Run the Balanced Model Gateway live against the configured local Ollama model
    cmds:
      - bash scripts/agent-engine.sh gateway-run

  agent-engine:intake:run:
    desc: 'Compile a plain-English app description into an Application IR via local Ollama (opt-in, live; CLI_ARGS - "description")'
    cmds:
      - bash scripts/agent-engine.sh intake-run {{.CLI_ARGS}}

  agent-engine:app:build:
    desc: 'Compile a description into a real owned Git repo via local Ollama (opt-in, live; out dir via OMNISTACKAI_APP_OUT_DIR; CLI_ARGS - "description")'
    cmds:
      - bash scripts/agent-engine.sh app-build {{.CLI_ARGS}}

  agent-engine:studio:serve:
    desc: 'Serve the build-only chat-to-create Studio on http://127.0.0.1:4173 (opt-in local Ollama; generated code is not run)'
    cmds:
      - bash scripts/agent-engine.sh studio-serve

  agent-engine:studio:preview:
    desc: 'Serve Studio with an embedded live app on http://127.0.0.1:4173 (explicit trusted-local generated-code execution)'
    deps: [db:up]
    cmds:
      - bash scripts/agent-engine.sh studio-preview

  agent-engine:app:run:
    desc: 'Run a generated app repo locally in one command - DB + migrations + backend :8000 + web :3000 (opt-in, live; CLI_ARGS - <repo-dir>)'
    deps: [db:up]
    cmds:
      - bash scripts/agent-engine.sh app-run {{.CLI_ARGS}}

  agent-engine:preview-plan:
    desc: Print the local (Tier 0/1) preview plan for a generated target (default nextjs-web)
    cmds:
      - bash scripts/agent-engine.sh preview-plan {{.CLI_ARGS}}

  agent-engine:verify-plan:
    desc: Print the verifiable-engineering gate ladder for a generated target (default nextjs-web)
    cmds:
      - bash scripts/agent-engine.sh verify-plan {{.CLI_ARGS}}

  plan:show:
    desc: Print the combined preview+verify(+deploy) project plan for an example IR (default rideshare-favourites)
    cmds:
      - bash scripts/agent-engine.sh plan-show {{.CLI_ARGS}}

  platform:status:
    desc: Show the active tier and resolved runtime/deploy providers (reads .env)
    cmds:
      - bash scripts/agent-engine.sh platform-status

  builder:demo:
    desc: Generate a real customer app+repo from an example IR and show the result (CLI_ARGS - example [out-dir])
    cmds:
      - bash scripts/builder-demo.sh {{.CLI_ARGS}}

  console:snapshot:
    desc: Refresh the console's metadata-only model/cost overview snapshot
    cmds:
      - bash scripts/console.sh snapshot

  console:serve:
    desc: Refresh the snapshot and serve the console on http://127.0.0.1:4321
    cmds:
      - bash scripts/console.sh serve

  verify:
    desc: Run the CI-equivalent Stage 0 verification
    cmds:
      - bash scripts/verify.sh

  ci:
    desc: Run CI verification
    cmds:
      - bash scripts/verify.sh --ci

  ai:status:
    desc: Print durable task and Git status
    cmds:
      - bash scripts/ai-status.sh

  ai:handoff:
    desc: Validate and print the current handoff
    cmds:
      - bash scripts/ai-handoff.sh

  env:check:
    desc: Validate environment placeholders and exclusions
    cmds:
      - bash scripts/env-check.sh

  security:quick:
    desc: Run the Stage 0 secret-policy check
    cmds:
      - bash scripts/security-quick.sh
