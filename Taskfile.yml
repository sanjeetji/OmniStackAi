version: "3"

silent: true

tasks:
  doctor:
    desc: Validate repository structure and available local toolchains
    cmds:
      - bash scripts/doctor.sh

  bootstrap:
    desc: Install declared local dependencies deterministically
    cmds:
      - bash scripts/bootstrap.sh

  lint:
    desc: Run static repository checks
    cmds:
      - bash scripts/lint.sh

  test:
    desc: Run repository contract tests
    cmds:
      - bash scripts/test.sh

  build:
    desc: Build implemented targets
    cmds:
      - echo "No application build target exists through R-002."

  check:
    desc: Run lint and tests
    deps: [lint, test]

  preview:
    desc: Start the lowest-cost eligible preview
    cmds:
      - echo "No preview target exists through R-002. Instant Browser Preview will be added first."

  db:config:
    desc: Validate the local PostgreSQL Compose configuration
    cmds:
      - bash scripts/db.sh config

  db:up:
    desc: Start local PostgreSQL with pgvector and wait until healthy
    cmds:
      - bash scripts/db.sh up

  db:status:
    desc: Show local PostgreSQL container status
    cmds:
      - bash scripts/db.sh status

  db:verify:
    desc: Verify local PostgreSQL, pgvector, and migration version
    cmds:
      - bash scripts/db.sh verify

  db:down:
    desc: Stop local PostgreSQL without deleting its data volume
    cmds:
      - bash scripts/db.sh down

  verify:
    desc: Run the CI-equivalent Stage 0 verification
    cmds:
      - bash scripts/verify.sh

  ci:
    desc: Run CI verification
    cmds:
      - bash scripts/verify.sh --ci

  ai:status:
    desc: Print durable task and Git status
    cmds:
      - bash scripts/ai-status.sh

  ai:handoff:
    desc: Validate and print the current handoff
    cmds:
      - bash scripts/ai-handoff.sh

  env:check:
    desc: Validate environment placeholders and exclusions
    cmds:
      - bash scripts/env-check.sh

  security:quick:
    desc: Run the Stage 0 secret-policy check
    cmds:
      - bash scripts/security-quick.sh
