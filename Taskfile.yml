version: "3"

silent: true

tasks:
  doctor:
    desc: Validate repository structure and available local toolchains
    cmds:
      - bash scripts/doctor.sh

  bootstrap:
    desc: Install declared local dependencies deterministically
    cmds:
      - bash scripts/bootstrap.sh

  lint:
    desc: Run static repository checks
    cmds:
      - bash scripts/lint.sh

  test:
    desc: Run repository contract tests
    cmds:
      - bash scripts/test.sh

  build:
    desc: Build implemented targets
    cmds:
      - echo "No application build target exists through R-003."

  check:
    desc: Run lint and tests
    deps: [lint, test]

  preview:
    desc: Start the lowest-cost eligible preview
    cmds:
      - echo "No preview target exists through R-003. Instant Browser Preview will be added first."

  db:config:
    desc: Validate the local PostgreSQL Compose configuration
    cmds:
      - bash scripts/db.sh config

  db:up:
    desc: Start local PostgreSQL with pgvector and wait until healthy
    cmds:
      - bash scripts/db.sh up

  db:status:
    desc: Show local PostgreSQL container status
    cmds:
      - bash scripts/db.sh status

  db:verify:
    desc: Verify local PostgreSQL, pgvector, and migration version
    cmds:
      - bash scripts/db.sh verify

  db:down:
    desc: Stop local PostgreSQL without deleting its data volume
    cmds:
      - bash scripts/db.sh down

  ollama:config:
    desc: Validate the loopback-only local Ollama configuration
    cmds:
      - bash scripts/ollama.sh config

  ollama:serve:
    desc: Run the configured local Ollama server in the foreground
    cmds:
      - bash scripts/ollama.sh serve

  ollama:status:
    desc: Check local Ollama health and version
    cmds:
      - bash scripts/ollama.sh status

  ollama:models:
    desc: List models discovered from the local Ollama runtime
    cmds:
      - bash scripts/ollama.sh models

  ollama:pull:
    desc: Pull the local model selected in environment configuration
    cmds:
      - bash scripts/ollama.sh pull

  ollama:verify:
    desc: Verify model discovery and one real local inference
    cmds:
      - bash scripts/ollama.sh verify

  control-plane:lint:
    desc: Check formatting and vet the Go control-plane
    cmds:
      - bash scripts/control-plane.sh lint

  control-plane:test:
    desc: Run Go control-plane unit tests
    cmds:
      - bash scripts/control-plane.sh test

  control-plane:build:
    desc: Compile the Go control-plane locally
    cmds:
      - bash scripts/control-plane.sh build

  control-plane:verify:
    desc: Build and verify control-plane liveness and PostgreSQL readiness in Compose
    cmds:
      - bash scripts/control-plane.sh verify

  agent-engine:lint:
    desc: Compile and policy-check the Python agent-engine contracts
    cmds:
      - bash scripts/agent-engine.sh lint

  agent-engine:test:
    desc: Run the Python agent-engine contract tests
    cmds:
      - bash scripts/agent-engine.sh test

  verify:
    desc: Run the CI-equivalent Stage 0 verification
    cmds:
      - bash scripts/verify.sh

  ci:
    desc: Run CI verification
    cmds:
      - bash scripts/verify.sh --ci

  ai:status:
    desc: Print durable task and Git status
    cmds:
      - bash scripts/ai-status.sh

  ai:handoff:
    desc: Validate and print the current handoff
    cmds:
      - bash scripts/ai-handoff.sh

  env:check:
    desc: Validate environment placeholders and exclusions
    cmds:
      - bash scripts/env-check.sh

  security:quick:
    desc: Run the Stage 0 secret-policy check
    cmds:
      - bash scripts/security-quick.sh
