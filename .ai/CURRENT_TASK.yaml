found_and_fixed:
  - >-
    R-549 shipped `lib/brand.ts` with two `@ts-expect-error` directives over imports TypeScript
    resolves on its own. An unused suppression is itself an error, so `next build` has failed on
    every generated web app since that task. Nothing caught it because the tests of that change
    asserted on the file's text, and the text was the defect. Found by building a generated
    project rather than reading one.
  - >-
    The generated `tsconfig.json` never set `allowJs`, so `lib/brand.ts` could not import the
    shared `brand/derive.mjs` and a fresh clone showed TS7016 in the editor and on `tsc`. This
    stayed invisible because `next build` writes `allowJs` into tsconfig.json itself on first
    run: the build repaired the file it was about to read, so only someone typechecking before
    their first build ever saw it. Found by the new gate, within a minute of it existing.
  - >-
    The same defect also made `RADIUS_VALUES[radius]` an implicit-any index under `strict`, which
    surfaced only once the suppressions above were removed.
