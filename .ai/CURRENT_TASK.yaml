objective: >-
  Fifth and final task in the sandbox-provider sequence (R-486..R-490). Adds the missing
  provider-selection surface making E2B/Vercel Sandbox/Daytona/gVisor genuinely pluggable and
  switchable via configuration - the founder's explicit ask. New runtime/sandbox_selection.py:
  a registry of the four real SandboxLifecycleProvider constructors, a SandboxSetup dataclass
  (active/selected/provider), and build_sandbox_from_env(selection=None, *, providers=None)
  mirroring bootstrap.py's own established build_runtime_from_env()/build_deploy_from_env() shape.
  Defaults to sandboxing disabled (selected=None) - zero behavior change until an operator
  explicitly opts in via OMNISTACKAI_SANDBOX_PROVIDER. The explicit selection parameter is the
  concrete "switch per userbase" mechanism (a caller can pass a per-user choice), documented as
  the extension point rather than built further, since real per-user plan wiring lives in the Go
  control-plane and is a separate, bigger integration. Deliberately not wired into studio/,
  control-plane, or console - matches every prior task's own scope boundary.
