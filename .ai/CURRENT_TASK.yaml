schema_version: 1
task_id: R-275
title: Rich App Dashboard Overview Page in Generated Next.js Web App
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Upgrade the generated Next.js app home page (app/page.tsx) from a static bare-bones HTML list
  into a rich, entity-aware dashboard overview page:
  - Make app/page.tsx a client component ("use client") to enable live React hooks.
  - Call useList<Entity>({ limit: 1 }) for each entity with Op.LIST wired, display .total as a
    live count badge in entity summary cards.
  - Render screen navigation cards for each primary screen (collection + form); exclude detail
    screens to keep navigation focused.
  - Render a "Quick Actions" section listing "+ Create {Entity}" CTAs to form screens.
  - Remove ir.description from the page body (it already appears in README.md) — fixes the
    existing diff-invariance violation in the old overview page.
  - Fall back cleanly when ir.entities is empty (no hook calls, no cards).
  - 100% offline, zero new IR fields, zero new npm dependencies.
