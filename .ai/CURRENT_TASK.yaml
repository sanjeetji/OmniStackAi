  founder_note: >-
    Founder asked (with Dyad screenshots for reference) to add more LLMs — DeepSeek, Groq, Grok, etc. —
    and a local-Ollama/custom path, done the platform's more advanced/optimised way. Committed directly
    to main; author solely sanjeetji; tooling adds a Co-Authored-By trailer.
