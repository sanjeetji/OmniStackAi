must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the IR schema (no new IR field; only Field.validation is interpreted further)
  - the R-250/R-251 max_length/enum/min/max tag behavior; rule-free Go structs stay byte-identical
  - the model-gateway, runtime, verify, edit, data-access, auth, seed, index public behavior (additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
  - the Python/FastAPI backend output (Pydantic already enforces; no Python change this task)
must_not_do:
  - add a platform Python dependency or a vendor SDK to the agent-engine; the validator dep lives only
    in the GENERATED project's go.mod
  - emit the validator dependency, validate.go, or a validateStruct call for a rule-free project
  - connect to or run a database; make a network call; install/build/run Go; put a secret anywhere
acceptance:
  - When at least one wired CREATE endpoint's entity has validation rules, go.mod contains
    `require github.com/go-playground/validator/v10 v10.22.1`.
  - internal/handlers/validate.go is emitted with `var validate = validator.New()` and a
    `func validateStruct(v any) (int, string)` returning http.StatusBadRequest / "validation_failed" on
    error, and importing github.com/go-playground/validator/v10.
  - Each such CREATE handler calls `validateStruct(m)` AFTER the json decode block and BEFORE the
    store.Create call, and writes http.Error(w, msg, status) + return on failure.
  - A rule-free IR (e.g. the existing Go-adapter fixture, minimal-blog, rideshare-favourites) emits NO
    validator require, NO validate.go, and NO validateStruct call (byte-identical CREATE handler).
  - An IR whose entities carry rules but which has no wired CREATE endpoint emits NO validate.go / dep
    (models still carry the R-251 tags).
  - Standard-library offline tests cover: enforcement emitted for a rules+create IR (go.mod, validate.go,
    handler call ordering), absent for rule-free, absent for rules-without-create, and examples-unaffected.
