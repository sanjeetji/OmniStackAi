  local_provider: ollama
  configured_model: qwen2.5-coder:14b
  local_calls: 0
  cloud_calls: 0
  note: >-
    Accounting is deterministic and needs no model call to implement or test. Any local live check
    uses Ollama; no cloud key is configured, so cloud_calls stay zero.
