title: "Studio build history + re-preview a recent build"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Give the local Studio a bounded, in-session memory of recent builds and let the operator re-preview any of
  them. Add a dependency-free, thread-safe StudioBuildHistory (stdlib only) that records each successful build
  as a bounded, secret-free entry (id, truncated prompt, name, entities, file_count, target_dir, commit_sha,
  created_at) capped at a fixed number of most-recent entries (injected clock for deterministic tests). Expose
  GET /api/history (recent builds newest-first) and, in trusted-local preview mode only, POST /api/history/
  preview {id} to re-preview a recorded build's already-materialized repo through the R-422 StudioPreviewManager.
  Record history from the live build path in both Studio modes; wire re-preview only in preview mode (build-only
  404). Add a Studio-page "Recent builds" list that loads on start, refreshes after each build, and re-previews
  on click with textContent only (no HTML injection). Preserve collision-free preview ports, status/stop/restart,
  trusted-local studio:preview, build-only studio:serve, single-session cleanup, PostgreSQL, and offline verify.
requirements:
  - Bounded thread-safe StudioBuildHistory (fixed max recent entries, oldest evicted; bounded secret-free entries; injected clock).
  - GET /api/history over the stdlib server via injected handler; unset handler 404.
  - POST /api/history/preview {id} re-previews a recorded build via the R-422 manager; preview mode only; unset 404; unknown/missing id -> bounded error.
  - Record every successful build into history from the live build path (both modes).
  - Studio-page recent-builds surface wired to /api/history and re-preview to /api/history/preview, no HTML injection.
  - Keep R-421/R-422 studio/preview/server/local-run contracts compatible and single-session cleanup intact.
  - Deterministic/offline verify via injected fakes.
acceptance_criteria:
  - record returns id; list newest-first + bounded; get by id; public view JSON-safe + secret-free with bounded prompt.
  - GET /api/history returns {builds:[...]} when wired, 404 when not; POST /api/history/preview known id -> preview payload, 404 when disabled, missing/unknown id -> bounded error, no crash.
  - A successful build is recorded and appears in GET /api/history.
  - Studio page exposes recent-builds list wired to /api/history and re-preview to /api/history/preview.
  - Existing contracts compatible; focused + full verify + lint + security + env + both builder demos pass; 0 model calls in verify.
