  (5) Console-Web UI: Studio Manage -> Payments tab with Stripe & Razorpay cards, setup checklist, webhook copy box,
  live secrets status indicators (never rendering keys), and test mode badge;
  (6) Quality gates: scripts/test.sh contract assertions, Go tests, Python tests, Next.js build/lint, task verify.
