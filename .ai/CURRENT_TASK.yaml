  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install, run, verify, or deploy a generated app; connect to a database; make an external request
  - add a platform dependency, front-end bundler, service, top-level folder, or vendor SDK
  - include an API key, secret value, user prompt, repository content outside the bounded demo, or HTML injection
acceptance:
  - The console snapshot contains a JSON-serializable, deterministic builderShowcase object with an
    R-245 ProjectPlan for a bundled IR example; apps/web and services/api expose preview + verify
    details and no deploy plan unless explicitly supplied.
  - The snapshot contains an R-246 edit preview built from two actual assembled Application IR values,
    including structured changed-file metadata and a non-empty hunk-level unifiedPatch.
  - The committed snapshot contains no secret values; environment state is represented only by the
    existing provider booleans/metadata.
  - The static console renders the plan, gate ladders, preview URLs, requested change, changed files,
    and unified patch using textContent-only DOM construction with no external requests.
  - Offline standard-library tests cover snapshot shape, real plan/patch content, determinism, and
    secret exclusion; node --check validates app.js; task console:snapshot reproduces the committed JSON.
