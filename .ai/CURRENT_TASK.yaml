objective: >-
  Multi-turn chat / "continue editing this app" in the Studio: a generic, validated delta mechanism
  (intake/app_delta.py, a non-pack-coupled sibling of solution_packs/ai_delta.py) lets a follow-up prompt
  propose new entities/apis/screens, merged onto the current ApplicationIR by tuple concatenation
  (mirroring solution_packs/application.py's merge, backstopped by ApplicationIR.__post_init__ and
  validate_ir/has_errors), diffed via the EXISTING unmodified edit/diff.py::plan_edit and applied via the
  EXISTING unmodified edit/apply.py::commit_edit (one new commit on the same repo). New in-memory
  StudioSessionStore (studio/session.py) tracks the current IR + turn history per build id, server-only
  (never sent to the browser). New POST /api/build/{id}/edit + GET /api/build/{id}/turns routes (via the
  R-467 _build_id_for_suffix pattern), wired unconditionally in live_serve.py (no toolchain needed). page.py
  gets a small follow-up chat box. v1 scope: additive-only changes; works for plain-prompt and
  single-surface ecosystem builds; Solution Pack and all-surfaces ecosystem builds get an honest
  "not supported" error (EditNotSupportedError) rather than being silently ignored or guessed at. No changes
  to edit/, git_service/, or application_ir/. Every resolve_generation_provider_from_env call site in every
  new test is mocked from the start. Found and fixed while implementing: neither this module nor the
  ai_delta.py pattern it mirrors validated a proposed screen's role against the base IR's real declared
  roles (caught only as a last resort by ApplicationIR's own validation, too late for the retry loop to use
  it) - added an explicit role-existence check at both the parse layer (gets the retry benefit) and the
  merge layer (defense in depth), plus listing real roles in the prompt.
