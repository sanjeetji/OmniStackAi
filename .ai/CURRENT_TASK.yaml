schema_version: 1
task_id: R-270
title: Bulk Selection & Batch Deletion in Generated Next.js Collection Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add multi-record bulk selection and batch deletion workflows to generated Next.js collection screens:
  - Add row selection state (checkedIds: string[]) with select-all, clear-selection, and individual row toggle handlers.
  - Render a master checkbox in table <thead> with aria-label="Select all", checked={isAllChecked}, and onChange={handleCheckAll}.
  - Render an item checkbox in each <tbody> table row with aria-label, checked={checkedIds.includes((item as any).id)}, and onClick={(e) => e.stopPropagation()}.
  - Update table loading and empty state colSpan to account for the checkbox column (+1).
  - Highlight selected rows with an active background color.
  - When checkedIds.length > 0, render a contextual Bulk Actions toolbar above the table:
    * Displays "{checkedIds.length} {name/plural} selected".
    * Includes a "Clear selection" button to clear current selection.
    * When Op.DELETE is wired, includes a "Delete Selected ({checkedIds.length})" button.
  - In handleBatchDelete:
    * Confirm via window.confirm("Are you sure you want to delete {count} {name/plural}?").
    * Track batchDeleting loading state and batchDeleteError error state.
    * Perform concurrent deletion via Promise.all(checkedIds.map(id => remove(id))).
    * Clear checkedIds, trigger refetch(), and reset loading state.
    * Display batch delete error alert if deletion fails.
  - Clean up checkedIds when an individual row is deleted via handleDelete(id).
  - Maintain strict diff invariance across ir.description modifications.
  - Fully offline, 0 network, 0 external dependencies.
