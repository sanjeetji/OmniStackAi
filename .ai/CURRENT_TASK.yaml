  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [15, 51, 55, 64, 75, 87, 74, 77, 91, 92]
  founder_note: >-
    Founder asked to wire Tier 0-3 so keys just plug in, with Tier 0/1 (local) working now. Committed
    directly to main. Author solely sanjeetji; tooling adds a Co-Authored-By trailer.
