must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the ModelProvider contract, gateway routing policy, or the runtime/verify/codegen behavior (additive)
  - local Ollama as the always-on sub-L3 default; no silent cloud fallback
  - the network-independence of static task verify; the Section 74 top-level contract; offline bootstrap
must_not_do:
  - make any network call in bootstrap/overview or tests; add an external Python dependency; import a vendor SDK
  - place an API key in a command, log, error, record, repr, or the overview snapshot
acceptance:
  - New built-in specs (deepseek, xai, mistral, together, fireworks) exist as OpenAI-compatible
    providers with an HTTPS base URL, a distinct key env, a model env, and a default model; each
    registers only when its key is present and stays inactive otherwise.
  - A custom provider can be declared from the environment (OMNISTACKAI_CUSTOM_PROVIDERS + per-provider
    base URL / key / model) and becomes a first-class OpenAI-compatible provider with no code change;
    invalid config (bad id, missing/invalid base URL, collision with a built-in) raises a clear error.
  - resolve_provider_specs() merges built-ins + custom; bootstrap registers, selects (cloud tier), and
    chains (fallback) any built-in or custom provider by its key; the overview lists every provider with
    active reflecting only key presence (never the value).
  - The price book has illustrative, operator-overridable defaults for the priced new providers;
    unknown/custom models are recorded as unpriced, not guessed.
  - Standard-library offline tests cover the new specs, adapter construction/dispatch shape, custom-spec
    parsing + error cases, spec resolution/merge, bootstrap registration + selection + fallback, and
    no-key-leak. task verify stays green and network-independent.
required_gates:
  - impact_analysis
  - new_provider_spec_tests
  - custom_provider_parse_and_error_tests
  - spec_resolution_merge_tests
  - bootstrap_registration_selection_fallback_tests
  - no_key_leak_test
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
