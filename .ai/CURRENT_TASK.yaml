objective: >-
  Background jobs and scheduling in generated apps. A `jobs` capability declares scheduled rules over
  an entity ("cancel unpaid orders after 30 minutes", "mark invoices overdue once the due date passes",
  "delete drafts older than 30 days"): which rows (state, age), how often, and what happens (a workflow
  transition, set fields, delete). Every backend (Python, Go, Express, Hono) runs them on a
  Postgres-backed scheduler - one bounded statement per run, recorded runs, retries with backoff, a
  dead letter an admin can retry, safe with several API replicas - and the admin console shows the
  schedules and runs. Planned from the prompt as well as by the model.
