objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Phone Number Input compound
  component suite (components/phone-input.tsx): a country selector (ISO2 code + dial code, from a curated
  DEFAULT_COUNTRIES table, overridable) plus a national-number field that strips non-digits, groups them
  loosely for display, assembles an E.164 string (dial + digits), and validates by digit length; a computed
  meta object ({country, national, e164, valid}); controlled + uncontrolled national value; onChange(e164,
  meta) callback; WAI-ARIA (labeled select + input, aria-label, inputMode="tel", aria-invalid); 4 futuristic
  visual styling variants ("default", "card", "glass", "neon"); 3 size scales ("sm", "md", "lg"); React ref
  forwarding (forwardRef); useImperativeHandle (PhoneInputHandle: getValue/getE164/setValue/getCountry/clear/
  focus); and explicit displayName across compound and semantic alias exports (PhoneInput, PhoneNumberInput,
  TelInput, PhoneField, default). Static module constant — never references ir.name/ir.description;
  ASCII-only source (ISO country codes + dial codes, no flag emoji).
