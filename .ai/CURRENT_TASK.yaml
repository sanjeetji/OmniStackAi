objective: >-
  A verified integrations catalog with health tests (R-055, R-056, proves R-511). One catalog of
  every integration a project or account can add (email, analytics, payments, AI keys, hosting),
  each saying how it is verified. "Test" makes a real, free call to the provider with the saved
  credentials (no model is run, nothing is charged, no email is sent) instead of checking the
