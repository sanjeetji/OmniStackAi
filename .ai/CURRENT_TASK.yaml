schema_version: 1
task_id: R-296
title: "Generated Web App Accessibility Pass: Semantic ARIA Roles, Live Regions, Table Sort State, and Accessible Search/Pagination Controls"
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Bring the generated Next.js web application to enterprise accessibility standards (WCAG 2.1 AA / WAI-ARIA)
  across all screen types without changing public hook APIs or backend semantics. Add role="alert" and
  aria-live="assertive" to every error banner (collection top-level, detail main, subcollections, form submit);
  add aria-label to collection and subcollection search inputs; add WAI-ARIA aria-sort state to sortable table
  column headers in collection screens; wrap collection pagination in a <nav aria-label="Pagination"> container
  with aria-labels on Previous/Next buttons (and subcollection pagination); and add role="status" to empty-state
  messages so screen readers announce list conditions. Fully deterministic, offline, and description-only stable.
tracker_ref: "R-296"
requirements:
  - Error banners across collection list, detail screen, subcollections (both collection and detail views), and form submission emit role="alert" and aria-live="assertive" so assistive technologies announce errors immediately.
  - Collection search input emits aria-label="Search <plural>" and subcollection search input emits aria-label="Search <child_plural>".
  - Sortable table headers in the collection screen emit aria-sort with "ascending", "descending", or "none" matching current params.sort and params.order.
  - Collection pagination footer is wrapped in <nav aria-label="Pagination"> and its Previous/Next buttons emit aria-label="Previous page" and aria-label="Next page".
  - Subcollection pagination buttons emit aria-label="Previous page" and aria-label="Next page".
  - Empty-state message containers in collection and subcollection lists emit role="status" for polite announcement.
  - All existing text strings, retry buttons, skeletons, and hook contracts are strictly preserved; diff-invariant across ir.description.
acceptance_criteria:
  - Collection, detail, subcollection, and form error banners emit role="alert" and aria-live="assertive".
  - Collection and subcollection search inputs emit the expected aria-label attributes.
  - Table header <th> elements emit aria-sort matching params.sort and params.order.
  - Collection pagination renders inside <nav aria-label="Pagination"> and has accessible button labels.
  - Subcollection pagination buttons have aria-label="Previous page" and aria-label="Next page".
  - Empty state messages include role="status".
  - Description-only IR changes remain byte-identical; both example projects generate cleanly.
  - Focused tests, full offline verification, lint, security check, env check, and both builder demos pass.
