schema_version: 1
task_id: R-276
title: Record Selector Dropdown, Prev/Next Record Navigation & Deep-Link Sync in Generated Next.js Detail Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Enhance generated Next.js detail screens (apps/web/app/<screen>/page.tsx) with an interactive
  record selector dropdown, sequential previous/next navigation buttons, automatic URL query param
  sync (?id=...), and a quick-pick recent records grid in the empty state.
tracker_ref: "R-276"
requirements:
  - When Op.LIST is wired for the entity, detail screens import useList<Plural> from ../lib/hooks.
  - Detail screens render a styled <select> dropdown in the ID selection section offering "-- Choose {name} --"
    followed by existing items labeled with the best descriptive field (e.g. title, name, label, email, or id).
  - Selecting an item from the dropdown or clicking a recent record updates selectedId, idInput, and synchronizes
    the URL search params (?id=<id>) using window.history.replaceState.
  - When an entity record is displayed and list data is available, render contextual "< Prev" and "Next >"
    navigation buttons allowing users to cycle through records sequentially.
  - In the empty state (when no record is selected), render a "Recent {plural}" grid of clickable card tiles
    so users can immediately inspect a record with one click instead of needing to know a UUID.
  - Fall back cleanly when Op.LIST is not available (keeps manual ID input, no hook import, no broken code).
  - 100% offline, zero new external npm dependencies, zero new IR fields, strict diff invariance.
acceptance_criteria:
  - Detail screen imports useList<Plural> when Op.LIST is wired.
  - Detail screen does not import useList<Plural> when Op.LIST is not wired.
  - Dropdown <select> is rendered with placeholder and options when Op.LIST is wired.
  - Prev and Next buttons are rendered and properly disabled at boundary indices.
  - Empty state displays recent records card grid when list items exist.
  - URL synchronization logic via searchParams / history.replaceState is emitted.
  - Strict diff invariance: changing only ir.description produces byte-identical output.
  - task verify passes (expect 705+ tests passing, 0 failures).
  - task lint and task security:quick pass.
  - builder:demo passes for minimal-blog and rideshare-favourites.
allowed_paths:
