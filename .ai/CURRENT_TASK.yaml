must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the gateway/adapter/accounting runtime behavior (R-005..R-222) except adding env-driven wiring
  - the single-provider default outcome when no fallback chain is configured
  - local Compose services or infrastructure; the Section 74 contract; the offline bootstrap contract
  - the network-independence of static task verify
must_not_do:
  - fall back outside the explicitly configured chain; enable the breaker when no chain is configured
  - store any API key/secret in the snapshot, console, logs, or repo
  - add an external dependency or a provider SDK
acceptance:
  - OMNISTACKAI_FALLBACK_PROVIDERS builds an ordered fallback chain from registered providers (local via
    'ollama', cloud via provider name); a named provider that is unknown or has no key raises a clear
    configuration error.
  - A circuit breaker (OMNISTACKAI_CIRCUIT_FAILURE_THRESHOLD / OMNISTACKAI_CIRCUIT_COOLDOWN_SECONDS,
    with safe defaults) is attached to the gateway only when a fallback chain is configured.
  - With no chain configured, build_gateway_from_env is behaviorally identical to before (no breaker,
    no fallback).
  - GatewayBootstrap exposes the fallback chain provider ids and breaker settings; the overview snapshot
    and console render a resilience panel; no key/secret appears anywhere.
  - Standard-library offline tests cover chain building, unknown/no-key errors, breaker attachment, the
    unchanged default, and the snapshot fields.
  - task verify stays green and network-independent.
required_gates:
