objective: >-
  R-566 generated working transition handlers and stopped there. The OpenAPI contract described an
  API without them, and the typed client had no function to call one, so a lifecycle existed in the
  backend and nothing outside it could reach it. An endpoint nobody can call is not far from one
  that does not exist.
  The contract now documents every transition — the path, the states it is allowed from, the role
  it requires, and a 409 for a legal request from an illegal state — and the typed client gains a
  function per transition, exported beside the CRUD ones. All three come from the one derivation
  the handlers already used, so they cannot describe different endpoints.
  Scoped down while doing it, and recorded rather than implied: Go and Node still emit the 501
  scaffold for transitions, and the deterministic screens do not yet offer them as actions. Each
  is a careful job of its own — the page generator is ~74k lines and intent-based — and doing
  three things half-way is the failure this repository keeps meeting.
founder_gate: >-
  Founder on 2026-09-26: do all of them, one by one.
