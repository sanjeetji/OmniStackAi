acceptance:
  - Child form screens import parent list hooks (useList<ParentPlural>) when MANY_TO_ONE relations exist with Op.LIST.
  - Child form screens invoke parent list hooks to fetch parent entity candidates.
  - Foreign key fields render as accessible <select> dropdowns with parent options displaying parent title/name.
  - Navigating with parent query parameter (?article_id=... or ?postId=...) pre-populates the foreign key in formData.
  - Foreign key selectors participate in client-side required validation and fieldErrors display.
  - Entities without relations omit relation list hooks and render standard inputs without overhead.
  - Diff invariance maintained across ir.description modifications.
  - task verify green; 0 network calls.
