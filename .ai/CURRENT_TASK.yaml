completed_at: "2026-09-17"
objective: >-
  Founder tried the real R-470 console in a browser and reported registration silently did
  nothing. Root cause found in the dev server's own log: Next.js 16 blocks cross-origin access to
  its dev/HMR resources by default, and 127.0.0.1 (the URL given to the founder) is a different
  origin than localhost as far as that check is concerned - with no client JS hydrated, the
  register form's onSubmit handler never attached, so the browser's native default form submission
  fired instead (a GET request with email/password serialized into the URL query string, doing
  nothing). Fixed with allowedDevOrigins in next.config.ts; verified live by fetching the actual
  client JS chunk the register page references with Origin: http://127.0.0.1:4321 and confirming
  both a 200 and the absence of the previously-triggered warning in the dev server log.
  Also implemented the founder's request to add more registration fields: added full_name (broadly
  useful - personalization, addressing the user, the home page previously only showed an email) but
  explicitly did NOT add Gender or Age (no function anywhere in this product's roadmap, unnecessary
  PII/privacy liability for zero benefit) - a deliberate decision, not a silent omission. Threaded
  full_name through a new migration (000003_users_full_name), the control-plane's Store/auth
  handler, and the console's register form and home page greeting. Renumbered the kickoff doc's
  Phase C from R-471 to R-472 since this task took the R-471 slot as its own real, scoped work.
