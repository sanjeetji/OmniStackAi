objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Marquee / Ticker compound
  component suite (components/marquee.tsx): a seamless continuous scroller for arbitrary children (news
  tickers, logo walls, announcement bars) that duplicates its content once for a seamless -50% loop, driven
  by CSS @keyframes injected via an inline <style> element (omni-marquee-x / omni-marquee-y with
  animationDirection for left/right/up/down); configurable durationSeconds, gap, and edge gradient fade via
  CSS maskImage; pause-on-hover plus a controlled paused prop and an imperative pause/resume/toggle handle
  (animationPlayState); a CSS prefers-reduced-motion guard that stops the animation; accessibility (the
  duplicated copy is aria-hidden, the container carries an aria-label); 4 futuristic visual styling variants
  ("default", "card", "glass", "neon"); 3 size scales ("sm", "md", "lg"); React ref forwarding (forwardRef);
  useImperativeHandle (MarqueeHandle: pause/resume/toggle/isPaused); and explicit displayName across
  compound and semantic alias exports (Marquee, MarqueeTicker, ScrollingBanner, NewsTicker, default). Static
  module constant — never references ir.name/ir.description.
