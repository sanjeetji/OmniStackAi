branch: ai/R-562-apps-are-apps
objective: >-
  "A platform for food delivery with a marketing website, admin panel, customer + driver apps"
  returns four Next.js websites. `ecosystem.py` builds every surface with `MobileProfile.NONE` and
  `WebStrategy.NEXTJS` hardcoded, so the driver "app" is a web page, and `assemble_ecosystem` only
  ever picks a Next.js adapter. A user who asked for an app is handed a website with no explanation.
  This is the same silent downgrade R-559 removed for stacks, still present for surfaces: R-559
  substitutes and explains when we cannot build what was asked for, but here we *can* build it and
  simply do not.
  Three parts: decide per surface whether it is an app or a site, assemble mobile surfaces with the
  React Native adapter, and let the monorepo and the preview carry more than one mobile app — there
  is exactly one `apps/mobile` today, and the run plan hardcodes it.
founder_gate: >-
  Founder on 2026-09-25: do not silently hand back web when apps were asked for; generate apps in
  React Native by default so the user is not frustrated.
allowed_paths:
  - services/agent-engine/src/omnistackai_agent_engine/intake/
  - services/agent-engine/src/omnistackai_agent_engine/codegen/
  - services/agent-engine/src/omnistackai_agent_engine/localrun/
  - services/agent-engine/tests/
