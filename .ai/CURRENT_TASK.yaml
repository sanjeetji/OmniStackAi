objective: >-
  First brick of the differentiating spine (founder-approved pivot, Master Architecture Spec section 2).
  Add a Python-3.13-stdlib-only intake/scope_compiler.py that turns a plain-English business prompt into a
  framework-neutral ScopeProposal: detected domain (+confidence +matched keywords), business actors, the
  multi-surface app ecosystem (customer app + merchant/driver/admin portals), and build-scope options
  (Complete Business Platform [recommended] / Customer Experience Only / Custom) plus <=3 high-materiality
  questions. Classification is a deterministic curated keyword heuristic (no model/network/clock/randomness),
  so it is pure and runs under task verify. Ship a deterministic CLI (task agent-engine:scope:propose) so the
  founder can see it. Do NOT wire scope -> IR/repo generation yet; no IR/adapter/DB change; task verify stays
  offline/deterministic (0 model calls).
