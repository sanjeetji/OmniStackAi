schema_version: 1
task_id: R-258
title: Query Parameter Sorting (sort & order) on LIST Endpoints with SQL Injection Whitelist Protection
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add query parameter sorting (sort field and order=asc|desc) to GET list and parent-scoped list endpoints
  across Go and FastAPI backends, with strict whitelist validation against entity fields to prevent SQL injection:
  - backend_go / data_access: parse sort and order, validate against known entity fields in Go store,
    emit ORDER BY <col> ASC|DESC LIMIT $1 OFFSET $2.
  - backend_python / data_access: add sort and order query params to FastAPI router, validate against
    whitelisted fields in repository, emit safe ORDER BY {col} {dir} LIMIT %s OFFSET %s.
  - nextjs: reflect sort and order options in lib/api.ts.
  - pure codegen change; no new platform dep, no install/build/run/DB.
