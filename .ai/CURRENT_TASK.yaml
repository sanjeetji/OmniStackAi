title: "Collision-free Studio preview ports + status/stop/restart controls"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Make the trusted-local Studio preview robust against port collisions and give the operator bounded
  lifecycle control. Add automatic collision-free API/web port allocation (distinct free loopback ports per
  preview, threaded through the R-419 run plan and the generated app's NEXT_PUBLIC_API_URL) so a preview
  never fails or clobbers an existing task app:run app on 3000/8000 or a prior preview. Add bounded
  status/stop/restart to StudioPreviewManager (single remembered repo, single owned session, fixed-shape
  secret-free payloads) exposed over the stdlib Studio server as GET /api/preview, POST /api/preview/stop,
  POST /api/preview/restart, wired only in trusted-local preview mode (build-only returns 404). Add Stop/
  Restart controls + a live status line to the Studio page without HTML injection. Preserve trusted-local
  studio:preview, build-only studio:serve, single-session cleanup, offline deterministic verify, PostgreSQL,
  and the existing architecture.
requirements:
  - Allocate two distinct currently-free loopback ports per preview; build-only studio:serve and app:run CLI unchanged.
  - Add start_preview_app in localrun that allocates ports, builds the env plan with them, and delegates to strict start_app.
  - Extend StudioPreviewManager with bounded, JSON-safe, secret-free status()/stop()/restart(); restart before any build is idle; after a build re-previews the last repo; stop is idempotent.
  - Extend the stdlib Studio server with optional injected status_fn/stop_fn/restart_fn -> GET /api/preview, POST /api/preview/stop, POST /api/preview/restart; unset handlers 404.
  - Wire control handlers to the manager only in trusted-local preview mode.
  - Add Stop/Restart buttons + status line to the Studio page (no innerHTML of server data; keep loopback URL validation and the sandboxed iframe).
  - Keep single-session ownership and cleanup on replace/stop/shutdown.
  - Deterministic/offline verification via injected/stubbed run, process, readiness, and port boundaries.
acceptance_criteria:
  - Preview uses automatically allocated distinct free ports; start_preview_app overrides plan api/web ports and delegates to start_app.
  - status/stop/restart return bounded secret-free dicts; restart idle before build, re-previews last repo after; stop reports stopped and is idempotent.
  - GET /api/preview + POST /api/preview/stop + /restart return manager state in preview mode and 404 when disabled; GET / /healthz POST /api/build unchanged.
  - Studio page exposes Stop/Restart controls that call the routes and re-render preview state.
  - R-421 studio/preview/local-run contracts remain compatible; focused + full verify + lint + security + env + both builder demos pass; 0 model calls in verify.
