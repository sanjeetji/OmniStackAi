must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway, Application IR, codegen contract, and Next.js/Python adapter public behavior (additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install, build, or run the generated Go service; write generated files to disk in this task
  - add an external Python dependency to the platform; use any non-stdlib import in the generated Go
  - store secrets (generated .env.example holds placeholders only)
acceptance:
  - GoBackendAdapter implements FrameworkAdapter (target backend-go) and returns a GeneratedProject
    forming a coherent Go net/http service (go.mod, main.go, internal/models/models.go,
    internal/handlers/<segment>.go, README, .gitignore, .env.example).
  - Entities become Go structs (field types mapped; exported fields with json tags; non-required
    fields are pointers with ,omitempty). IR APIs become Go 1.22 mux routes ("METHOD /path" with
    {param}); handlers are grouped by first path segment, return 501, and read params via r.PathValue.
    main registers each route and a GET /healthz.
  - All paths are safe and deterministically ordered; generation is a pure function of the IR;
    standard-library only (platform + generated Go); nothing installed/built/run/written to disk.
  - Standard-library offline tests assert emitted paths and key contents for a representative IR,
    entity->struct mapping, route registration/params, and registry wiring.
  - task verify stays green and network-independent.
required_gates:
