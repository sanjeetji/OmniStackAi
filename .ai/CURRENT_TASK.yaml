requirements:
  - Collection search input renders an accessible inline Clear button (×) when searchInput is non-empty.
  - Clicking collection search Clear resets input, commits empty search to hook, and refocuses search input.
  - Subcollection master-detail search input renders an accessible Clear button (×) when search state is non-empty, clearing query on click.
  - Form screens automatically emit autoFocus on the first editable field (text, textarea, number, select, or checkbox) to enable immediate keyboard input.
  - Preserves all existing keyboard navigation, debounce, and error behaviors.
  - Backward-compatible, offline, deterministic (0 model calls), and diff-invariant across ir.description.

