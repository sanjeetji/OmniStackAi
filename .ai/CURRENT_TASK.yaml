next_action: >-
  R-484 shipped. Two real bugs found and fixed along the way: SSE route sent Connection:
  keep-alive (hung every real client - fixed to Connection: close), and RecordingProvider (every
  real build's usage-tracking wrapper) had no .stream() method (fixed, +4 tests). Real curl -N
  smoke through the live Go control-plane confirmed genuine incremental frames, a real done frame
  (177 files), and a real trailing credits frame. Next: R-485 (console: streaming build UI) to
  consume POST /jobs/build/stream in studio-chat.tsx's sendBuild() via fetch() + manual
  response.body.getReader() parsing (not EventSource, since the request needs a POST body), plus a
  new Next.js proxy route relaying the upstream stream through after auth-gating. Then, per the
  founder's stated build order, scope (not yet build) full per-user process/sandbox isolation.
