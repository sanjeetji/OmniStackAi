schema_version: 1
task_id: R-287
title: Race-Safe Generated Detail Refetches
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make generated use<Entity> detail hooks race-safe so rapid record selection, deep-link, prev/next, or
  ID changes cannot let an older GET response overwrite the currently selected record's state. Reuse the
  proven R-286 LIST_BY AbortController design (signal passed after caller options), scoped to the detail
  hook only.
tracker_ref: "R-287"
requirements:
  - Each generated use<Entity> detail hook owns an AbortController ref (useRef, already imported).
  - refetch aborts the previous detail request before handling an empty/missing record ID.
  - Clearing the ID cancels in-flight work and resets record/loading/error state (setData(null), setError(null), setLoading(false)).
  - A valid ID creates and registers a new controller.
  - Pass the internally owned signal after caller-provided options so callers cannot replace it.
  - An aborted successful response must not update current record state.
  - AbortError and controller-aborted failures must not surface as user errors.
  - Only the currently active request may clear loading state.
  - Effect cleanup aborts the active request on ID change or unmount.
  - Preserve public hook name, params, return value, and current generated API-client behaviour.
  - Do not alter top-level list (useList<Entities>) or LIST_BY (useList<Child>By<Parent>) hooks.
  - Preserve deterministic generation and description-only IR stability.
acceptance_criteria:
  - The use<Entity> hook emits `const abortRef = useRef<AbortController | null>(null);` and `abortRef.current?.abort();` before the `if (!id)` reset.
  - The missing-ID branch resets setData(null), setError(null), setLoading(false).
  - The GET call is `api.get<Entity>(id, { ...options, signal: controller.signal })` (signal after options); the old `api.get<Entity>(id, options)` form is gone.
  - Success guarded by `if (controller.signal.aborted) return;` before setData; catch guarded by the AbortError check; finally clears loading only when not aborted.
  - Effect cleanup returns `() => abortRef.current?.abort();`.
  - List and LIST_BY hook output is unchanged; description-only IR changes remain byte-identical.
  - Focused R-287 tests, relevant detail/hook tests, full offline verification, lint, security, env check, and both builder demos pass.
