objective: >-
  Notifications in generated apps: in-app and email, with each person's preferences. A
  `notifications` capability declares rules - an entity's event (created, changed, deleted, or a
  field becoming a value such as status -> shipped), who hears (the creator, the assignee, a user
  field, a role), a title and body from the record's fields, and channels. A trigger writes each
  notification in the database, so Python, Go, Express and Hono deliver the same ones; scheduled jobs
  gain reminders ("a day before the appointment"), once per record. In-app notifications are live
  (R-569) behind a bell; email goes through an outbox with retries (Resend, keys last). People mute a
  rule or everything per channel. Planned from the prompt too.
