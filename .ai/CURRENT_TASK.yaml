  - services/agent-engine/tests/**
must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the R-005 records/registry, R-006 Ollama adapter, R-007 gateway routing, R-008 cloud generate, or R-009 accounting public behavior
  - local Compose services or infrastructure
  - auth, organizations, billing, Git integration, audit, or business APIs
  - native mobile or device-cloud functionality
  - the Section 74 top-level monorepo contract; no new top-level directory
  - the network-independence of static task verify
must_not_do:
  - make any real cloud API call (no key set; tests use injected fake streaming responses)
  - add an external Python dependency or a provider SDK
  - place any API key value in source, tests, logs, records, or commits
acceptance:
  - Each cloud adapter streams incrementally by parsing provider SSE, yielding ordered StreamEvent deltas and one final event with done=True and measured token usage (usage only on the final event).
  - Streaming reuses bounded line/response sizes, finite timeouts, redirect rejection, bounded concurrency, and maps failures to stable platform-owned errors without leaking the key or raw bodies.
  - OpenAI-compatible streaming requests usage in the final chunk; Anthropic maps message_start/content_block_delta/message_delta/message_stop; Gemini uses streamGenerateContent with SSE.
  - The non-streaming generate path and all other adapter behavior are unchanged.
  - Standard-library offline tests drive each provider's SSE parser with injected fake streaming responses covering multi-chunk deltas, final usage, and malformed/oversized lines, with zero network access.
  - Static task verify stays network-independent and green.
required_gates:
  - impact_analysis
  - python_compile_test
  - cloud_streaming_parser_tests
  - stream_failure_and_bound_tests
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
model_tool_trace:
  routing: local_only
  local_provider: ollama
  configured_model: qwen2.5-coder:14b
  local_calls: 0
  cloud_calls: 0
  note: >-
    SSE parsing is exercised offline with fake streaming responses; no cloud key is set, so no cloud
    call is made. Any local live check uses Ollama.
