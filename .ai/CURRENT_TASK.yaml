schema_version: 1
task_id: R-251
title: Field validation for Go + numeric min/max (all three schema/model targets)
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Extend R-250 field validation to the Go backend and add numeric bounds (Brief 9/26/27). Two additions
  to the existing field_validation parser: numeric min:<n> / max:<n> rules, and a go_validate_tag helper.
  The rules now flow into all three targets — schema (VARCHAR / CHECK enum / CHECK numeric bounds),
  FastAPI Pydantic (Field(max_length=, ge=, le=) + Literal), and Go models (a go-playground
  validate:"max=,oneof=,gte=,lte=" struct tag on each field with rules; rule-free fields keep a plain
  json tag). Go tags are declarative (enforcement wiring — validator.Struct + go.mod dep — is a
  follow-up); the schema already enforces for both backends at the DB. Additive/offline; examples
  unchanged; nothing connects to or runs a database.
