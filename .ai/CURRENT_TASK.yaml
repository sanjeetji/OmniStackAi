objective: >-
  A modern admin panel. The generated admin console gets an app shell (collapsible sidebar with
  every entity and page, a top bar, a command menu on Ctrl/Cmd+K, a phone-width drawer), a dashboard
  built only from real data (record counts, a chart of them, the latest records per entity - no
  invented figures), and a management page per entity: a sortable, searchable, paginated table with
