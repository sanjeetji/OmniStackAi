objective: >-
  Fourth of the five-task sandbox-provider sequence (R-486..R-490) - replaces the originally
  planned WebContainers option after real research found it requires a paid commercial license
  for any non-prototype use. Adds a real, free, self-hosted SandboxLifecycleProvider backed by
  gVisor (a genuinely open-source, low-lift Docker/OCI runtime, unlike self-hosting Firecracker or
  the E2B/Daytona orchestrators). Talks to the LOCAL Docker Engine API over its Unix socket (a new
  docker_socket.py transport, since urllib has no Unix-socket support) rather than a remote HTTPS
  API. active checks the local daemon for the runsc runtime being registered - a live capability
  check, not an env-var check, since this provider has no credential. Positioned explicitly as a
  free/dev tier alongside the three paid managed providers, not a production replacement - a
  self-hosted sandbox's loopback URL only works for a same-machine viewer, so production/remote
  users still need a managed provider's public routing/proxy layer.
