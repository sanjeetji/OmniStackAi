schema_version: 1
task_id: R-223
title: Env-driven fallback chain and circuit breaker wiring in the gateway bootstrap
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-223-env-fallback-wiring
goal: >-
  Make the R-221 cross-provider fallback and circuit breaker configurable from the environment through
  build_gateway_from_env, so an operator can enable resilience without code. OMNISTACKAI_FALLBACK_PROVIDERS
  defines an ordered fallback chain of already-registered providers (local or key-present cloud), and a
  circuit breaker (threshold/cooldown from env) is attached whenever a chain is configured. The console
  overview snapshot surfaces the fallback chain and breaker settings. Default behavior (no chain) is
  unchanged.
