acceptance:
  - Subcollection detection sets can_delete=True on SubcollectionInfo when child entity supports Op.DELETE.
  - Subcollection detection sets can_delete=False when child entity lacks Op.DELETE.
  - Collection screens import useDelete<Child> hooks for deletable child subcollections.
  - Collection screens instantiate delete hooks and handleDelete<Child> handlers with confirmation prompts and refetch.
  - Collection screens render Delete button on child cards with disabled state during mutation.
  - Collection screens render deletion error feedback alert banners when delete error occurs.
  - Dedicated detail screens (_detail_screen_page) mirror deletion hooks, handlers, error feedback, and buttons.
  - Non-deletable subcollections omit deletion hooks, handlers, error banners, and buttons.
  - Diff invariance maintained across ir.description modifications.
  - task verify green; 0 network calls.
