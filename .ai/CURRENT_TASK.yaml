  - services/agent-engine/tests/test_loading_skeletons.py
  - services/agent-engine/tests/test_screen_generation.py
  - services/agent-engine/tests/test_subcollection_screens.py
  - services/agent-engine/tests/test_detail_screen_lifecycle.py
  - .ai/**
