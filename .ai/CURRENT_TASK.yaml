schema_version: 1
task_id: R-265
title: Subcollection Navigation & Master-Detail Views in Generated Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Connect parent entity views (e.g. Post in minimal-blog) to nested child subcollections
  (e.g. Comments) using already-generated useList<Entities>By<Rel>() hooks and API endpoints:
  - Detect foreign-key relations for entities on collection/detail screens.
  - For parent entities with subcollections, render an interactive nested detail view / tabbed
    subcollection section displaying child items scoped to the parent ID (useList<Entities>By<Rel>(parentId)).
  - Render subcollection total count badges and child item lists.
  - Support dedicated detail screens (intent == 'detail') with parent attributes and subcollections.
  - Ensure fallback safety for entities without subcollections.
  - Maintain diff invariance across ir.description changes.
  - Additive, offline, 0 network, 0 external deps.
