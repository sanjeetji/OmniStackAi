task_id: R-425
id: R-425
title: "Per-build repo actions - copy path + open folder"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Let the operator jump from a recorded Studio build to the owned code on disk. Add per-build actions to the
  Recent builds list: a purely client-side Copy path (clipboard write of the recorded repo target_dir; works
  in both modes) and an Open folder action that opens the recorded repo directory in the OS file browser via
  a new trusted-local route POST /api/history/open {id}. The open route reuses the injected-handler pattern
  (open_dir_fn(build_id) -> dict), is wired only in trusted-local preview mode (build-only 404), looks up the
  recorded build, launches the platform folder opener (open / xdg-open / os.startfile) best-effort, and
  returns a bounded, secret-free status (opened/error) - never runs generated code, echoes a command, or
  exposes an environment. No change to build/preview/history/status/stop/restart, collision-free ports,
  single-session cleanup, PostgreSQL, or studio:serve/studio:preview semantics; verify stays offline.
requirements:
  - POST /api/history/open {id} over the stdlib server via injected open_dir_fn; unset -> 404; missing id -> 400; errors -> 502.
  - Opener wired only in trusted-local preview mode; looks up the recorded build, opens target_dir, returns bounded secret-free opened/error; unknown id -> bounded error.
  - Client-side Copy path per build (clipboard write of target_dir with fallback + transient feedback), no server call, both modes.
  - Open folder button per build calling POST /api/history/open with bounded result.
  - Secret-free payloads/logs; opener never echoes command, path env, or traceback.
  - Deterministic/offline verify via injected fakes.
acceptance_criteria:
  - POST /api/history/open {id} returns opener status when wired, 404 when not, 400 on missing id; handler gets the id.
  - Opener default returns opened on success, bounded error otherwise, bounded error for unknown build id.
  - Studio page exposes per-build Copy path (client clipboard) and Open folder (/api/history/open) without HTML injection.
  - Existing contracts compatible; focused + full verify + lint + security + env + both demos pass; 0 model calls in verify.
