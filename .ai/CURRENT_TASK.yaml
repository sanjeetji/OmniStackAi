must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the IR schema (no new IR field; only Field.validation is interpreted further)
  - the R-250 max_length/enum behavior; rule-free Go structs stay byte-identical (plain json tag)
  - the model-gateway, runtime, verify, edit, data-access, auth, seed, index public behavior (additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - add a go.mod dependency or wire validator.Struct enforcement in this task (declarative tags only)
  - apply numeric bounds to non-numeric fields; fabricate a rule the IR didn't declare
  - connect to or run a database; make a network call; add a platform Python dependency; put a secret anywhere
acceptance:
  - parse_field_rules also reads min:<number> / max:<number> (kept as raw literals; non-numeric ignored).
  - schema: numeric INT/FLOAT fields render CHECK (col >= n) / CHECK (col <= n) (combined with enum
    CHECK if present); string fields never get a numeric check.
  - Pydantic: numeric fields render Field(ge=n, le=n); string max_length still renders Field(max_length=n).
  - Go models: go_validate_tag builds max=/oneof=/gte=/lte= and each field with rules gets
    `validate:"..."` inside its struct tag; rule-free fields keep the plain json tag; example IRs emit no
    validate tags.
  - Standard-library offline tests cover the numeric parser, schema numeric CHECK, Pydantic ge/le, the
    go_validate_tag helper + emitted struct tags, and examples-unaffected.
