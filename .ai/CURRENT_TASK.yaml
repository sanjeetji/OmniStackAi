  - Scoping survives an edit — a courier still has no menu editor
  - A single-app project's edit path is unchanged
  - The user is told which apps an edit changed, never left to guess
  - task verify stays offline with 0 model calls
required_gates:
  - An ecosystem project has an IR saved and is editable after the build
  - An edit that adds a related entity reaches the surfaces holding what it points at
  - An unrelated addition reaches every surface rather than none
  - The courier app still ships no menu editor after an edit
  - The diff touches the surface apps rather than replacing the layout
  - task verify passes offline with 0 model calls
