  - No credential value anywhere
  - The app must still bundle and icons stay valid PNGs
  - task verify stays offline with 0 model calls
required_gates:
  - brand.json records the identifier that was published, so a later change is detectable
  - A check refuses a bundleId that no longer matches the published one, and says why
  - The same check passes cleanly for an unpublished project, whatever the identifier is
  - Changing colour, font or display name after publishing is allowed, with a warning naming the new build and version bump
  - The chat agent selects brand.json for a branding request
  - The chat agent refuses to edit the identifier of a published project
  - task verify passes offline with 0 model calls
