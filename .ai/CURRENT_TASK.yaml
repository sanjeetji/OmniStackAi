schema_version: 1
task_id: R-281
title: Pagination, Sort & Search Controls on Subcollection Master-Detail Lists in Generated Next.js Web App
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Close the survey-identified gap B: the generated subcollection master-detail lists render only
  `{sub.data.map(...)}` with no controls, even though the backend subcollection endpoints and the
  generated `useList<Child>By<Parent>` hook already fully support limit/offset/sort/order/q. Add a search
  form, a sort <select>, and a Prev/Next pagination footer to the subcollection lists in BOTH render
  sites (the collection master-detail screen and the dedicated detail screen), all driven by the existing
  hook setters (setSearch/setSort/setPage). The founder chose this offline option ("R-281 offline only").
tracker_ref: "R-281"
requirements:
  - Add a shared `_subcol_controls(sub, s_var)` helper emitting an uncontrolled search <form> (defaultValue + FormData on submit -> setSearch) and a sort <select> (id + display fields, asc/desc -> setSort).
  - Add a shared `_subcol_pagination(s_var)` helper emitting a Prev / "Page X of Y (N total)" / Next footer driven by page/totalPages/total/setPage, disabled at bounds and while loading.
  - Wire both helpers into the collection master-detail subcollection block AND the detail-screen subcollection block (identical insertion points).
  - No new component state (uncontrolled search input); no new IR field; no new npm dependency; "use client" preserved; strict diff invariance across ir.description.
  - Subcollection hook internals (abort/debounce) intentionally unchanged; submit-based search avoids a per-keystroke fetch storm.
acceptance_criteria:
  - Both the collection master-detail page and the detail page render, per subcollection, the search form, the sort select (id + display-field options in both directions), and the pagination footer, all referencing the `<child>Subcol` hook.
  - Entities without subcollections (e.g. rideshare-favourites) emit no subcollection controls.
  - The subcollection search input is uncontrolled (no `useState`-backed sub-search state).
  - Strict diff invariance: changing only ir.description yields byte-identical list and detail pages.
  - task verify passes (expect 770+ tests, new test_subcollection_list_controls.py); task lint + security:quick pass; both builder:demo pass.
allowed_paths:
