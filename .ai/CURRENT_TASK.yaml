  - API unit tests pass (100% clean)
  - The seed loads into an empty PostgreSQL with ON_ERROR_STOP and every table has rows
  - @careclinic/admin builds cleanly with Next.js Turbopack
  - All 48 screenshots + cover.jpg generated and verified in media/
  - catalog validation passes for published care-clinic template (v1.0.0)
  - task verify passes
model_tool_trace:
  routing: deterministic_only
  local_calls: 0
  cloud_calls: 0
blockers: []
found_and_fixed:
  - "R-535 seed: 48 appointment end times were HH:60:00, which PostgreSQL rejects, so the seed
     never loaded. Fixed the slot arithmetic and regenerated."
  - "R-535 seed: queue_status was set from the appointment status, but 'no_show' is not in the
     queue_status vocabulary, so the load aborted. Added an explicit mapping."
  - "R-535 seed: nine tables were never written (vitals, labs, invoice items, refunds, reviews,
     telehealth sessions, notifications, schedule overrides). Added them."
  - "R-535 seed: the demo patient's own appointments all landed on cancelled/no-show, so her
     chart was empty. Gave her an explicit five-visit history."
  - "R-535 API: services/api did not type-check (untyped Hono context). Added a typed AppEnv."
  - "R-538 draft apps/admin: all 18 pages rendered hard-coded arrays and sign-in wrote a fake
     token. Rewritten against the real API."
found_not_fixed:
  - "apps/doctor (R-537) has the same defect the console had: the consultation, SOAP, prescription,
     lab-order, telehealth, reviews, earnings, schedule and patient-history screens render
     hard-coded state instead of API data. Only the dashboard, the queue and the patient chart read
     the API at all, and those overlay mock values. The pages render and the screenshots are of real
     pages, but the workstation is not wired to the backend. Needs its own task (suggested R-539)."
  - "apps/patient keeps invented fallback rows for a failed API call (doctors, appointments,
     invoices, lab reports). The live path is real, but a backend failure shows plausible fiction
     rather than an error. Worth removing when the doctor app is rebuilt."
evidence:
