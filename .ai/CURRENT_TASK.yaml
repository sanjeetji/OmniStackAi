  - apps/console-web/** (index.html, styles.css, app.js, data/overview.json, README.md)
  - services/agent-engine/src/omnistackai_agent_engine/model_gateway/overview.py
  - services/agent-engine/src/omnistackai_agent_engine/model_gateway/accounting.py (PriceBook.entries)
