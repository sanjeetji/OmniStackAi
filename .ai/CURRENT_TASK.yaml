must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the R-237 ProjectDiff / diff_projects / apply_diff / plan_edit public behavior (this is additive)
  - the model-gateway, IR, runtime, verify, codegen public behavior (additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - write to disk, run anything, or make a network call (this is a pure diff/report layer)
  - add a platform Python dependency (standard-library difflib only); import a vendor SDK; put a secret anywhere
acceptance:
  - diff_report(old, new) returns FileDiff records classifying each path as added / modified / deleted /
    renamed; a deleted file whose content exactly matches an added file is a single RENAMED record
    (old_path -> path), not a delete + add.
  - modified files carry a git-style unified (hunk) diff with -/+ lines; added/deleted carry the
    corresponding one-sided unified diff; the report is deterministically ordered.
  - unified_patch(old, new) returns one git-style patch string (rename headers for renames) that is
    byte-stable across runs.
  - Additive only: diff_projects / apply_diff / plan_edit outputs are unchanged.
  - Standard-library offline tests cover modified-hunk content, rename detection, add/delete, empty diff
    for identical projects, and determinism.
required_gates:
  - impact_analysis
  - unified_hunk_tests
  - rename_detection_tests
  - add_delete_and_empty_tests
  - determinism_test
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
