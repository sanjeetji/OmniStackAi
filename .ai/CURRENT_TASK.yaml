must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway, Application IR, and codegen-contract public behavior (additive only; the
    file-path validator is extended, not weakened — still no absolute paths, '..', backslashes, or
    control chars)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install, build, or run the generated app; write generated files to disk in this task
  - add an external Python dependency; store secrets (generated .env.example holds placeholders only)
acceptance:
  - NextjsWebAdapter implements FrameworkAdapter (target nextjs-web) and returns a GeneratedProject
    from an ApplicationIR that a Next.js toolchain could install and build (correct App Router layout).
  - Entities become TypeScript interfaces (field types mapped); IR APIs become App Router route
    handlers with {param} mapped to [param] and one route.ts per route directory exporting each method;
    each screen becomes an app page; an app/page overview lists the app, entities, and screens.
  - package.json, tsconfig.json, next.config.mjs (security headers), README.md, .gitignore, and
    .env.example (placeholders only) are emitted; all paths are safe and deterministically ordered.
  - The file-path validator is extended to allow framework route filename characters ([]()@+) while
    still rejecting absolute paths, '..', backslashes, and control chars.
  - Generation is a pure function of the IR; standard-library only; nothing is installed, built, run,
    or written to disk.
  - Standard-library offline tests assert emitted paths and key file contents for a representative IR,
    dynamic-route mapping, entity->interface mapping, and registry wiring.
  - task verify stays green and network-independent.
