objective: >-
  Model routing per job (plans, page design and repair) across local Ollama, free cloud tiers and
  paid keys, with fallbacks that do not waste time: a provider that is out (a spent quota, a
  limit, an outage) is skipped by every job until it is back, limits are waited out only on the
  last provider left, a paid key raises page quality the moment it is added, and the routing is
  visible.
