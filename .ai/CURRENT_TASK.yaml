objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Color Contrast Checker compound
  component suite (components/color-contrast.tsx): parses foreground/background hex colors (#rgb and
  #rrggbb), computes WCAG 2.x relative luminance and contrast ratio, and evaluates AA/AAA pass-fail for
  normal text, large text, and UI components; a computed ContrastResult ({ratio, aaNormal, aaaNormal,
  aaLarge, aaaLarge, uiComponent, rating}); native color inputs plus hex text inputs, a live preview swatch
  with sample text at normal and large sizes, and pass/fail badges; controlled + uncontrolled colors; a
  swap action; onChange callback; WAI-ARIA (labeled inputs, a role="status" aria-live results region);
  4 futuristic visual styling variants ("default", "card", "glass", "neon"); 3 size scales ("sm", "md",
  "lg"); React ref forwarding (forwardRef); useImperativeHandle (ColorContrastHandle:
  getRatio/getResult/setColors/swap); and explicit displayName across compound and semantic alias exports
  (ColorContrast, ContrastChecker, WcagContrast, ContrastRatio, default). Static module constant — never
  references ir.name/ir.description.
