must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the ModelProvider/gateway, IR, runtime, verify, edit, data-access public behavior (additive)
  - non-DB backend output (free-function scaffold handlers stay unchanged)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - connect to or query any database; execute a handler; make a network call
  - wire an ambiguous endpoint (sub-collection / multi-param / custom) — leave those as 501
  - add a platform Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - wire_endpoint maps only the unambiguous CRUD shapes (list/get/create/delete) and returns None for
    everything else; the entity comes from response_schema (else request_schema) and must be a known
    repository entity.
  - Python wired routes import the repository (and the model for create) and await the repository call;
    create uses payload.model_dump(); unwired routes keep status_code=501. Generated routers parse as
    valid Python.
  - Go handlers become methods on a Handlers struct with *sql.DB (internal/handlers/handlers.go with New
    + writeJSON); main.go opens store.Open() and registers h.<Handler>; wired methods call the store and
    decode models.<Entity> for create; unwired stay 501. Non-DB Go backends keep free-function scaffolds.
  - Only emitted when entities + postgres; deterministic and byte-stable; nothing runs.
  - Standard-library offline tests cover the wiring map + its None cases, Python/Go wired emission, and
    that a non-DB backend is unchanged.
