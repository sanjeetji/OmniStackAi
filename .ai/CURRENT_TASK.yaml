objective: >-
  R-546 referenced the credentials a publisher needs by name but generated no template for them:
  there is no `.env.example` and no `credentials/` guide, so a founder holding an Apple Team ID has
  nowhere obvious to put it and no note saying what the value should look like. And the generated
  app icon is a flat coloured plate — valid and store-acceptable, but it reads as unfinished, which
  is not what a user should receive.
  Close both. Every key gets a template entry with a one-line note saying exactly what to paste and
  where the value comes from, and the default icon becomes a deterministic mark that is unique per
  app and looks intentional rather than blank.
founder_gate: >-
  The founder's standing instruction on 2026-09-24: "we do not want to do any task/feature which is
  incomplete and not good for a user, each should be complete with smoothness." This task exists
  because R-546 shipped two things that met their gates but would not have felt finished.
