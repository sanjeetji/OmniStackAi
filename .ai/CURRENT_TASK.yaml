goal: >-
  Complete the first end-to-end builder slice: safely write a GeneratedProject to a target directory
  and initialize it as a real Git repository owned by the customer, with a first commit. Deterministic
  and offline (git is available); writes only inside the caller-provided target directory, never the
  platform repo. This closes the loop IR -> generated app -> owned Git repo.
