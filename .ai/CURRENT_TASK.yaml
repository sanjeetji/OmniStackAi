schema_version: 1
task_id: R-278
title: Collection Screen Boolean & Enum Field Filtering, Segmented Pill Controls & Filter Empty States in Generated Next.js Web App
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Enhance generated Next.js collection screens (apps/web/app/<screen>/page.tsx) with interactive,
  deterministic client-side filtering for boolean fields and enum fields, complete with segmented pill
  controls, enum dropdowns, active filter indicators, and dedicated empty states.
tracker_ref: "R-278"
requirements:
  - Detect filterable fields on the entity (boolean fields and enum validation rules).
  - Manage filter state via filterValues (Record<string, string>).
  - Compute filteredData via useMemo comparing items against active filters.
  - Connect filteredData to table rows, bulk selection (allCurrentIds), and CSV export.
  - Render an accessible filter toolbar with segmented pill buttons for boolean fields and select dropdowns for enum fields.
  - Render active filter count badge and reset button when filters are active.
  - Dedicated empty filter state when records exist in data but none match active filters.
  - Clean fallback when entity has zero boolean or enum fields (zero filter code emitted).
  - 100% offline, zero new external npm dependencies, zero new IR fields, strict diff invariance.
acceptance_criteria:
  - Collection screens import useMemo from "react" when filterable fields exist.
  - Segmented pill controls are rendered for boolean fields with active/inactive states.
  - Dropdown selects are rendered for enum fields with active/inactive states.
  - Active filter count badge and reset button are rendered when filters are active.
  - Table rows, bulk selection IDs, and CSV export reflect filteredData.
  - Dedicated empty filter state is displayed when data.length > 0 && filteredData.length === 0.
  - Clean fallback: entities without boolean or enum fields omit filter code.
  - Strict diff invariance: changing only ir.description produces byte-identical output.
  - task verify passes (expect 740+ tests passing, 0 failures).
  - task lint and task security:quick pass.
  - builder:demo passes for minimal-blog and rideshare-favourites.
