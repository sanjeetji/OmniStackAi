schema_version: 1
task_id: R-238
title: PostgreSQL schema/migration generation from the Application IR
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Give the generated backend a real persistence layer (Brief 9/34/42): deterministically render a
  PostgreSQL schema from the IR entities + relations and emit it as migrations/0001_init.sql in the
  backend target. Columns are typed from FieldType, required fields are NOT NULL, each table gets a UUID
  primary key (the entity's own id field if present, else a surrogate), many_to_one/one_to_one relations
  become foreign-key columns REFERENCES the target table, and many_to_many relations become a join table
  with a composite key. Emitted only when the IR declares entities and database_strategy=postgres. Pure,
  deterministic, offline (emit files, assert contents) — no DB connection, no migration is run, no
  network. The R-237 edit loop diffs the migration for free when the IR changes.
