must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the ModelProvider/gateway, IR, runtime, verify, edit public behavior (additive)
  - previously emitted backend files other than requirements.txt / go.mod (which gain a DB dependency)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - connect to or query any database; execute SQL; make a network call
  - string-interpolate a query VALUE (values must be parameterized); add a platform Python dependency;
    import a vendor SDK; put a secret anywhere (DATABASE_URL default is a local placeholder)
acceptance:
  - For an IR with entities + postgres, the Python backend emits app/db.py and
    app/repositories/<entity>.py per entity (list/get/create/delete), and requirements.txt gains psycopg;
    the Go backend emits internal/store/store.go and internal/store/<entity>.go per entity, and go.mod
    gains the pgx require.
  - Repository SQL uses parameterized placeholders for all values (%s / $N); the table name and column
    names are fixed identifiers derived from the IR; an entity with only an id column still creates via
    DEFAULT VALUES.
  - Go store functions scan into the generated model struct fields (matching the model field names);
    the module import path matches go.mod.
  - Nothing is emitted when the IR has no entities or database_strategy != postgres; no previously
    emitted file (other than requirements.txt / go.mod) changes; output is byte-stable.
  - Standard-library offline tests cover emission + gating, parameterization (no value interpolation),
    per-entity files, the id-only DEFAULT VALUES case, and the dependency additions.
required_gates:
