schema_version: 1
task_id: R-236
title: Expand the model-provider catalog + custom OpenAI-compatible providers
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Grow the cloud model fabric to match a competitive provider picker: add first-class
  OpenAI-compatible adapters for DeepSeek, xAI (Grok), Mistral, Together, and Fireworks alongside the
  existing OpenAI/Anthropic/Google/OpenRouter/Groq, and add a generic env-driven "custom provider" path
  (any OpenAI-compatible base URL + key) so a user can plug in an endpoint with no code change — the
  platform's advanced equivalent of Dyad's "Add custom provider". Each provider stays key-activated:
  no key means it is inactive and no cloud call is made; local Ollama remains the always-on sub-L3 tier
  and the default. Every new provider flows through registration, cloud-tier/fallback selection, the
  metadata-only overview, and the price book automatically. Standard-library only; deterministic and
  offline; no key value is ever logged, stored, or returned.
source:
  tracker_sheet: Phase_Roadmap
