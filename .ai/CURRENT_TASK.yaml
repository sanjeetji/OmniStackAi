must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the IR schema (no new IR field; PATCH HttpMethod already exists in the enum)
  - the R-250/R-251/R-252 CREATE/DELETE/GET/LIST wiring behaviour; rule-free Go structs byte-identical
  - the model-gateway, runtime, verify, edit, data-access public behaviour for existing ops
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
  - the validator dep / validate.go gate: has_validation must also cover UPDATE handlers (not only CREATE)
must_not_do:
  - add a platform Python dependency or a vendor SDK to the agent-engine
  - emit the validator dep or validateStruct for a project with zero rules-bearing entities
  - connect to or run a database; make a network call; install/build/run Go; put a secret anywhere
  - change the IR schema, add IR fields, or change how existing ops are wired
acceptance:
  - PATCH /entities/{id} with matching request_schema entity -> Op.UPDATE wired (not 501).
  - Go store: Update<Entity>(ctx, db, id, m) emitted — parameterized UPDATE...SET...WHERE id=$N RETURNING <cols>; scans into *models.<Entity>, returns nil on not-found.
  - Go handler: decode body -> validateStruct (if entity has rules) -> store.Update -> 404 if nil, 200+writeJSON otherwise; ordering assertable by string position.
  - FastAPI repo: update_<table>(id, data) emitted — UPDATE...SET...WHERE id=%s RETURNING *; columns from data keys (excluding id); returns None on no rows.
  - FastAPI router: @router.patch route with id_param+entity payload -> update_<table> -> 404 on None.
  - No wiring: PATCH without path param, PATCH without request_schema entity, GET/POST/DELETE same shape.
  - Rule-bearing entity in update: validateStruct called BEFORE store.Update (string-position test).
  - Rule-free entity: no validateStruct call in the update handler.
  - Example IRs (minimal-blog, rideshare-favourites) unchanged — no PATCH endpoints present.
  - task verify green; 350 -> >=360 tests pass; 0 network calls.
