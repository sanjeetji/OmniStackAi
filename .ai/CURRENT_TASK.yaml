  - scripts/
  - .ai/
  - PROJECT_STATE.md
  - CHANGELOG.md
forbidden_changes:
  - A surface the prompt called an app is never assembled as a website
  - One shared API and one database; the apps do not each get a backend
  - The decision is deterministic — the same prompt gives the same surfaces twice
  - Existing single-app builds with one apps/mobile keep working unchanged
  - task verify stays offline with 0 model calls
required_gates:
  - "\"customer + driver apps\" produces React Native apps for those roles, not web pages"
  - An admin panel or a marketing site stays a web app
  - The monorepo carries more than one mobile app, each buildable
  - The preview offers a QR for each mobile app rather than assuming one
  - The reason each surface is an app or a site is recorded, not implicit
  - task verify passes offline with 0 model calls
model_tool_trace:
  routing: deterministic_only
  local_calls: 0
  cloud_calls: 0
blockers: []
deferred: []
found_and_fixed:
  - >-
    The first implementation flipped the customer surface to mobile and so **deleted the only
    public website** — from a prompt that asked for a marketing website in the same sentence.
    Answering one request by dropping another is the failure this task exists to end. An operator's
    app now replaces their portal (a courier has no use for a website) and a customer's app is
    built beside theirs, which also matches the standing default of a web app plus an app when one
    is asked for.
  - >-
    The customer's companion app was derived from a renamed surface, and entity scoping is keyed by
    surface kind, so it fell through to a word match and lost `MenuItem` — a food-delivery customer
    app that cannot show a menu. It is now scoped from the original surface, so the app sees
    exactly what the website sees.
  - >-
    Detecting Expo apps purely by an `app.config.js` marker broke every existing fixture and would
    have broken projects generated before this change. `apps/mobile` has been the reserved Expo
    directory since R-545, so the name counts as a marker too.
