objective: >-
  First slice of the product-UI shell: wire R-465/R-466's hybrid engine and a read-only file browser into
  the actual Studio a user opens in a browser. New pure studio/files.py (list_build_files, read_build_file -
  path-safety mirrors edit/apply.py's _safe_destination; excludes .git/node_modules/__pycache__/.next/.venv
  and real .env* files, keeps .env.example) backs new GET /api/build/{id}/files and
  GET /api/build/{id}/file?path= routes in server.py, resolved against StudioBuildHistory's recorded
  target_dir in live_serve.py; wired in build-only mode too (no toolchain needed). /api/build gains a
  hybrid_ui boolean threading synthesize_screens=True + a ui_outcomes sink into the plain-prompt and
  Ecosystem Pack build paths; ui_outcomes surfaced in the response, recorded in history, shown in the page
  (summary line + per-file badge). The Solution Pack path has no such kwarg on build_solution_pack_project -
  requesting hybrid_ui there is honestly reported as hybrid_ui_active: false. page.py gained a clickable
  file list + read-only viewer pane and a "Hybrid UI (experimental)" checkbox, still zero external assets.
  Fixed a missing ApplicationIR import (latent NameError) in live_serve's ecosystem branch. Found and fixed
  a LIVE, ACTIVE violation of the "0 model/network calls under task verify" constraint: with the founder's
  real Groq credentials now in the gitignored .env (from the R-465/R-466 live proofs), four pre-existing
  live_serve._build() test call sites (2 in test_studio_ecosystem.py, 2 more found in test_studio_server.py)
  never mocked resolve_generation_provider_from_env, so running the existing Studio suite unmodified made
  real outbound Groq calls (one unmocked test cost 23.5s of real, R-466-paced traffic). All four now mock it.
  Out of scope, named for R-468: multi-turn chat/conversation state (no session concept exists at all
  today), and wiring R-466's toolchain-dependent compile_and_repair into the live server.
