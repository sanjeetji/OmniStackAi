  and aria-orientation), 4 futuristic visual styling variants ("default", "card", "glass", "neon"), 3 size
  scales ("sm", "md", "lg"), React ref forwarding (forwardRef), useImperativeHandle
  (ImageComparisonHandle: setPosition/getPosition/reset), and explicit displayName across compound and
  semantic alias exports. Static module constant — never references ir.name/ir.description.
