schema_version: 1
task_id: R-253
title: Wire PATCH/update handlers with validation in Go and FastAPI backends
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Close the missing PATCH/update CRUD verb in the generated backends. When an IR contains a
  PATCH endpoint whose request_schema names a known repo entity and whose path ends in exactly
  one path parameter (PATCH /entities/{id}), both the Go and FastAPI adapters must emit a real,
  wired update handler + repository function — not the 501 scaffold. The handler decodes the
  body, calls validateStruct (reusing the R-252 helper) if the entity carries validation rules,
  calls store.Update<Entity> / update_<table>, and returns 404 when the id is not found or 200
  with the updated row. Unambiguous shape only; everything else stays 501. Additive/offline;
  no platform dep; no install/build/run/DB connection.
