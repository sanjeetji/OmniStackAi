task_id: R-540
status: completed
phase: MVP
tracker_row: 7
started_at: "2026-09-24"
completed_at: "2026-09-24"
branch: ai/R-540-template-audit
objective: >-
  Audit every published template for the defect that R-538 and R-539 found twice (apps that render
  invented data instead of calling their own API), fix what the audit finds, and add a
  catalogue-wide gate so the next template cannot ship the same way. Bazaar turned out to be the
  worst case: its whole operations console was a mock, its seed asserted account balances with no
  postings behind them, and several admin endpoints referenced tables and columns that do not
  exist.
allowed_paths:
  - templates/catalog/bazaar/
  - services/agent-engine/tests/test_template_quality.py
  - scripts/test.sh
  - .ai/
  - PROJECT_STATE.md
  - CHANGELOG.md
  - docs/
  - R_&_D/OmniStackAI_Template_Marketplace_Plan_v1.md
forbidden_changes:
  - No new template dependency beyond the pinned stack
  - task verify stays offline with 0 model calls
  - No real credentials in the template
required_gates:
  - Every page of every published template reaches its own API
  - The Bazaar ledger sums to zero and every account reconciles against its postings
  - All 40 Bazaar pages verified in a real browser with no page errors or failed requests
  - 48 Bazaar screenshots recaptured from live data
  - A catalogue-wide quality gate exists and passes for all three templates
  - task verify passes
model_tool_trace:
  routing: deterministic_only
  local_calls: 0
  cloud_calls: 0
blockers: []
found_and_fixed:
  - "Audit result: ride-now and care-clinic reach their API on every page that should; bazaar was
     18/44, with its operations console at 0/18."
  - "bazaar console: all 18 pages rendered fabricated arrays and sign-in wrote
     'demo-token-admin-vikram'. Rewritten against the API that already existed."
  - "bazaar API: /admin/orders and /admin/orders/:id selected from a table 'order_items' that does
     not exist; /admin/settlements selected 'sh.bank_details_json' which does not exist;
     /admin/reviews selected 'p.name' (the column is title); order detail read 'tracking_events'
     (the table is shipment_tracking_events). All four 500'd for every caller."
  - "bazaar API: ledgerService.settleVendorPayout does not exist, so generating a settlement batch
     threw. The method is createSettlementBatch."
  - "bazaar ledger: getOrCreateAccount('platform', null) returned the same row for platform cash
     and platform revenue, because accounts is unique on (holder_type, holder_id, currency).
     Commission earned could never be told apart from money held. Migration 006 adds a
     'platform_revenue' holder type."
  - "bazaar seed: account balances were asserted as round numbers with zero ledger entries behind
     them, so the book did not balance. The seed now generates 180 orders, 216 consignments and
     564 postings, and derives every balance from them; the ledger sums to zero and all 11 accounts
     reconcile."
  - "bazaar seed: product variant ids came from randomUUID(), so the seed differed on every run."
  - "bazaar apps: the buyer and seller one-click demo logins used accounts the seed never creates
     (priya.sharma@example.com, kripal.singh@example.com), so the first thing any user clicks
     failed."
  - "bazaar buyer: the header polled /api/shopper/cart every five seconds while signed out, so
     every public page logged a 401."
  - "bazaar shared client: neither the API client nor the SSE hook read NEXT_PUBLIC_API_URL in the
     browser, so in a preview both always called localhost:4000."
  - "bazaar capture plan: signed no one in, used two accounts that do not exist, and pointed at
     placeholder ids."
found_not_fixed:
  - "Several pages across all three templates still seed themselves with invented rows and
     overwrite them when the API answers, so a backend failure shows plausible fiction rather than
     an error. The live path is real everywhere now; this is about what happens when it fails.
     Worth a sweep, but it does not block T-9."
evidence:
  audit: "ride-now 42/45, care-clinic 48/51, bazaar 43/44 pages reach the API (the remainder are
    sign-in screens that delegate to a session provider, and one redirect)"
  browser_sweep: "40/40 Bazaar pages as their demo user, no page errors, no failed requests"
  ledger: "PostgreSQL: accounts total 0; all 11 accounts reconcile exactly against their postings"
  seed: "180 orders, 216 consignments, 802 tracking events, 564 postings, 8 settlement batches"
  api_unit_tests: "19/19"
  screenshots: "48 recaptured from live data, plus the cover"
  quality_gate: "8/8 in services/agent-engine/tests/test_template_quality.py, across all templates"
  task_verify: "4,015 tests OK, 0 model calls"
  other_gates: "task lint, security:quick, env:check, scripts/test.sh, go test ./... (22 packages)"

