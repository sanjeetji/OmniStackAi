acceptance:
  - Form screen imports useUpdate<Entity>, use<Entity>, and useSearchParams when Op.UPDATE is wired.
  - Form screen reads editId from searchParams and invokes use<Entity>(editId).
  - Form screen synchronizes initialData into formData when loaded.
  - Form screen branches submission to update(editId, formData) when in edit mode.
  - Form screen renders dynamic labels (Edit vs New, Update vs Create, update success banner).
  - Entities without Op.UPDATE remain clean create-only forms without update hooks.
  - Collection screen renders "Edit" action link in master table when Op.UPDATE is wired.
  - Subcollection master-detail view renders "+ New <Child>" link with parent FK query parameter.
  - Child form screen pre-populates FK field from searchParams.
  - Diff invariance maintained across ir.description modifications.
  - task verify green; 0 network calls.
