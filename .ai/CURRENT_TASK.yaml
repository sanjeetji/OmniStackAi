branch: ai/R-560-verify-the-build
objective: >-
  Nothing in the console's build path ever compiles what it generates. The compile-verify-repair
  loop exists and works — `codegen/hybrid_repair.compile_and_repair` runs `tsc`, feeds each
  model-written file's own errors back to the model, recompiles, and reverts what still fails — but
  its only caller is an opt-in CLI (`task agent-engine:ui:synthesize`). A user building through the
  console gets none of it.
  That is why R-549's `@ts-expect-error` shipped in every generated web app for nine tasks: the
  product never built what it wrote. Run the same sequence the CLI already proves, on the path both
  build twins share, and report the outcome to the user instead of printing it to a terminal
  nobody is watching.
founder_gate: >-
  Founder on 2026-09-25: continue the roadmap in order; R-560 is next after R-586.
allowed_paths:
  - services/agent-engine/src/omnistackai_agent_engine/intake/
  - services/agent-engine/src/omnistackai_agent_engine/verify/
  - services/agent-engine/tests/
  - apps/console-web/
  - scripts/
  - .ai/
  - PROJECT_STATE.md
  - CHANGELOG.md
forbidden_changes:
  - task verify stays offline with 0 model calls; these tests use injected fake runners only
  - A build must never be blocked or failed by verification being unavailable
  - Skipping is never silent: the reason reaches the user, as with R-559's substitutions
  - One seam only; both build twins and the ecosystem builder must go through the same function
  - Deterministic files are never rewritten by the repair loop
  - No secrets in the reported output
required_gates:
  - The console's build path verifies the generated project when it can
  - A build with no toolchain still succeeds and says why it was not verified
  - The outcome (clean, repaired, reverted, skipped) reaches the build payload and the console
  - Repairs land in the repository as their own commit
  - The streaming twin the console actually calls is covered, not only its sibling
  - task verify passes offline with 0 model calls
