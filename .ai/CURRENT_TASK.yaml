task_id: R-420
id: R-420
title: "SQL-safe generated PostgreSQL identifiers and FK dependency order"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Fix the two generated PostgreSQL defects exposed by R-419's live app run: emit safe quoted SQL
  identifiers consistently across schema, seed, Python repositories, and Go stores; and create tables
  plus seed fixture groups in a stable foreign-key dependency order so a child declared before its
  parent never references a relation that does not exist yet.
requirements:
  - Keep logical snake_case names unchanged for file paths, module names, functions, and route wiring.
  - Render every generator-owned PostgreSQL table, column, relation column, and index identifier with safe double quoting.
  - Apply the same SQL identifier representation in migrations, fixture INSERTs, Python repositories, and Go stores.
  - Emit entity tables in stable topological order over many_to_one and one_to_one dependencies, preserving source order between independent entities.
  - Emit fixture entity groups in the same dependency order while preserving row order within each fixture.
  - Keep many-to-many association tables after all entity tables and preserve deterministic output.
  - Fail deterministically with a clear error for cyclic non-self foreign-key dependencies rather than emitting an invalid migration.
acceptance_criteria:
  - An Order or User entity produces valid quoted table SQL everywhere it is referenced.
  - Reserved-looking field, relation, and index names are quoted without changing public code identifiers.
  - A child-before-parent IR renders the parent CREATE TABLE first and its child/fixture rows afterward.
  - Independent entities retain their original relative order and self-references remain renderable.
  - A non-self FK cycle raises a stable explanatory ValueError instead of emitting forward-reference SQL.
  - Existing example IRs remain deterministic and both backend adapters emit consistent migrations/repositories.
  - Focused tests and the full offline verification, lint, security, environment, and builder demo gates pass.
expected_impact:
