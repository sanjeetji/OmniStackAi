must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the IR schema version or existing IR fields (fixtures is additive with an empty default)
  - the model-gateway, runtime, verify, edit, data-access, auth public behavior (additive)
  - the R-238 0001_init.sql output; only ADD 0002_seed.sql
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - invent, default, or guess a seed value; emit a column not present in a fixture row
  - connect to or run a database; execute a migration; make a network call
  - add a platform Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - ApplicationIR gains a Fixture collection (entity + rows of column->JSON value), validated in
    __post_init__ (entity name, non-empty rows/dicts, identifier columns, JSON/control-free values) and
    round-tripped through to_dict/from_dict; normalize_ir preserves (sorts) fixtures.
  - validate_ir errors on an unknown fixture entity or unknown row column; warns (not errors) on a
    required column missing from a row.
  - render_postgres_seed(ir) emits deterministic INSERTs using only the declared columns/values, with
    correct SQL literal quoting; empty string when no fixtures.
  - Both backends emit migrations/0002_seed.sql exactly when the IR has fixtures and postgres; no seed
    file for a fixture-free or non-postgres IR; 0001_init.sql is unchanged.
  - Standard-library offline tests cover literal rendering, INSERT shape + column ordering + FK column,
    gating, validation errors/warnings, and IR round-trip/normalize.
required_gates:
  - impact_analysis
  - sql_literal_tests
  - render_seed_and_gating_tests
