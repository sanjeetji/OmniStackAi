  verification: []
  acceptance_results: []
blockers:
  - Full Next.js install/build is not possible in this sandbox (SWC binary download times out); the
    Next.js upgrade is deferred to an environment with reliable registry access.
next_action: >-
  Verify the static console (exporter tests, JS syntax, HTTP serve), run the gates, then record
  completion evidence and update state and tracker.
next_command: task verify
