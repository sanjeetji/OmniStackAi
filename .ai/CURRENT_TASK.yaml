blockers: []
found_and_fixed:
  - "R-537 apps/doctor: every screen rendered hard-coded state. Only the dashboard, queue and
     patient chart called the API at all, and they overlaid mock values on the response. Rewritten
     against the API."
  - "The doctor earnings query joined invoices directly; a visit with both a consultation and a
     lab invoice counted its fee twice (gross 24,500 against a daily sum of 14,000). Replaced the
     join with a LATERAL that picks one invoice per appointment."
  - "R-536 shared types: Consultation, Diagnosis, Prescription, PrescriptionItem and LabTest named
     columns the API never returns, so the patient's prescription slip showed a blank medicine,
     form and dose on every real prescription."
found_not_fixed:
  - "apps/patient still keeps invented fallback rows when an API call fails (doctors, appointments,
     invoices, lab reports), so a backend failure shows plausible fiction rather than an error.
     Small, and worth removing next time the patient app is touched."
  - "The platform's own account management is data-model-only: users.role ('user'/'super_admin')
     and users.plan (free..enterprise) are stored and returned but no endpoint requires them, and
     organizations/workspaces/workspace_members exist with roles that nothing in the console uses.
     Credits and BYOK are enforced. Recorded in COMMANDS.md section 3 so it is not mistaken for
     working."
