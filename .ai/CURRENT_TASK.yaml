branch: ai/R-558-designed-ui
objective: >-
  The generated project ships a real design system — 59 colour tokens, a type scale, a space scale,
  six shadows, seven motion tokens — and the pages ignore almost all of it. Measured on a generated
  storefront home page: `--shadow-*` used 0 times, `--transition-*` 0, `--font-size-*` 0,
  `--space-*` 0, against 26 hardcoded pixel values and **zero hover or focus states**. The result
  looks flat and static because it is flat and static.
  Part of that is structural: inline React styles cannot express `:hover` or `:focus-visible` at
  all, so no amount of tuning inline values would have produced an interface that responds to a
  cursor. The page needs a real stylesheet.
  Make the deterministic pages use the system they ship with, and give them the depth, motion and
  interaction feedback that separates a designed interface from a tidy one. This is what a user
  sees whenever no model is available or a model's output fails validation, so it is not a
  fallback in any sense that permits it to look like one.
founder_gate: >-
  Founder on 2026-09-24: make the deterministic template "just like a modern, cool and latest UI
  not a simple UI", and asked for this before Phase E.
