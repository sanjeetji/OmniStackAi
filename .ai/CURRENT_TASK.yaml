must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the IR schema version or existing IR fields (required_roles is additive with an empty default)
  - the model-gateway, runtime, verify, edit, data-access public behavior (additive)
  - R-241/R-242 auth behavior for endpoints without required_roles (they keep require_auth/RequireAuth)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - execute a handler or verify a token at generation time; make a network call
  - add a platform Python dependency or import a vendor SDK in the platform code
  - allow required_roles on a public endpoint (auth=false) or reference an undeclared role
acceptance:
  - ApiEndpoint gains required_roles (tuple of role ids), validated in __post_init__ (a non-empty value
    requires auth=true) and serialized in to_dict/from_dict; validate_ir errors on an undeclared role.
  - Python emits require_roles(*required) in app/auth.py (verify then require any role, else 403); routes
    with required_roles declare dependencies=[Depends(require_roles("..."))]; routers parse as valid Python.
  - Go emits RequireRoles(next, required...) on a shared verifyToken + hasAnyRole (403 when no required
    role); main wraps role-gated endpoints with handlers.RequireRoles(target, "...").
  - Endpoints without required_roles keep the R-241/R-242 auth guard; output is byte-stable; nothing runs.
  - Standard-library offline tests cover the IR field (serialize, auth-implication, unknown-role error),
    and Python/Go role wiring.
