objective: >-
  Make a generated app repo run locally in one command, removing the manual DB/venv/pnpm dance. New
  omnistackai_agent_engine/localrun/ package (Python 3.13 stdlib only) using the platform's "deterministic
  plan + opt-in executor" pattern. plan.py: RunStep/RunPlan dataclasses + build_run_plan(repo_dir, *, db_*,
  api_port, web_port, jwt_secret, db_name=None) inspects the repo (backend flavor python/go, migrations, web)
  and composes an ordered JSON-safe plan: recreate a per-app Postgres DB (DROP IF EXISTS + CREATE) in the
  running local container, apply each migration, start the backend (uvicorn or go run with DATABASE_URL/
  JWT_SECRET), start the web app with next dev (the Next binary directly, NOT pnpm dev) + NEXT_PUBLIC_API_URL;
  resolves api_url/web_url and RunPlan.to_dict() (masks the DB password). run.py: opt-in executor
  (task agent-engine:app:run -- <dir>, excluded from verify) - runs setup synchronously (skips existing
  .venv/node_modules), launches both servers, polls backend /healthz, prints URLs, cleans up on Ctrl+C. Task
  depends on db:up. Deterministic core is fully offline-testable; the executor is opt-in. No paid cloud.
