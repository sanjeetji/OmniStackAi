objective: >-
  Fourth task of the approved 7-task Phase D roadmap. Proxy the agent-engine's existing trusted-
  local preview control surface - four routes, not three: GET /jobs/preview, POST /jobs/preview/
  stop, POST /jobs/preview/restart (the singleton control surface), plus POST
  /jobs/build/{id}/preview (the build-scoped one, -> POST /api/history/preview with a server-
  constructed {"id": id} body, never trusting the caller's body). All auth-required, no credit
  debit. Generalizes proxyGet into proxyUpstream(method, body) covering GET and POST. A new
  defaultPreviewTimeout constant (60s, above the real 45s internal readiness wait) applies to
  handleBuildPreview specifically (it can trigger a real cold start). The build-scoped route's
  verified unusual 200-with-{"status":"error"} shape for an unknown build must survive the proxy
  unchanged - a dedicated test asserts this. Zero agent-engine changes.
