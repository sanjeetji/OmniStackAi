schema_version: 1
task_id: R-231
title: Application IR validator/normalizer + example IR fixtures
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Harden the Application IR with a semantic validator (checks beyond per-record construction: API
  schema references must name declared entities; project-strategy/platform consistency), a
  deterministic normalizer that returns a canonical (sorted) IR for stable diffs, and a small set of
  realistic example IR fixtures that drive the adapters. Standard-library only, deterministic, offline.
