objective: >-
  Build the first brick of the OmniStackAI "chat -> create an app" front door: a local, zero-new-dependency
  Prompt -> Application IR intake agent (omnistackai_agent_engine/intake/) that turns a plain-English app
  description into a validated, normalized ApplicationIR. Deterministic core is offline-testable
  (build_intake_messages: system+user Message tuple, schema-by-example from a real example_ir().to_dict();
  parse_ir_response: extract JSON from raw model text tolerating ```json fences + prose, inject
  schema_version, ApplicationIR.from_dict, normalize_ir). generate_ir performs the single I/O step against
  the vendor-neutral ModelProvider protocol (task verify runs it against an in-memory stub -> 0 model calls,
  0 network) and raises IntakeResponseError when output cannot be parsed or the IR fails validate_ir. Ships
  IntakeResult, IntakeError/IntakeResponseError, and an opt-in live runner (intake.live_run) wired as
  `task agent-engine:intake:run -- "<description>"` that compiles a prompt through local Ollama and prints
  the IR JSON. This is the pivot away from the paused UI-component series toward the user-facing product.
