schema_version: 1
task_id: R-273
title: Global Responsive Navigation Shell & Header Navbar in Generated Next.js Web App
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Deliver a global, responsive navigation shell and header navbar for generated Next.js web applications (apps/web):
  - Emit components/navbar.tsx as a client component ("use client") using Next.js usePathname for route detection.
  - Render application branding (ir.name) with an avatar logo badge linking to the home overview page (/).
  - Render navigation links for all collection and form screens in ir.screens, indicating the active route via dynamic path comparison.
  - Render role badges for screens with non-default roles (e.g. admin, moderator).
  - Render a prominent + New {Entity} / + Create quick-action CTA button on the right side of the navbar when a create form screen exists in the IR.
  - Integrate <Navbar /> into app/layout.tsx above {children}, wrapping all pages in a cohesive layout with typography and background tokens.
  - Maintain strict diff invariance across ir.description modifications.
  - Fully offline, 0 network, 0 external dependencies.
