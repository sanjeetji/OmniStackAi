must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway runtime behavior (R-005..R-221); the console is read-only and observational
  - local Compose services or infrastructure; no new deployable is added to Compose
  - the Section 74 top-level monorepo contract (apps/console-web already exists in it)
  - the offline task bootstrap contract and the network-independence of static task verify
must_not_do:
  - display, log, or embed any API key or secret in the console, the snapshot, or the repo
  - make external/runtime network calls from the console (same-origin snapshot fetch only)
  - add a paid cloud service, a new top-level directory, or a dependency that breaks offline bootstrap
acceptance:
  - apps/console-web serves as a static page that renders providers (local + all supported cloud with
    tier/default-model/active state), the Balanced routing ladder, the price book, and the usage/cost
    dashboard from a metadata-only snapshot.
  - The snapshot is produced by a Python exporter and contains no key or secret (active state is a
    boolean); the page uses safe DOM APIs (textContent, never innerHTML) and a strict CSP meta tag,
    with no external network requests.
  - The Python overview exporter has offline tests, including a no-secret / active-without-key
    assertion; app.js passes a JavaScript syntax check.
  - task bootstrap stays offline; task verify remains green and independent of the console; task
    console:snapshot refreshes the data and task console:serve serves it locally.
required_gates:
  - impact_analysis
  - overview_exporter_tests
  - no_secret_in_snapshot_test
  - app_js_syntax_check
  - static_console_serves_over_http
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
