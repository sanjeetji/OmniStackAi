objective: >-
  First task of the approved 7-task Phase D roadmap (R-475..R-481, renumbered from an earlier
  6-task sketch after two research passes plus two founder decisions - see the plan record). Turn
  /studio into a real app shell the later chat (R-477) and tabbed workspace (R-481) tasks build on
