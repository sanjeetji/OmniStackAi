  - agent-engine, runner-manager, modules, workers, or web console implementations
  - Redis, NATS, object storage, Kubernetes, Temporal, or cloud infrastructure
  - auth, organizations, billing, Git integration, audit, or business APIs
  - native mobile or device-cloud functionality
  - source documents other than the authorized execution tracker status and evidence
acceptance:
  - A minimal Go modular-monolith process starts from typed environment configuration.
  - GET /healthz returns a stable JSON liveness response without requiring PostgreSQL.
  - GET /readyz queries PostgreSQL with a bounded timeout and returns 200 or 503 JSON without leaking errors.
  - The process uses structured logs, bounded HTTP timeouts, and graceful SIGINT/SIGTERM shutdown.
  - Unit tests cover configuration and both health states; live Compose verifies health and readiness.
  - Exactly PostgreSQL and control-plane run in local Compose; no additional service is introduced.
