schema_version: 1
task_id: R-259
title: Total Count Queries and X-Total-Count Header on LIST Endpoints
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add total count queries and X-Total-Count HTTP response header to Op.LIST and Op.LIST_BY endpoints
  across Go and FastAPI backends, with CORS header exposure and Next.js client integration:
  - data_access: emit Count<Entity> and Count<Entity>By<Rel> in Go store; emit count_<table> and count_<table>_by_<rel> in Python repositories.
  - backend_go: in wired LIST and LIST_BY handlers, query count and set w.Header().Set("X-Total-Count", strconv.Itoa(total)); expose in corsMiddleware.
  - backend_python: in LIST and LIST_BY routes, inject Response, query count, and set response.headers["X-Total-Count"] = str(total); expose in CORSMiddleware.
  - nextjs: support X-Total-Count in lib/api.ts.
  - pure codegen change; no new platform dep, no install/build/run/DB.
source:
