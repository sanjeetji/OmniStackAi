task_id: R-227
title: Next.js web framework adapter — generate a real app from the Application IR
status: done
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-227-nextjs-adapter
goal: >-
  Implement the first framework adapter: a NextjsWebAdapter that turns an Application IR into a real
  Next.js (App Router, TypeScript) project as a GeneratedProject — package.json, tsconfig, next.config
  with security headers, app/layout, an app/page overview, TypeScript interfaces from entities, App
  Router API route handlers from the IR APIs (dynamic {param} -> [param]), a page per screen, plus
  README/.gitignore/.env.example. Deterministic and offline: emitted files are asserted in tests; no
  install, build, or disk write. Registered via the AdapterRegistry so callers stay provider-agnostic.
