schema_version: 1
task_id: R-234
title: Tier switch + cloud provider drivers (Tier 0/1 local run; Tier 2 all providers)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the runtime/deploy layer switchable by a single OMNISTACKAI_TIER knob and give every declared
  provider a driver that produces a real command plan: Tier 0/1 run/preview a generated app locally
  (executor included), Tier 2 deploy to vercel/render/netlify/fly and run in an e2b/daytona/fly-machines
  sandbox — each activated by its key. Add task commands (platform:status, preview, deploy) so changing
  the tier/selection reflects in behavior. Deterministic and offline: plans are asserted; no key value
  ever appears in a plan/log; nothing is run or deployed by task verify (execution is opt-in on a
  network machine with the provider CLI + key).
