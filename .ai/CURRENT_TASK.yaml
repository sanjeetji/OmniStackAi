title: "Managed live generated-app preview inside the local Studio"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Add the first visible actual-application preview to the existing local Studio. An explicit trusted-local
  preview command must build a generated repo, start it through the existing R-419 run-plan boundary,
  return a structured preview result, and embed its live Next.js URL in the Studio while owning and
  cleaning up the generated app processes deterministically.
requirements:
  - Keep the existing agent-engine:studio:serve command build-only; local generated-code execution must require a separate explicit opt-in command.
  - Add agent-engine:studio:preview as the explicit trusted-local mode and start the existing local PostgreSQL dependency through the Task runner.
  - Refactor the R-419 executor into a reusable managed LocalAppSession that starts one RunPlan, reports backend/web readiness, and idempotently terminates every child process.
  - Preserve the existing agent-engine:app:run CLI behavior by delegating it to the managed session boundary.
  - Add a Studio preview coordinator that replaces the previous session only after a new repo is built, serializes replacements, returns a JSON-safe secret-free preview payload, and converts launch failures into preview status without discarding the successful build result.
  - Embed the ready web URL in a sandboxed iframe, expose an explicit open-preview link, and render starting/error/unavailable states without HTML injection.
  - Stop the active preview on replacement and when the Studio server exits.
  - Keep all verification deterministic and offline through injected/stubbed run, process, and readiness boundaries; task verify must not execute generated code, Docker, PostgreSQL, package installation, models, or external network calls.
acceptance_criteria:
  - task agent-engine:studio:serve still builds and reports a repository without launching it.
  - task agent-engine:studio:preview is visibly documented as trusted-local execution and depends on db:up.
  - A successful preview build returns preview.status=ready plus web_url/api_url and the Studio iframe uses web_url.
  - A preview launch failure still returns HTTP 200 for the successful build with preview.status=error and a bounded user-facing message.
  - Replacing a preview stops the old managed session; closing the Studio stops the active session; repeated stop calls are safe.
  - LocalAppSession reports web/backend readiness and cleans up already-launched processes when a later setup/readiness step fails.
  - Existing studio and app-run contracts remain compatible, and all focused/full verification, lint, security, environment, and builder-demo gates pass.
