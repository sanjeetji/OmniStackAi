  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [9, 12, 19, 26, 27, 66, 74, 77, 91, 92]
  founder_note: Committed directly to main (only branch). Author solely sanjeetji; tooling adds a Co-Authored-By trailer.
project_profile:
  repository: platform_modular_monorepo
  service: python_agent_engine
  control_plane_database: postgresql
  model_routing: balanced
complexity: L2
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/application_ir/validate.py
  - services/agent-engine/src/omnistackai_agent_engine/application_ir/examples.py
  - services/agent-engine/src/omnistackai_agent_engine/application_ir/__init__.py
  - services/agent-engine/tests/test_ir_validate.py
  - docs/APPLICATION_IR.md
  - portable state, changelog, handoff, task doc, and tracker evidence
allowed_paths:
  - .ai/**
  - CHANGELOG.md
  - PROJECT_STATE.md
  - R_&_D/OmniStackAI_Execution_Tracker_v6.xlsx
  - docs/**
  - services/agent-engine/**
must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the ApplicationIR record construction/validation behavior (the validator is additive; it does not
    weaken or replace the hard construction checks); the codegen adapters' public behavior
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - add an external Python dependency; store secrets; make any network or model call
acceptance:
  - validate_ir(ir) returns a deterministic, ordered tuple of typed Issues (severity error|warning,
    stable code, message, location) for semantic problems: an API request/response/error schema that
    references an undeclared entity is an error; a web/admin/mobile strategy set without the matching
    platform (or vice-versa) is a warning. A clean IR yields no errors.
  - normalize_ir(ir) returns a new ApplicationIR with platforms in enum order and roles/entities/apis/
    screens/acceptance sorted canonically (entity field order preserved); it is idempotent and
    round-trips losslessly through to_dict.
  - example_ir(name) provides at least two realistic, construction-valid ApplicationIRs that pass
    validate_ir with no errors and can be generated by the web/Python/Go adapters.
  - Standard-library only; deterministic; no network/model call; task verify stays green.
  - Standard-library offline tests cover each validation rule (error + warning), a clean IR, normalize
    sorting + idempotency + round-trip, and example validity.
required_gates:
  - impact_analysis
  - validator_rule_tests
  - normalizer_sorting_idempotency_roundtrip_tests
  - example_fixture_validity_tests
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
