must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway and Application IR runtime behavior (additive package only)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - write files to disk, run generated code, or add a real framework adapter yet (contract only)
  - add an external Python dependency; store secrets
acceptance:
  - GeneratedFile is an immutable, validated record with a safe relative POSIX path (no absolute paths,
    no '..' traversal, no control chars, bounded) and string content.
  - GeneratedProject holds a target plus a set of GeneratedFiles with unique, deterministically ordered
    paths; duplicate paths raise a stable error; it exposes lookup, paths, and length.
  - FrameworkAdapter is a runtime-checkable contract (target + generate(ir) -> GeneratedProject); a
    deterministic AdapterRegistry registers adapters by target with stable duplicate/unknown errors.
  - The generation target is a bounded enum covering the MVP targets; product code selects an adapter
    only through the registry, never a concrete class.
  - Standard-library offline tests cover file-path validation, project uniqueness/ordering, a fake
    adapter through the registry, and registry error paths.
  - task verify stays green and network-independent.
required_gates:
  - impact_analysis
  - generated_file_path_safety_tests
  - project_uniqueness_and_ordering_tests
  - adapter_registry_tests
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
