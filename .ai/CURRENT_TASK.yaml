objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Password Generator compound
  component suite (components/password-generator.tsx): generates a secure random password using
  crypto.getRandomValues (with a Math.random fallback) from configurable character sets (uppercase,
  lowercase, numbers, symbols) with an optional exclude-ambiguous filter, guaranteeing at least one
  character from each enabled set and shuffling with Fisher-Yates; a length slider (min/max), set toggles,
  a strength meter, a read-only output, copy-to-clipboard (navigator.clipboard with execCommand fallback)
  with copied feedback, and a regenerate action; SSR-safe (crypto only accessed in handlers/effects;
  auto-generates on mount); controlled length/options via props; onGenerate + onCopy callbacks; WAI-ARIA
  (role="group", labeled controls, aria-live copied announcement); 4 futuristic visual styling variants
  ("default", "card", "glass", "neon"); 3 size scales ("sm", "md", "lg"); React ref forwarding (forwardRef);
  useImperativeHandle (PasswordGeneratorHandle: generate/getValue/copy/setLength); and explicit displayName
  across compound and semantic alias exports (PasswordGenerator, PasswordCreator, SecurePasswordGenerator,
  PasswordMaker, default). Static module constant — never references ir.name/ir.description.
