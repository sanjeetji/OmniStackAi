task_id: R-424
id: R-424
title: "Live preview status - liveness-aware status + Studio polling"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Keep the Studio's view of a running preview accurate over time. Add LocalAppSession.is_alive() (true only
  when not stopped and every owned background process is still running). Make StudioPreviewManager.status()
  liveness-aware: when the active preview's processes have exited on their own, stop/forget the dead session
  and report a bounded, secret-free "stopped" state instead of a stale "ready". Have the Studio page poll the
  existing R-422 GET /api/preview route while a preview is running and re-render the preview surface on change,
  without reloading the embedded iframe when the URL is unchanged. Reuse the existing route and manager - no
  new routes, server, or live-serve wiring. Preserve collision-free ports, status/stop/restart + history
  controls, trusted-local studio:preview, build-only studio:serve, single-session cleanup, PostgreSQL, verify.
requirements:
  - LocalAppSession.is_alive(): false when stopped or no process; true only when every owned background process poll() is None.
  - StudioPreviewManager.status() refreshes liveness under its lock; dead active session -> stop/forget + bounded "stopped" state; else current state.
  - Studio page polls GET /api/preview while ready, re-renders on change, stops polling when not ready, and does not reload an unchanged iframe.
  - No new routes, server signature change, or live_serve wiring change.
  - Deterministic/offline verify via injected fakes.
acceptance_criteria:
  - is_alive() false when stopped / no processes / any process exited; true when all running.
  - status() returns live ready while alive; once processes exit, returns bounded "stopped" and stops the dead session exactly once.
  - Existing status/stop/restart/replace unchanged when the session stays alive.
  - Studio page polls GET /api/preview while running and re-renders on change without reloading an unchanged iframe.
  - Existing contracts compatible; focused + full verify + lint + security + env + both demos pass; 0 model calls in verify.
