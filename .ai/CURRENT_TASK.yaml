objective: >-
  `doctor` reports on the Python *version string* and nothing else. On this machine it printed
  "ok python3 is 3.13 (3.13.15)" while `python3 -m venv` was completely broken — Homebrew's
  python@3.13 and @3.14 both ship a pyexpat that fails to dlopen, which breaks plistlib, which
  makes `platform.mac_ver()` return empty strings, which makes pip's vendored truststore raise on
  `int('')`. Every Python-backend preview failed and `doctor` said the toolchain was fine; its
  remedy even recommends the broken path. A doctor that passes on a broken toolchain is worse than
  none, because it sends you looking in the wrong place.
  Make it check that the interpreter *works*, and finish the command set the founder reaches for:
  `start` and `stop` beside `up` and `down`, and a usage screen that reads as a set rather than a
  list.
