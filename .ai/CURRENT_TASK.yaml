schema_version: 1
task_id: R-249
title: IR indexes + unique constraints in the generated PostgreSQL schema
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Deepen the persistence layer (Brief 9/34/42): let the Application IR express column uniqueness and
  entity indexes, and render them in the generated schema. Add Field.unique (a single-column UNIQUE
  constraint) and a new Index record on Entity (fields + unique + optional name) for composite/named
  indexes. schema_sql emits `UNIQUE` on unique non-PK columns and `CREATE [UNIQUE] INDEX <name> ON
  <table> (<cols>);` per entity index (deterministic default name when unnamed). Additive IR fields
  (empty/false defaults, no schema-version bump); index field references are validated against the
  entity's own fields at construction. Pure/deterministic/offline — schema text only; nothing connects
  to or runs a database.
