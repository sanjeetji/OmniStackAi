objective: >-
  Implement F-10 Security scanning & automated test runs (spec R_&_D/specs/F-10-security-tests.md).
  Part 1 (Security): Dependency audit (pnpm audit, pip-audit, govulncheck), deterministic secret scan
  of generated source code (key prefixes, base64 blobs, .env), and framework security rules
  (dangerouslySetInnerHTML, CORS wildcard with auth, httpOnly/SameSite cookies, SQL string interpolation).
  Findings report severity, rule, file, line, message, fix suggestion. Checks list pass/fail/skipped
  (missing tools reported as skipped, never passed).
  Part 2 (Tests): Run test suites for web (pnpm test), Python (pytest/unittest), and Go (go test ./...),
  parse outputs into {suite, name, status, duration_ms, message}, and provide honest empty state when no tests exist.
  REST endpoints: POST /projects/{id}/security/scan, GET /projects/{id}/security, POST /projects/{id}/tests/run, GET /projects/{id}/tests.
  Console UI in Studio Manage -> Security and Studio Manage -> Tests tabs.
