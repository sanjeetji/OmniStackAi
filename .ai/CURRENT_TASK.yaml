requirements:
  - Pressing Cmd+Enter or Ctrl+Enter triggers form submission (requestSubmit).
  - Pressing Cmd+S or Ctrl+S triggers form submission and prevents browser save dialog.
  - Pressing Escape while focused in editable inputs (INPUT, TEXTAREA, SELECT) blurs the active field.
  - Pressing Escape outside editable inputs triggers Cancel navigation to parent list/overview, with unsaved changes confirmation if isDirty.
  - Backward-compatible, offline, deterministic (0 model calls), and diff-invariant across ir.description.

