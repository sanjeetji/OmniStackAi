branch: ai/R-550-publish-rules
objective: >-
  R-548 and R-549 made `brand.json` the one place branding lives and got a rebrand to every
  surface. Two things are left before that is genuinely safe and genuinely usable. First, nothing
  stops someone changing `identity.bundleId` after they have published — the one irreversible
  decision in the whole flow, because Apple ties it to the App Store Connect record and Google Play
  uses it as the listing's primary key and never lets anyone reuse one. Today the file merely warns
  in a comment. Second, a user asking the chat agent to "make it green" has no reason to land on
  `brand.json`: the file-selection heuristic ranks paths by word overlap, and nothing points at it.
  Add a real rule with a real explanation, and teach the agent where branding lives.
founder_gate: >-
  Founder asked on 2026-09-24 for changes before publishing to be easy by chat or by hand, and for
  a change after publishing to come back with the reason rather than silently succeeding. Agreed
  during planning: only the identifier is refused. Icon, colours and display name can all change in
  an update, so those warn rather than block — refusing them would be wrong.
