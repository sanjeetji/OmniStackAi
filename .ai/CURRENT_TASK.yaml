schema_version: 1
task_id: R-288
title: Deduplicated In-Flight Generated Mutation Requests
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the generated useCreate<Entity> / useUpdate<Entity> / useDelete<Entity> hooks dedupe concurrent
  invocations so a rapid double-submit (double-clicked Create/Save/Delete, or a programmatic re-call)
  cannot fire a duplicate POST/PUT/DELETE. While a mutation is in flight the hook returns the pending
  promise instead of starting a second request — completing the "no racing requests" story after the
  R-280/R-286/R-287 fetch cancellation work, now for writes. Reuse the existing hook state/return shape.
tracker_ref: "R-288"
requirements:
  - Each mutation hook owns a pendingRef (useRef<Promise<...> | null>, useRef already imported).
  - A mutate call while a request is in flight returns the pending promise (no duplicate network request).
  - The in-flight request is captured in the ref, cleared in finally, and loading/error still behave as before.
  - Preserve public hook names, callback signatures, and return shape ({ create|update|remove, mutate, loading, error, reset }).
  - Errors still set error state and reject; reset() unchanged.
  - Do not change fetch hooks (useList/useList<Child>By<Parent>/use<Entity>), the API client, backend, or IR.
  - Preserve deterministic generation and description-only IR stability.
acceptance_criteria:
  - useCreate/useUpdate/useDelete each emit `const pendingRef = useRef<Promise<...> | null>(null);` and, as the first statement of the callback, `if (pendingRef.current) return pendingRef.current;`.
  - The request body runs in an IIFE captured as `pendingRef.current = request;` and returned; `finally` sets `setLoading(false)` and `pendingRef.current = null;`.
  - The underlying `api.create/update/delete<Entity>(...)` call and the return shape are unchanged.
  - Fetch hooks and the API client are untouched; description-only IR changes remain byte-identical.
  - Focused tests, relevant hook tests, full offline verification, lint, security, env check, and both builder demos pass.
expected_impact:
