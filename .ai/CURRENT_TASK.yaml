  - the IR schema version or existing IR fields (Field.unique / Entity.indexes are additive defaults)
  - the model-gateway, runtime, verify, edit, data-access, auth, seed public behavior (additive)
  - the 0002_seed emission; the data-access/route/auth code (schema-only change)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - connect to or run a database; execute DDL; make a network call
  - add a platform Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - Field gains unique: bool = False (validated, serialized). Entity gains indexes: tuple[Index, ...] = ()
    where Index(fields, unique=False, name=None); each index field must be a declared field of the
    entity (construction error otherwise). Both round-trip via to_dict/from_dict; normalize_ir preserves
    them (entities pass through as objects).
  - render_postgres_schema emits `UNIQUE` on unique non-id columns (never on the PK id) and one
    `CREATE [UNIQUE] INDEX <name> ON <table> (<cols>);` per entity index, with a deterministic default
    name (<table>_<cols>_idx / _key) when unnamed; ordered deterministically; byte-stable.
  - No index/unique output when none declared; 0001_init.sql for a fixture-free IR is otherwise
    unchanged; nothing connects to or runs a database.
  - Standard-library offline tests cover the unique column, single + composite indexes (named/unnamed,
    unique/non-unique), the id-never-unique rule, the bad-index-field construction error, and round-trip.
