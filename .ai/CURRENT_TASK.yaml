schema_version: 1
task_id: R-226
title: Framework adapter contract and generated file-set model
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-226-adapter-contract
goal: >-
  Define the platform-owned code-generation boundary: an immutable, validated in-memory generated
  file-set (a customer project's source tree as path->content records) and a FrameworkAdapter contract
  that turns an Application IR into a GeneratedProject for a specific target, plus a deterministic
  adapter registry. This is the seam every framework adapter (Next.js, Go/Python, Flutter, RN, native)
  implements. Pure, offline, deterministic; no files are written to disk and no code is run.
