  live_workflow_tests: "6/6 pass against a running instance (role isolation, booking and
    double-booking, check-in and token call, consultation to signed prescription to audit,
    cashier collection, report arithmetic)"
  offline_tests: "18/18 in services/agent-engine/tests/test_template_care_clinic.py"
  browser_sweep: "48/48 pages across the three apps, signed in as their demo user, with no page
    errors and no failed requests"
  screenshots: "48 screens (patient 16, doctor 14, admin 18) plus a composed cover, 4.5 MB"
  live_gate: "40/40 through the console: catalogue, use template, preview ready in 35 s, every page
    through the authenticated proxy, an unknown path still 404s"
  typecheck: "pnpm -r typecheck clean across shared, api, patient, doctor and admin"
  catalog: "validate_template('templates/catalog/care-clinic') returns no errors; listed beside
    bazaar and ride-now" 
