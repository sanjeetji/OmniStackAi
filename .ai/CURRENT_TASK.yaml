  - Go handler sets X-Total-Count header on LIST and LIST_BY responses.
  - Go corsMiddleware includes Access-Control-Expose-Headers: X-Total-Count.
  - FastAPI repository emits count_<table> and count_<table>_by_<rel> queries.
  - FastAPI router sets X-Total-Count header on LIST and LIST_BY responses.
  - FastAPI CORSMiddleware includes expose_headers=["X-Total-Count"].
  - Next.js lib/api.ts supports reading total count or paginated response metadata.
  - Response body remains Entity[] (array payload preserved).
  - task verify green; 0 network calls.
