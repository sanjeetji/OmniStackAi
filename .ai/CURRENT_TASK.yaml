schema_version: 1
task_id: R-241
title: Authentication guards from the IR (enforce the endpoint auth flag; surface roles)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the IR's per-endpoint auth flag real (Brief 9/27/34/55): generate an authentication guard that
  every endpoint with auth=true enforces, rejecting a request with no bearer credential (HTTP 401)
  before the handler runs. Python (FastAPI) gets app/auth.py with a require_auth dependency and wired
  routes declare dependencies=[Depends(require_auth)]; Go gets internal/handlers/auth.go with a
  RequireAuth(next) middleware and main wraps the auth endpoints with handlers.RequireAuth(...). The IR
  roles are surfaced as a generated ROLES/Roles constant (a documented anchor for future per-endpoint
  authorization; token signature/expiry/role checks are an explicit TODO in the generated code, not
  faked). Emitted only when the IR declares at least one auth=true endpoint; applies to both DB and
  non-DB backends. Deterministic and offline; nothing runs; the R-237 edit loop diffs the guards when
  the IR changes.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [9, 27, 34, 35, 55, 64, 74, 77, 83, 84, 85, 92]
  founder_note: >-
    Founder approved continuing after R-240; enforcing auth is a core real-app feature and the IR auth
    flag was previously only a comment. Committed directly to main; author solely sanjeetji; tooling
    adds a Co-Authored-By trailer.
