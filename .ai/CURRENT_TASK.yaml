objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Currency / Money Input compound
  component suite (components/currency-input.tsx): a numeric money field that sanitizes typed input to a
  clean numeric string, parses it to a number, clamps to min/max on blur, and formats the value as
  locale-aware currency via the built-in Intl.NumberFormat (style: 'currency') when unfocused (plain
  numeric while focused for easy editing); configurable currency + locale, min/max/step, allowNegative;
  controlled + uncontrolled value (number); onChange (value|null, formatted) and onBlur callbacks; WAI-ARIA
  (labeled input, aria-invalid, aria-required, inputMode="decimal"); 4 futuristic visual styling variants
  ("default", "card", "glass", "neon"); 3 size scales ("sm", "md", "lg"); React ref forwarding (forwardRef);
  useImperativeHandle (CurrencyInputHandle: getValue/getFormatted/setValue/clear/focus); and explicit
  displayName across compound and semantic alias exports (CurrencyInput, MoneyInput, CurrencyField,
  PriceInput, default). Static module constant — never references ir.name/ir.description.
