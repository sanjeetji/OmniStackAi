  cloud_calls: 0
live_proof: >-
  PostgreSQL, four backends: GET /posts/not-a-uuid is 422 on Python, Go, Express and Hono; with the
  database unreachable Express and Hono answer create and list with 500 (not a fake 201 / empty list),
  leak no internals, and stay up with /healthz reporting the database unavailable. The R-591 (84) and
  R-590 (32) live suites re-run green on the same builds.
decision: >-
  "A Vibe build fails if anything is unwired" was implemented as: nothing is ever faked, unwired parts
  answer honestly (501 / a not-connected page), and the build names them. Failing the whole build
  would punish a plan for one missing endpoint; hiding it was the actual harm.
blockers: []
deferred: []
found_and_fixed:
  - "Node fell back to an in-memory Map on any database error and reported success (data 'saved' then lost)."
  - "Node answered endpoints it could not wire with 200 and a placeholder body."
  - "'cart' and 'review' screens shipped invented products and reviews; fallback pages had buttons with no handler."
  - "Go sent raw database errors to clients (SQL state included); Node's error handler sent err.message."
  - "A malformed id answered 500 on every backend."
  - "Express 4 would have crashed the Node server on the first async database error once the fake fallback was removed; moved to Express 5." 
