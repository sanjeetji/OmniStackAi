branch: ai/R-556-layout-variants
objective: >-
  R-543 gave the generator an archetype family, so a shop, a blog and a booking site no longer look
  alike. Two shops still do. `_public_home_page` renders one fixed structure — centred hero, then
  an offering grid, then a browse row, then a footer — and only the words change. Two people
  building storefronts get the same page with different nouns, which is the repetitiveness the
  founder keeps naming.
  Give the deterministic generator real layout variants: genuinely different structures, chosen by
  a seed derived from the product itself, so two projects differ while one project stays stable.
founder_gate: >-
  The founder's standing complaint since 2026-09-24: generated UIs should be "modern, cool,
  non-repetitive". R-543 fixed across archetypes; this fixes within one.
