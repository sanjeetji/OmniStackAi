schema_version: 1
task_id: R-285
title: Server-Side Subcollection Filter Wiring in Generated Next.js Screens
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Wire generated Next.js subcollection hooks and controls to R-284's allowlisted boolean/enum LIST_BY
  query parameters so child filtering occurs on the server before pagination in both collection
  master-detail and dedicated detail views.
tracker_ref: "R-285"
requirements:
  - Reuse _filterable_fields_for_entity as the single Next.js child-field allowlist.
  - Give filterable useList<Child>By<Parent> hooks typed filter state plus setFilter and clearFilters.
  - Flatten active filters into LIST_BY ApiOptions.params without changing the relation path parameter.
  - Reset child offset to zero on filter change or clear.
  - Render boolean and enum controls in both subcollection view sites using hook state.
  - Render server-returned child rows directly; never re-filter the loaded page in the component.
  - Preserve existing generated output for non-filterable subcollections and description-only IR changes.
acceptance_criteria:
  - A filterable child hook uses UseCollectionListParams/UseCollectionListState and an IR-derived allowlist.
  - setFilter accepts only declared bool/enum values, clearFilters removes all, and both reset offset.
  - LIST_BY requests flatten filters into params while preserving search, sort, limit, and offset.
  - Both parent collection and parent detail screens render bool pills, enum selects, active count, and Reset.
  - Empty filtered responses offer Clear filters and do not show the create-first empty state.
  - Non-filterable minimal-blog Comment generation remains byte-compatible with R-284.
  - Focused tests, full offline verification, lint, security, env check, and both builder demos pass.
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/codegen/nextjs.py
  - services/agent-engine/tests/test_subcollection_field_filter_wiring.py
  - focused existing subcollection tests only if exact generated output assertions require updates
  - .ai task/state/handoff/work-log files, PROJECT_STATE.md, CHANGELOG.md, docs/PROGRESS.md, docs/RESUME_PROMPT.md, docs/CODEGEN.md, and execution tracker
allowed_paths:
  - services/agent-engine/src/omnistackai_agent_engine/codegen/nextjs.py
  - services/agent-engine/tests/**
  - .ai/**
  - CHANGELOG.md
  - PROJECT_STATE.md
  - docs/**
  - R_&_D/OmniStackAI_Execution_Tracker_v6.xlsx
forbidden_paths:
  - services/agent-engine/src/omnistackai_agent_engine/application_ir/**
  - services/agent-engine/src/omnistackai_agent_engine/codegen/data_access.py
  - services/agent-engine/src/omnistackai_agent_engine/codegen/backend_python.py
  - services/agent-engine/src/omnistackai_agent_engine/codegen/backend_go.py
  - services/agent-engine/src/omnistackai_agent_engine/codegen/openapi.py
  - package.json
  - pnpm-lock.yaml
must_not_change:
  - PostgreSQL, platform schemas/migrations, or R-284 backend query semantics
  - Section 74 monorepo layout, provider boundaries, infrastructure, or native/mobile scope
  - Application IR schema or top-level collection filter behavior
gates:
  - focused subcollection filter wiring tests
  - task verify
  - task lint
  - task security:quick
  - task env:check
  - task builder:demo -- minimal-blog
  - task builder:demo -- rideshare-favourites
  - generated TypeScript artifact inspection
model_tool_trace:
  routing: deterministic_only
  local_calls: 0
  cloud_calls: 0
  note: Pure deterministic code generation and offline tests; no model call is needed.
evidence: []
blockers: []
next_action: >-
  Add focused failing tests for a filterable child hook and both subcollection UI sites, then implement
  the smallest shared hook/control extension without changing backend, IR, or top-level list behavior.
next_command: >-
  env PYTHONPATH=services/agent-engine/src python3 -m unittest discover -s services/agent-engine/tests -p 'test_subcollection_field_filter_wiring.py' -v
