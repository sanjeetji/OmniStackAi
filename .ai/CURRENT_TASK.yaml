objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Credit Card Payment Field
  compound component suite (components/credit-card.tsx): card-number, expiry (MM/YY), CVC, and optional
  cardholder-name fields with real-time formatting, IIN-prefix brand detection (visa/mastercard/amex/
  discover/unknown), Luhn checksum validation of the number, expiry validity (valid month + not in the
  past), and brand-aware CVC length; a computed meta object ({brand, numberValid, expiryValid, cvcValid,
  complete}); an optional live card preview; controlled + uncontrolled value (Partial); onChange (value,
  meta) and onComplete callbacks; WAI-ARIA (labeled inputs, aria-invalid, aria-describedby, inputMode
  numeric); 4 futuristic visual styling variants ("default", "card", "glass", "neon"); 3 size scales
  ("sm", "md", "lg"); React ref forwarding (forwardRef); useImperativeHandle (CreditCardHandle:
  getValue/getMeta/clear/focus); and explicit displayName across compound and semantic alias exports
  (CreditCard, CreditCardField, PaymentCardField, CardInput, default). Static module constant — never
  references ir.name/ir.description.
