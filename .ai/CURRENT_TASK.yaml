schema_version: 1
task_id: R-283
title: Server-Side Collection Filter Wiring in Generated Next.js Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Replace R-278's client-side boolean/enum filtering over the currently loaded page with request-level
  filters in the generated top-level useList hook. Existing collection controls must send the exact
  R-282 backend query keys and option values, reset pagination, refetch through the existing race-safe
  request path, render server-returned data directly, and preserve the existing toolbar and empty-state
  experience. Scope is top-level collection screens only.
tracker_ref: "R-283"
requirements:
  - Extend generated top-level list state with optional string filters and deterministic filter setters; changing or clearing filters resets offset to zero.
  - Merge active filters into the list API request query params so R-282 boolean/enum backend filters apply before pagination.
  - Wire generated boolean pills and enum selects to the hook filter setters using the exact IR field name and option value; all/empty removes the parameter.
  - Remove page-local useMemo/data.filter filtering and render the server-returned list directly while retaining active-filter counts, Reset, and no-results recovery.
  - Keep URL deep-linking coherent by hydrating and syncing only the known filterable field keys for each top-level list hook.
  - Entities without boolean/enum fields emit no filter controls; no IR schema field, backend change, npm dependency, platform dependency, or model call.
acceptance_criteria:
  - UseCollectionListParams exposes filters as Record<string, string>; filterable top-level list state exposes setFilter and clearFilters without changing LIST_BY hooks.
  - setFilter omits empty/all values, clearFilters removes every filter, and both reset offset to page one.
  - The top-level list request forwards filters as ordinary query parameters together with pagination, search, and sort parameters.
  - Collection controls call setFilter with field.name keys; Clear/Reset call clearFilters; displayData is data ?? [] and no generated useMemo/data.filter block remains.
  - URL hydration/sync accepts only generated allowlisted filter field names and writes only active values.
  - Description-only IR changes produce byte-identical hooks, API client, and collection screen output; non-filterable entities emit no filter UI.
  - task verify, task lint, task security:quick, and both builder demos pass with real output; generated page.tsx, lib/hooks.ts, and lib/api.ts are inspected.
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/codegen/nextjs.py
  - services/agent-engine/tests/test_collection_field_filters.py
  - focused existing Next.js codegen tests if exact generated assertions require updates
