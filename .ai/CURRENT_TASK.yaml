branch: ai/R-549-brand-reaches-web
objective: >-
  Branding is scattered across files that do not know about each other. Changing one colour means
  editing `apps/web/styles/tokens.css`, the same eleven variables again in `apps/admin`,
  `apps/mobile/app.json` twice, and `apps/mobile/src/design-system/tokens.ts` — then regenerating
  four PNGs by hand, which a user cannot do at all because the generator is Python inside the
  platform. Changing the app's *name* is worse: it appears in `app.json`, both `package.json`s, the
  READMEs and the bundle identifier.
  Give every generated project one `brand.json` that the apps derive from, using Expo's documented
  dynamic-config pattern (`app.config.js`) rather than a static `app.json`. This is the foundation
  the founder chose ("Option C"): R-549 regenerates icons from it, R-550 adds publish-state rules
  and teaches the chat agent to edit it.
founder_gate: >-
  Founder chose Option C on 2026-09-24 and asked that a user be able to change colour, icon and
  name before publishing, by chat or by hand. Correction recorded during planning and agreed: only
  the bundle identifier is permanent after publishing — icon, colours and display name can all
  change in an update, so the later guard must refuse the identifier and warn on the rest rather
  than blocking everything.
