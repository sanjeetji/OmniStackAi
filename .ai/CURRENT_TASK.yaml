branch: ai/R-554-ecosystem-monorepo
objective: >-
  `plan_ecosystem_from_prompt` plans four role-scoped surfaces for a food-delivery prompt — a
  customer ordering app, a merchant portal, a courier dispatch app and a super-admin dashboard —
  and `build_ecosystem` materialises each one as **its own separate Git repo with its own backend
  and its own database**. That is four disconnected apps, not an ecosystem: the courier's app
  cannot see the customer's order, which is the entire point of the thing.
  Assemble a plan into **one** monorepo instead: every surface under `apps/<id>/`, over one
  `services/api` and one database, the way the hand-built templates do it. Each app keeps its own
  entity scope and its own role; the backend serves the union so every surface's calls resolve.
founder_gate: >-
  The founder's recurring requirement, restated on 2026-09-24: "single app to complete eco-system".
  R-553 removed the preview's two-app ceiling so such a project can be run at all.
