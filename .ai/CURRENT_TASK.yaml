objective: >-
  Model-written pages back on for every Vibe build. The build and its template preview stay as fast
  as today; then a separate, billed "design pages" step has the model write each app's home page and
  its main screens one by one, each type-checked and repaired (PC-097) or kept as the template, so a
  broken page never ships. Page writing uses a model that can take the request (a larger context and
