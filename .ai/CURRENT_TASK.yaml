acceptance:
  - Parent entities with wired Op.LIST_BY endpoints detect subcollection relations.
  - Collection screen imports subcollection hooks and child types when subcollections exist.
  - Collection screen manages selectedId state and row selection interaction in master table.
  - Subcollection section renders child items scoped to selectedId (useList<Entities>By<Rel>(selectedId)).
  - Subcollection count badge displays total count.
  - Child item list renders loading, error, empty, and data states.
  - Entities without subcollections remain clean with no subcollection code emitted.
  - Multi-subcollection support with tabbed navigation.
  - Detail screen intent renders parent details and subcollections.
  - Diff invariance maintained across ir.description modifications.
  - task verify green; 0 network calls.
