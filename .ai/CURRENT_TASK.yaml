schema_version: 1
task_id: R-230
title: Go backend framework adapter — generate a Go net/http service from the IR
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add a third framework adapter: a GoBackendAdapter that turns an Application IR into a real,
  idiomatic Go standard-library net/http service as a GeneratedProject — go.mod, main.go (Go 1.22
  method+pattern routing + health), internal/models structs from entities, internal/handlers grouped
  by resource with 501 scaffolds and r.PathValue params, README/.gitignore/.env.example. Proves the
  one-IR -> many-targets differentiator (Next.js web + FastAPI + Go). Deterministic and offline;
  nothing installed, built, run, or written to disk. Registered via the AdapterRegistry.
