schema_version: 1
task_id: R-252
title: Enforce go-playground validation in the generated Go create handlers
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the R-251 Go validate:"..." struct tags actually enforced at request time (Brief 9/26/27).
  When a wired CREATE handler's entity carries validation rules, the generated Go backend now: (1)
  declares github.com/go-playground/validator/v10 in its own go.mod; (2) emits
  internal/handlers/validate.go — a shared validator instance (validator.New()) plus a validateStruct
  helper that returns 400/"validation_failed" when a payload violates its tags; and (3) calls
  validateStruct on the decoded body in each such CREATE handler, right after JSON decode and before the
  store.Create call, returning 400 on failure. Rule-free projects are byte-identical to R-251 (no
  validator dependency, no validate.go, no call), so the examples and existing Go assertions are
  unchanged. FastAPI already enforces at construction via Pydantic — this task closes the Go gap only.
  Additive/offline; the dependency lives ONLY in the generated project's go.mod; nothing is installed,
  built, run, or connected to a database here.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [9, 26, 27, 34, 42, 74, 77, 83, 84, 85, 92]
  founder_note: >-
    Founder chose option 1 after R-251 ("Go with option 1 ... bcoz we do not want anything static or
    seeds data in our platform"): wire go-playground enforcement in the Go handlers rather than render
    seed/indexes/validation in the static console. Committed directly to main; author solely sanjeetji;
    tooling adds a Co-Authored-By trailer.
