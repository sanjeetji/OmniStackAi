schema_version: 1
task_id: R-245
title: Combined project-plan surface (preview + verify + deploy per generated app)
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Compose the existing plan builders into one per-app view a console/CLI can render (Brief 15/26/27/51):
  for an Application IR, build a ProjectPlan whose AppPlan entries pair each assembled app (label,
  directory, target from R-232 assembled_targets) with its local preview plan (R-233 LocalRuntimeProvider),
  its verify gate ladder (R-235 verify_plan), and, when a key-activated deploy provider is supplied, its
  deploy plan (R-234). Provide a JSON-serializable to_dict and a readable render() summary, plus a
  task plan:show that prints the plan for an example IR. Pure and deterministic — it only builds plans;
  nothing is installed, run, verified, or deployed.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [15, 26, 27, 51, 74, 75, 77, 83, 84, 85, 92]
  founder_note: >-
    Founder approved continuing after R-244. R-245 ties runtime + verify + assembler plans into one
    surface for the console/CLI. Committed directly to main; author solely sanjeetji; tooling adds a
    Co-Authored-By trailer.
project_profile:
  repository: platform_modular_monorepo
  service: python_agent_engine
  control_plane_database: postgresql
  model_routing: balanced
complexity: L2
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/projectplan.py
  - services/agent-engine/tests/test_projectplan.py
  - scripts/agent-engine.sh
  - Taskfile.yml
  - docs/RUNTIME.md
  - docs/PROGRESS.md
  - portable state, changelog, handoff, task doc, and tracker evidence
allowed_paths:
  - .ai/**
  - CHANGELOG.md
  - PROJECT_STATE.md
  - R_&_D/OmniStackAI_Execution_Tracker_v6.xlsx
  - Taskfile.yml
  - docs/**
  - scripts/**
  - services/agent-engine/**
must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the runtime/verify/codegen public behavior (this only composes existing builders; additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install/run/verify/deploy anything; make a network call; require a key (deploy plan only when a
    provider is passed in)
  - add a platform Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - build_project_plan(ir) returns a ProjectPlan whose AppPlan entries pair each assembled app with its
    preview plan (when the target is runnable locally) and its verify plan (when the target is
    supported); a deploy plan is included only when a DeploymentProvider is passed.
  - ProjectPlan.to_dict is JSON-serializable and contains no secret; render() is a readable multi-app
    summary (dir/target, preview url + commands, verify gates, deploy steps when present).
  - task plan:show -- <example> prints the combined plan for an example IR; task verify stays green and
    network-independent.
  - Standard-library offline tests cover the composition (preview + verify present per app), the deploy
    opt-in, JSON-serializability + no-secret, and determinism.
required_gates:
  - impact_analysis
  - build_project_plan_composition_tests
  - deploy_opt_in_test
  - json_serializable_no_secret_test
  - determinism_test
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
model_tool_trace:
  routing: local_only
  local_provider: ollama
  configured_model: qwen2.5-coder:14b
  local_calls: 0
  cloud_calls: 0
  note: Deterministic; no model call, no network, nothing run/verified/deployed. cloud_calls zero.
