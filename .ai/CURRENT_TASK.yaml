objective: >-
  A product's lifecycle cannot be written down. An order that goes placed -> accepted -> picked_up
  -> delivered, who is allowed to move it, and what a courier may not do, have nowhere to live in
  the IR. `route_wiring.wire_endpoint` matches six CRUD shapes, so `POST /orders/{orderId}/accept`
  wires to nothing and the Python backend emits a 501 stub for it — visible, but not a product.
  R-564 built the capability frame and deliberately shipped the registry empty: nothing may be
  declared until something can build it. This task registers the first kind with real code
  generation behind it, which is what proves the frame and sets the pattern for money, jobs,
  realtime and permissions after it.
founder_gate: >-
  Founder on 2026-09-26: continue with Phase 2 in the order that suits.
