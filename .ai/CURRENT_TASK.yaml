must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway, Application IR, and codegen public behavior (additive package)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - write anywhere except the caller-provided target directory; never touch the platform repo
  - depend on global git config; make any network call; store secrets
acceptance:
  - materialize_project writes every GeneratedFile under the target directory, creating parent dirs,
    refusing any path that would escape the target, and (unless overwrite) refusing a non-empty target;
    executable files get the executable bit.
  - create_repository initializes a Git repo in the target, stages all files, and makes one commit with
    the customer as author/committer via explicit -c identity (no global git config), returning the
    commit SHA and file count.
  - The written tree exactly matches the GeneratedProject (paths and contents), and the repo has
    exactly one commit containing those files.
  - Standard-library + local git only; deterministic; offline; nothing outside the target is modified.
  - Standard-library offline tests (in a temp dir) cover materialization, escape refusal, non-empty
    refusal, repo init/commit, author identity, and tree/commit correctness.
  - task verify stays green and network-independent.
required_gates:
  - impact_analysis
  - materialize_and_escape_refusal_tests
  - repo_init_commit_and_identity_tests
  - tree_matches_project_test
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
