schema_version: 1
task_id: R-009
title: Deterministic usage and cost accounting for the model gateway
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-009-usage-cost-accounting
goal: >-
  Add a deterministic, privacy-safe usage and cost accounting layer for the model gateway. Every
  gateway dispatch (success or failure) is recorded as an immutable metadata-only record (provider,
  model, tier, complexity, token usage, latency, finish reason, success/error code) with an estimated
  monetary cost computed from a configurable price book (local Ollama = zero). A ledger aggregates
  totals and per-provider/per-model breakdowns, latency percentiles, success/failure counts, and cost
  per successful call, so the platform can optimize cost per successful accepted change (Brief 18.4,
  68, 92.15). No prompt content or secret is ever stored.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed because R-009 is absent from the supplied workbook
  brief_sections: [18, 18.2, 18.4, 23, 25, 26, 27, 68, 74, 84, 85, 90, 91, 92]
  founder_intent: >-
    Founder selected usage and cost accounting for R-009 and asked for a best-in-class implementation.
project_profile:
