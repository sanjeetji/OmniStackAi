scope_note: >-
  scripts/test.sh was updated to evolve a stale R-005-era guard that forbade any provider adapter
  (it matched cloud hostnames and the word Adapter). Cloud adapters are the sanctioned R-008
  deliverable, so the guard now enforces the durable invariants instead: no vendor SDK import, the
  gateway/cloud/bootstrap files exist, and cloud providers are opt-in with OMNISTACKAI_CLOUD_PROVIDER
  defaulting to none. This was necessary to implement the founder-approved multi-provider adapters.
must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the R-005 ModelProvider protocol/records, R-006 Ollama adapter, or R-007 gateway public behavior
  - local Compose services or infrastructure (Redis, NATS, object storage, Kubernetes, Temporal)
  - auth, organizations, billing, Git integration, audit, or business APIs
  - native mobile or device-cloud functionality
  - the Section 74 top-level monorepo contract; no new top-level directory
  - the network-independence of static task verify
must_not_do:
  - make any real cloud API call (no keys are configured; tests use injected fake HTTP openers)
  - add a third-party provider SDK or any external Python dependency
  - place any API key value in source, tests, logs, state files, prompts, or commits
acceptance:
  - Each cloud adapter implements the ModelProvider boundary using only the Python standard library over HTTPS; no vendor SDK and no external dependency are added.
  - OpenAI, OpenRouter, and Groq share one OpenAI-compatible chat-completions adapter; Anthropic uses its Messages API; Google uses its generateContent API. Each maps messages, output, finish reason, and token usage into the existing vendor-neutral records.
  - Every adapter reads its API key only from the environment, sends it only as the provider auth header, and never includes it in logs, errors, or records.
  - Each provider has a documented default model that the operator can override by environment variable, plus conservative per-model context and output budgets.
  - An env bootstrap always registers local Ollama and registers each cloud provider whose key is present; when no cloud key is set only Ollama is registered and L3/L4 return the stable no-eligible-provider outcome.
  - The bootstrap selects the active L3/L4 cloud tier from OMNISTACKAI_CLOUD_PROVIDER and builds a Balanced gateway; a selected provider without a key is a clear configuration error, not a silent local downgrade.
  - Standard-library offline tests cover request mapping, auth-header construction, success and error responses, response-size and timeout bounds, key-absent deactivation, and bootstrap registration/selection, all with injected fake openers and zero network access.
  - The live gateway runner still runs on local Ollama with no keys, and static task verify stays network-independent and green.
