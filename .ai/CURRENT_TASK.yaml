branch: ai/R-544-brand-tokens
objective: >-
  A user can ask for a red shop or a rounded, serif brand and the generated app comes out the same
  blue as every other one. The brand pipeline is disconnected in three separate places:
  `nl_to_ir` never asks the model for a brand, so a prompt-built IR always carries the defaults;
  `extract_brand_tokens` (R-514) exists but is called from nowhere in src or tests, so the
  deterministic cues in the prompt are never read; and `styles/tokens.css` is emitted as a static
  string that never consults `ir.brand`, so even a brand that *is* set is ignored. The only place a
  requested colour surfaces today is a swatch inside `components/color-picker.tsx`.
  Connect it end to end, deterministically, so the colour, font and corner style a user asks for
  actually reach the app they get. Tailwind already maps `primary` to `var(--color-primary)`, so
  the token CSS is the single seam that makes every component follow.
