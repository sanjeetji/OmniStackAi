schema_version: 1
task_id: R-246
title: Richer edit-loop diffs (hunk-level unified diffs + rename detection)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make an IR edit read as a focused patch instead of whole-file churn (Brief 6/27): on top of the R-237
  file-level ProjectDiff, add a line-level report that produces git-style unified (hunk) diffs for
  modified files and detects exact-content renames (a deleted file whose content matches an added file
  is reported as a rename, not delete+add). Provide diff_report(old, new) returning structured FileDiff
  records (kind added/modified/deleted/renamed, path, old_path, unified patch) and unified_patch(old,
  new) returning one git-style patch string. Pure and deterministic, standard-library difflib only;
  additive — diff_projects / apply_diff / plan_edit are unchanged; nothing is run or written to disk.
