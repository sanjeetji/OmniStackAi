task_id: R-426
id: R-426
title: "Remove a build from the Studio history"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Let the operator clear a recorded build from the Studio's in-session Recent builds list. Add
  StudioBuildHistory.remove(build_id) -> bool (thread-safe; removes by id, returns whether it existed).
  Expose it over the stdlib server as POST /api/history/delete {id} via an injected delete_build_fn(build_id)
  -> dict (reusing the generic id-body reader); unset -> 404, missing id -> 400. Because removing an entry
  only edits the bounded in-memory list (never executes generated code, touches the DB, or deletes on disk),
  the delete handler is wired in both Studio modes (alongside history listing) and returns the refreshed,
  bounded, secret-free history ({removed, builds}) so the page re-renders in one call. The Studio page adds a
  per-build Remove action, DOM-only. No change to build/preview/re-preview/open-folder/live status/status/
  stop/restart, collision-free ports, single-session cleanup, PostgreSQL, or studio:serve/studio:preview.
requirements:
  - StudioBuildHistory.remove(build_id) -> bool (thread-safe): removes by id, reports presence; unknown id safe no-op False.
  - POST /api/history/delete {id} via injected delete_build_fn (reuse generic id-body reader); unset 404, missing id 400, errors 502.
  - Wire delete in both Studio modes (in-memory only); handler returns refreshed bounded secret-free history {removed, builds}.
  - Per-build Remove button on the page wired to /api/history/delete, re-renders the list, DOM-only.
  - Secret-free payloads/logs; nothing deleted on disk or in the DB.
  - Deterministic/offline verify via injected fakes.
acceptance_criteria:
  - remove True drops the entry (gone from list/get); unknown id -> False, no error.
  - POST /api/history/delete {id} returns handler payload when wired, 404 when not, 400 on missing id; handler gets the id.
  - Delete route available in build-only and preview modes (in-memory only).
  - Studio page exposes per-build Remove wired to /api/history/delete and re-renders the list.
  - Existing contracts compatible; focused + full verify + lint + security + env + both demos pass; 0 model calls in verify.
