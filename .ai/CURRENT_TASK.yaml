objective: >-
  Permissions beyond role: ownership and row-level rules in generated apps. A record created by a
  signed-in user records who created it (seen live in PC-008: a published notes app saved notes
  with created_by null, so private notes were not private); an entity can be owner-scoped ("a driver
  sees only their own orders", "private notes"), so its list, read, update and delete answer only
  the owner's rows unless the user's role is allowed to see all; the planner derives these rules
  from the prompt; every backend the platform generates enforces the same rules.
