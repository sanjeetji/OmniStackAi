schema_version: 1
task_id: R-242
title: Real JWT verification in the generated auth guard (HS256, secret from env)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Upgrade the R-241 authentication guard from a bearer-presence check to real token verification
  (Brief 9/27/55/64): the generated guard decodes and verifies a JWT (HS256) using a JWT_SECRET read
  from the environment, returning 401 on a missing/invalid/expired token and 500 when the secret is not
  configured (never a fabricated default). Python (FastAPI) require_auth uses PyJWT and returns the
  verified claims; Go RequireAuth uses github.com/golang-jwt/jwt/v5 and rejects a non-HMAC/invalid
  token. The generated projects gain the JWT dependency (requirements.txt / go.mod) and a JWT_SECRET
  placeholder in .env.example (empty — no secret committed). The IR roles stay surfaced as a constant;
  per-endpoint role ENFORCEMENT needs an IR field and is a follow-up. Emitted only when the IR declares
  an auth=true endpoint. Deterministic and offline (emit files, assert contents) — no token is signed or
  verified at generation time, nothing runs, no network.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [9, 27, 34, 55, 64, 74, 77, 83, 84, 85, 90, 92]
  founder_note: >-
    Founder approved continuing after R-241 toward real token verification + roles. R-242 delivers real
    JWT verification; per-endpoint roles follow once the IR carries required roles. Committed directly to
    main; author solely sanjeetji; tooling adds a Co-Authored-By trailer.
