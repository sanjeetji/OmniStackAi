acceptance:
  - Form screen declares lastSavedId state (useState<string | null>(null)).
  - Form submission captures created record ID (res.id) into setLastSavedId in create mode.
  - Form submission sets setLastSavedId(editId) in edit mode.
  - Success banner preserves exact text {isEdit ? "{name} updated successfully!" : "{name} saved successfully!"} (or {name} saved successfully!).
  - Success banner renders "View {name}" link navigating to /{detail_screen.id}?id=${lastSavedId || editId} when a detail screen exists.
  - Success banner renders "&larr; Back to {plural}" link navigating to /{list_screen.id} when a collection screen exists.
  - Success banner renders "+ Create another {name}" action button in create mode.
  - Success banner renders dismiss button calling setSuccess(false).
  - Form footer renders "Cancel" link button navigating to /{list_screen.id} (or /).
  - Reset button resets lastSavedId (setLastSavedId(null)).
  - Strict diff invariance across ir.description changes.
  - Stage 0 verification (task verify), task lint, task security:quick, task doctor, and builder demos pass.
