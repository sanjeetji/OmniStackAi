deferred:
  - "R-591: the generated Go backend verifies tokens but never issues one. There is no login or register endpoint, so a Go app with auth has no way for a real user to sign in apart from a dev bypass. Found while testing role guards; it is a feature of its own, not a fix to this task."
found_and_fixed:
  - >-
    `Update<Entity>` in every generated Go backend returned a blank record. It declared `var out`,
    scanned the RETURNING row into `m`, and returned `&out` — never written. So every PATCH/PUT
    answered with empty fields while the database held the right row. Found because the new setter,
    built on the same scaffold, hit the same mismatch the other way round and failed to compile.
    Proven fixed over HTTP: a PATCH now returns the edited title and the real id.
  - >-
    An existing test pinned that bug as the expected behaviour — it asserted `return &out, nil`,
    the exact line returning the blank struct. The R-549 pattern again: a test asserting on text
    where the text was the defect. It now asserts the scanned row is the returned row.
