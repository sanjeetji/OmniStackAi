schema_version: 1
task_id: R-286
title: Race-Safe Generated Subcollection Refetches
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make generated useList<Child>By<Parent> hooks cancel superseded LIST_BY requests and ignore stale
  completions so rapid parent, search, sort, pagination, or filter changes cannot overwrite current
  subcollection state.
tracker_ref: "R-286"
requirements:
  - Give every generated LIST_BY hook its own AbortController ref.
  - Abort the prior request before handling an empty parent ID so deselection also cancels in-flight work.
  - Pass the internal controller signal to the typed LIST_BY client after caller options so it cannot be overridden.
  - Ignore aborted success and AbortError paths without surfacing an error.
  - Let only the active request clear loading state.
  - Abort an in-flight request when the hook effect cleans up or unmounts.
  - Preserve filter flattening, parent path scoping, and all existing public hook state/signatures.
acceptance_criteria:
  - Both filterable and non-filterable subcollection hooks emit AbortController race protection.
  - A parent becoming null aborts the previous request before data, total, and loading reset.
  - Generated API calls retain params/requestParams and use signal ordering that caller options cannot replace.
  - Aborted responses cannot set data, total, error, or loading for a newer request.
  - Effect cleanup aborts the current request and description-only IR changes remain byte-identical.
  - Focused tests, all subcollection tests, full offline verification, lint, security, env check, and both builder demos pass.
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/codegen/nextjs.py
  - services/agent-engine/tests/test_subcollection_request_cancellation.py
  - services/agent-engine/tests/test_subcollection_field_filter_wiring.py
  - services/agent-engine/tests/test_collection_deeplink_state.py
  - services/agent-engine/tests/test_nextjs_hooks.py
