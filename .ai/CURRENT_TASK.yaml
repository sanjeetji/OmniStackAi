  - CHANGELOG.md
  - R_&_D/OmniStackAI_Template_Marketplace_Plan_v1.md
forbidden_changes:
  - No new template dependency beyond the pinned stack
  - task verify stays offline with 0 model calls
  - No real credentials in the template or the repository
  - platformctl must reuse the control-plane's own password hashing, never its own
required_gates:
  - Every doctor page reads live API data; no hard-coded table anywhere in apps/doctor
  - The consultation chain writes real records (SOAP, diagnosis, prescription, lab order)
  - Diagnosis coding searches a seeded ICD-10 catalogue
  - API unit tests and the live cross-app workflow tests pass
  - 48 screenshots recaptured from the running template
  - omnistack.sh fresh wipes and creates an owner who can sign in to the console
  - task verify passes
