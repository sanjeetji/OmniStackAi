title: Deep-Linking & Entity Lifecycle in Next.js Detail Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Enhance generated Next.js detail screens and connect collection screens for complete lifecycle navigation:
  - Add query param auto-loading in _detail_screen_page using useSearchParams to parse searchParams.get("id") on mount.
  - Wire Edit and Delete action controls on the loaded detail card:
    * "Edit {name}" link navigating to /{form_screen.id}?id=${selectedId} when can_edit and form_screen exist.
    * "Delete {name}" button invoking useDelete<Entity>() with confirmation prompt and state cleanup when can_delete.
  - Add single-record "Export JSON" button with client-side Blob download ({name.lower()}_{id}.json).
  - Add breadcrumb navigation linking back to collection screen (&larr; Back to {plural}).
  - In _collection_screen_page, detect dedicated detail_screen and render a "View" link in table row action cells.
  - Maintain strict diff invariance across ir.description modifications.
  - Fully offline, 0 network, 0 external dependencies.
