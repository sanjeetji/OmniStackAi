objective: >-
  Third task of the approved 7-task Phase D roadmap. Replace /studio's one-shot prompt form with a
  persistent, multi-turn chat thread on R-475's shell, wired to R-476's new
  POST /jobs/build/{id}/edit and GET /jobs/build/{id}/turns routes. buildId (null vs. set) is the
  single piece of state deciding whether the composer calls /jobs/build (first message) or
  /jobs/build/{id}/edit (every follow-up). buildId persists in the URL (?build=<id>) so a refresh
  can rehydrate chat text history from /turns. Introduces the two-column .studio-grid layout
  deferred from R-475: a workspace panel (build/edit result, entities, usage, file browser) plus a
  persistent chat rail. New finding verified by direct source read before implementation: GET
  /turns does not 404 for an unknown build (turns_view returns {"turns": []} for a missing session
  entry) - only the edit endpoint's BuildNotFoundError is a real, reachable 404, so that is where
  the "session no longer available" recovery is wired, not turns-hydration.
