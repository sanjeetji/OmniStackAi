branch: ai/R-541-admin-app-and-archetypes
objective: >-
  One prompt must deliver every app the user asked for. Today it does not: `nl_to_ir` already
  defaults `admin_strategy` to "nextjs", so every prompt-built IR asks for an admin panel, but
  `_plan_assembly` records it as "admin_strategy 'nextjs' is not assembled yet" and drops it —
  `GenerationTarget.NEXTJS_ADMIN` is declared with no adapter behind it. The public home page is
  also the wrong shape: `_overview_page` renders an entity dashboard for every project, so
  "a website to sell my product" returns an internal console rather than a storefront.
  Build the admin adapter, give the public app a public-facing home, and emit the multi-app
  manifest so the preview actually runs web + admin + api together.
