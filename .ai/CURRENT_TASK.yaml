objective: >-
  Generated Go is not gofmt-clean. `gofmt -l` names four files in a generated backend: struct fields
  in `internal/models/models.go` are emitted with single spaces where gofmt aligns names, types and
  tags into columns (18 lines), and three more files carry a stray blank line — one doubled between
  functions and two at end of file (1 line each). 21 changed lines in all.
  Nothing is broken: the backend compiles and vets clean. The cost is the first impression. Go
  developers treat gofmt as the format, and an editor set to format on save rewrites a file they
  never touched the moment they open the repository.
