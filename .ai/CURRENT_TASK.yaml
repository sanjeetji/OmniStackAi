acceptance:
  - The adapter satisfies ModelProvider identity, health, discovery, generation, and streaming using Ollama's native local API.
  - Configuration accepts only the Stage 0 loopback endpoint and never follows redirects.
  - Requests have explicit timeouts, bounded response sizes, bounded concurrency, cancellation propagation, and stable platform-owned errors without leaking response bodies.
  - Discovery is deterministic and capability claims remain conservative unless an exact configured model profile proves them.
  - Generation and NDJSON streaming map messages, finish reasons, usage, request IDs, and sequence/final events into vendor-neutral records.
  - Standard-library tests cover success, malformed data, HTTP failure, timeout, size limit, endpoint validation, concurrency, cancellation, and stream termination.
  - An explicit live verifier proves health, discovery, one generation, and one stream against local Ollama; static task verify stays network-independent.
  - No SDK dependency, cloud call, router, service process, database change, Compose change, or infrastructure is introduced.
required_gates:
  - impact_analysis
  - python_compile_test
  - ollama_adapter_conformance_tests
  - malformed_and_failure_path_tests
  - timeout_size_concurrency_and_cancellation_tests
  - live_loopback_ollama_verification
  - vendor_import_exclusion
