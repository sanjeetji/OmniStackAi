schema_version: 1
task_id: R-008
title: Cloud API-key ModelProvider adapters (multi-provider, key-activated) behind the shared boundary
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-008-cloud-provider-adapters
goal: >-
  Add key-activated cloud ModelProvider adapters for multiple providers (Anthropic, OpenAI, Google
  Gemini, OpenRouter, Groq) behind the existing vendor-neutral boundary, each with a sensible default
  model that the operator can override. A provider is registered only when its API key is present in
  the environment, so with no keys the platform keeps running on local Ollama and makes zero cloud
  calls. An env-driven bootstrap wires local Ollama plus any key-present cloud providers into the
  Balanced gateway so L3/L4 work can escalate to the selected cloud tier once a key is supplied.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed because R-008 is absent from the supplied workbook
  brief_sections: [18, 18.1, 18.3, 25, 26, 27, 74, 75, 77, 84, 85, 87, 90, 91, 92]
  founder_intent: >-
    Founder asked to configure each cloud provider (not just one) so that adding any provider's API
    key makes that LLM work with a default model that the user can change, while the platform keeps
    running on local Ollama with qwen when no keys are set. No keys are configured yet.
