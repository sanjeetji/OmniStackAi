objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Password Strength Meter &
  Requirements compound component suite (components/password-strength.tsx): a controlled + uncontrolled
  password input with a live strength evaluation (rule-based scoring producing empty/weak/fair/good/strong
  levels), a segmented strength bar, a live requirements checklist (default rules: min length, uppercase,
  lowercase, number, symbol; overridable), a show/hide password toggle (aria-pressed), an SSR-safe design
  (deterministic first paint; matchMedia read only after mount), a JS prefers-reduced-motion guard for the
  bar transition, WAI-ARIA semantics (role="status" + aria-live strength announcement, aria-describedby
  wiring the input to the requirements + strength, useId for stable ids), onChange + onStrengthChange
  callbacks, 4 futuristic visual styling variants ("default", "card", "glass", "neon"), 3 size scales
  ("sm", "md", "lg"), React ref forwarding (forwardRef), useImperativeHandle (PasswordStrengthHandle:
  getValue/setValue/getStrength/clear/focus), and explicit displayName across compound and semantic alias
  exports (PasswordStrength, PasswordStrengthMeter, PasswordInput, PasswordField, default). Static module
  constant — never references ir.name/ir.description.
