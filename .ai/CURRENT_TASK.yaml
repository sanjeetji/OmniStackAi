schema_version: 1
task_id: R-282
title: Server-Side Boolean/Enum Field Filters on Top-Level LIST Endpoints (Go + FastAPI + OpenAPI)
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add real server-side per-field equality filtering to the generated backends: a top-level LIST endpoint
  now accepts ?<field>=<value> for each boolean field and each enum field (fields with an enum:a|b|c
  validation rule), composing them into the SQL WHERE alongside the existing q keyword search — with the
  same whitelist discipline as sorting (column identifiers come only from validated IR field names;
  filter VALUES are parameterized $N/%s). This is the backend capability that makes R-278's collection
  filters correct across pagination; wiring the frontend controls to it is a follow-up (R-283). Scoped to
  Op.LIST (top-level); the FK-scoped LIST_BY subcollection queries are unchanged. Founder said "continue
  for the next task" and chose the offline candidate; the available Groq key was kept for later.
tracker_ref: "R-282"
requirements:
  - A shared filter_fields(entity) helper (field_validation.py) returns (field, kind) for boolean and enum fields, excluding id; the single source of truth for the backend and OpenAPI.
  - Python repository (data_access._python_repository) for a filterable entity emits a _list_filters(q, <field>=None...) helper and list_/count_ signatures with the filter kwargs, building WHERE dynamically; non-filterable entities are byte-identical.
  - Go store (data_access._go_entity_store) for a filterable entity emits a <table>Filters(q, filters map[string]string) helper (bool -> v == "true", enum -> v) with correct $N numbering, and List/Count take a filters map; non-filterable entities are byte-identical.
  - FastAPI router LIST branch declares typed filter query params (bool -> bool|None, enum -> str|None) and forwards them; Go handler LIST branch calls parseFilters(r) (added to handlers.go only when a filterable entity exists) and threads the map into the store calls.
  - OpenAPI render_openapi documents each filter param on Op.LIST (boolean schema for bool; string+enum for enum).
  - No new IR field; no npm dependency; standard-library-only platform code; values always parameterized (never interpolated identifiers from the request); diff-invariant across ir.description.
acceptance_criteria:
  - filter_fields selects bool + enum, excludes id and plain fields.
  - Python list_item/count_item gain active/status kwargs + _list_filters; conditions parameterized; router declares active: bool|None / status: str|None and forwards.
  - Go itemFilters helper + List/Count filters map; bool coercion v == "true", enum v; parseFilters in handlers.go; handler passes filters.
  - OpenAPI /items GET documents active (boolean) and status (string enum new|used|sold).
  - Non-filterable project (rideshare-favourites) has no _list_filters / <table>Filters / parseFilters / filters map — byte-identical.
  - task verify passes (expect 780+ tests, new test_field_filters_backend.py); task lint + security:quick pass; both builder:demo pass.
