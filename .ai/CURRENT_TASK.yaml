schema_version: 1
task_id: R-244
title: Sub-collection route wiring (parent-scoped lists via the FK relation)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Clear the main class of remaining 501 stubs (Brief 9/27/34): wire the sub-collection GET pattern
  `GET /<parents>/{parentId}/<children>` to a parent-scoped list. The child entity (the endpoint's
  response_schema) must be a repository entity with exactly one foreign-key relation (many_to_one or
  one_to_one); the endpoint then lists that entity filtered by the relation's FK column = the path
  parameter. The data-access layer gains a filtered-list function per FK relation (Python
  list_<table>_by_<rel>, Go List<Entity>By<Rel>) using parameterized values; route wiring gains a
  LIST_BY operation; Python routers and Go handlers call it. Endpoints that do not match the pattern (no
  entity, not exactly one FK relation, multi-param) stay labelled 501 scaffolds. Deterministic and
  offline; nothing runs. Seed/fixture data is deferred (the IR carries no seed values to emit honestly).
