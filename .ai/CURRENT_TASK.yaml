schema_version: 1
task_id: R-277
title: Form Screen Dirty State Tracking, Unsaved Changes Guard & Reset Confirmation in Generated Next.js Forms
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Enhance generated Next.js form screens (apps/web/app/<screen>/page.tsx) with deterministic dirty
  state tracking (isDirty), an amber "Unsaved changes" visual indicator badge, confirmation-guarded
  Cancel and Reset actions, and a native browser beforeunload event listener protecting against
  accidental data loss.
tracker_ref: "R-277"
requirements:
  - Form screen imports useMemo from "react" (along with useState and useEffect).
  - Compute baselineData comparing against initialValues in create mode or initialData in edit mode.
  - Calculate isDirty indicating whether any editable field in formData differs from baselineData.
  - Render an amber "Unsaved changes" visual badge (#fef3c7 / #92400e) when isDirty && !success.
  - Cancel button guards against leaving with unsaved changes via confirm() dialog.
  - Reset button guards against resetting modified fields via confirm() dialog.
  - Register a native window beforeunload event listener while isDirty && !submitting && !success.
  - Post-submit success clears dirty state warnings so navigation links execute without prompts.
  - 100% offline, zero new external npm dependencies, zero new IR fields, strict diff invariance.
acceptance_criteria:
  - Form screen imports useMemo from "react".
  - isDirty is computed by comparing formData with baselineData.
  - "Unsaved changes" badge is rendered when isDirty && !success.
  - Cancel button binds confirmation guard when isDirty is true.
  - Reset button binds confirmation guard when isDirty is true.
  - beforeunload event listener is registered and cleaned up via useEffect.
  - Strict diff invariance: changing only ir.description produces byte-identical output.
  - task verify passes (expect 725+ tests passing, 0 failures).
  - task lint and task security:quick pass.
  - builder:demo passes for minimal-blog and rideshare-favourites.
