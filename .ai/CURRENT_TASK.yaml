schema_version: 1
task_id: R-240
title: Route wiring — generated handlers call the repository layer (real CRUD)
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Turn the generated backends' 501 stub handlers into working CRUD over the R-239 data-access layer
  (Brief 9/27/34/42), but only for the unambiguous endpoint shapes so the platform never emits
  plausible-but-wrong behavior. An endpoint's entity is taken from response_schema (else request_schema);
  the operation is inferred from method + path: GET collection -> list, GET /x/{id} (single param) ->
  get, POST with a request_schema (no param) -> create, DELETE /x/{id} -> delete; everything else stays
  a labelled 501 scaffold. Python routers import the repository/model and await the call (create takes a
  Pydantic body); Go handlers become methods on a Handlers struct holding *sql.DB, main opens
  store.Open(), and wired methods call the store. Emitted only when the IR has entities and
  database_strategy=postgres; non-DB backends keep the plain scaffolds unchanged. Deterministic and
  offline; nothing runs; the R-237 edit loop diffs the wiring when the IR changes.
