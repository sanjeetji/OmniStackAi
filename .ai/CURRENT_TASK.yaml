schema_version: 1
task_id: R-266
title: Update/Edit Mode in Generated Next.js Forms & Collection Screen Edit Actions
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Connect the generated Next.js frontend to the existing backend update handlers (PUT/PATCH)
  and typed React mutation hooks (useUpdate<Entity> and use<Entity>(id)), closing the complete
  full-stack CRUD editing cycle:
  - In form screens (_form_screen_page), support dual-mode (Create & Edit) when Op.UPDATE is wired.
  - Read edit ID from searchParams (?id=...), fetch existing item with use<Entity>(id), and prefill formData.
  - Submit using update(editId, formData) in edit mode vs create(formData) in create mode.
  - Dynamically adapt header, submit button, and success feedback.
  - In collection screens (_collection_screen_page), render an "Edit" action link in the master table
    pointing to the form screen with ?id=${item.id} when Op.UPDATE is wired and form screen exists.
  - In subcollection master-detail view, render "+ New <Child>" link with parent foreign key prepopulated.
  - Fallback safety for entities without Op.UPDATE (clean create-only form).
  - Maintain diff invariance across ir.description changes.
  - Additive, offline, 0 network, 0 external deps.
