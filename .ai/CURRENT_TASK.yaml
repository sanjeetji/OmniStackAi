must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the IR, model-gateway, runtime, verify, edit, auth public behavior (additive)
  - the existing LIST/GET/CREATE/DELETE wiring and the auth/role guards (only ADD LIST_BY)
  - endpoints that do not match the sub-collection pattern (they stay 501)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - connect to or query a database; execute a handler; make a network call
  - string-interpolate a query VALUE (the FK filter value is parameterized; the column is a fixed IR-derived identifier)
  - wire a sub-collection when the child has zero or more than one FK relation (ambiguous -> stay 501)
  - add a platform Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - wire_endpoint recognizes GET /<parents>/{parentId}/<children> as LIST_BY when the response entity is
    a repo entity with exactly one many_to_one/one_to_one relation; otherwise returns None (stays 501).
  - The data-access layer emits a filtered-list per FK relation: Python list_<table>_by_<rel>(<rel>_id)
    and Go List<Entity>By<Rel>(ctx, db, <rel>Id, limit), filtering WHERE <rel>_id = parameter.
  - Python routers call the filtered list and parse as valid Python; Go handlers call the store function;
    the value is always parameterized, the FK column is a fixed identifier.
  - Non-matching sub-collection endpoints (zero/multiple FK relations, unknown entity) stay 501; output
    is byte-stable; nothing runs.
  - Standard-library offline tests cover the LIST_BY mapping + its None cases, the filtered-list
    emission, and the Python/Go wiring.
