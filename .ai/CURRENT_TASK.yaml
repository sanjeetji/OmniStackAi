must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway, IR, codegen, and git-service public behavior (additive package)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install, run, or deploy anything in this task or in task verify (execution is an opt-in Tier-0 step)
  - add an external Python dependency; choose or call any paid cloud service; store secrets
    (keys are read from env only, never logged/stored/shown; .env.example holds placeholders only)
acceptance:
  - RuntimeProvider and DeploymentProvider are runtime-checkable contracts; a LocalRuntimeProvider
    (id "local") returns deterministic PreviewPlans (install + run Command + local URL) for the
    nextjs-web, backend-python, and backend-go targets, and raises a stable error for unsupported ones.
  - Cloud sandbox providers (e2b, daytona, fly-machines) and deploy providers (vercel, fly, render,
    netlify) are declared with a key env var; build_runtime_from_env / build_deploy_from_env register
    local always and mark each cloud provider active only when its key is present; selecting a cloud
    provider without its key raises a clear error; default runtime selection is local, default deploy
    is none.
  - No key is ever logged/stored/shown; .env.example gains placeholders (names only) and tier/selector
    docs; task verify stays green and network-independent.
  - Standard-library offline tests cover local plans per target, unsupported-target error, env
    registration with/without keys, unknown-selector errors, and the no-secret guarantee.
required_gates:
  - impact_analysis
  - local_preview_plan_tests
  - env_registration_and_selection_tests
  - no_secret_leak_test
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
