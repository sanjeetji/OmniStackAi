  - No change to the template multi-app runner (localrun/multiapp.py); templates keep their path
  - A project with no admin console keeps exactly today's single-app preview behaviour
  - No new runtime dependency; generated projects stay on the pinned Next.js stack
  - task verify stays offline with 0 model calls
