objective: >-
  Real, live streaming of build progress from the agent-engine through the Go control-plane,
  replacing the one-shot "Building..." blocking wait. Scoped as backend only (agent-engine SSE
  emission + Go relay, curl-verified); console UI consumption is R-485, a fast-follow, mirroring
  this session's proven backend-then-UI pattern. Streaming already exists at the model_gateway
  layer (ModelProvider.stream()) but nothing above it uses it. New additive streaming twins:
  generate_ir_stream() (nl_to_ir.py), build_app_from_prompt_stream() (build_app.py),
  _build_stream() (live_serve.py, plain-prompt-only, matching _edit()'s own scope precedent), new
  POST /api/build/stream SSE route (server.py). Go control-plane gets a new POST /jobs/build/stream
  route that relays SSE frames verbatim via http.Flusher, then appends a trailing "credits" event
  once the upstream "done" event's usage is known (credit debiting can't happen mid-stream).
