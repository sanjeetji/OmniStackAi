must_not_do:
  - install, run, build, or test any generated code in task verify (execution is opt-in)
  - add an external Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - verify_plan(target, app_dir) returns a VerifyPlan for each supported target (nextjs-web, nextjs-admin,
    backend-python, backend-go); an unknown target raises a clear UnsupportedVerifyTargetError.
  - A VerifyPlan is validated, ordered, and classifies each step by gate kind (install/typecheck/lint/
    test/build); plan.gates() reports the kinds present; every command is control-free and secret-free.
  - verify_plans_for_ir(ir) returns the verify plans for the IR's assembled apps, each bound to its
    monorepo directory (apps/web, services/api), consistent with the assembler.
  - run_verify(plan) executes a plan fail-fast and returns a VerifyReport (per-step status + return code);
    it is opt-in and never run by tests or task verify.
  - task agent-engine:verify-plan prints a target's plan; task verify stays green and network-independent.
  - Standard-library offline tests cover per-target plans, gate classification, unknown-target error,
    IR->plans mapping, and no-secret/plan validity.
