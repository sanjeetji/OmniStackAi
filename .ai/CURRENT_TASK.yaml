must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the R-005 records/registry, R-006 Ollama adapter, R-007 gateway routing decisions, or R-008 cloud adapter public behavior
  - local Compose services or infrastructure (Redis, NATS, object storage, Kubernetes, Temporal)
  - auth, organizations, billing, Git integration, audit, or business APIs
  - native mobile or device-cloud functionality
  - the Section 74 top-level monorepo contract; no new top-level directory
  - the network-independence of static task verify
must_not_do:
  - store prompt/message content, request payloads, responses text, or any secret in accounting records
  - add an external Python dependency or a provider SDK
  - change existing routing outcomes; accounting is observational and must not alter dispatch results
acceptance:
  - Usage records are immutable, validated, metadata-only (no message content or secret) and capture provider, model, tier, complexity, token usage, latency, finish reason, success, and error code.
  - A configurable price book computes estimated USD cost exactly with Decimal arithmetic; local Ollama is zero; unknown models are recorded as unpriced rather than guessed.
  - The gateway records exactly one accounting record per dispatch for both success and failure, without changing the returned result or the raised error, and only when a recorder is configured.
  - The ledger aggregates overall and per-provider/per-model totals, token sums, cost, success/failure counts, deterministic p50/p95 latency, unpriced-call count, and cost per successful call.
  - Recording is safe under concurrent dispatch and adds no network dependency.
  - Standard-library offline tests cover record validation, pricing (known, provider-default, unknown, cached-input, local-zero), ledger aggregation and percentiles, gateway success/failure recording, and the no-content privacy guarantee.
  - Static task verify stays network-independent and green; existing gateway/adapter behavior and tests are unchanged.
required_gates:
