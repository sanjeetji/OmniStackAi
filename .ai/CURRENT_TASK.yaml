forbidden_changes:
  - build_ecosystem keeps working as it does; this adds an assembler beside it, it does not replace it
  - assemble_project for a single IR is untouched
  - No new agent-engine runtime dependency
  - Deterministic output — the same plan assembles byte-identically twice
  - task verify stays offline with 0 model calls
required_gates:
  - A four-surface plan assembles into one project with four app directories and exactly one services/api
  - The backend's IR is the union of every surface's entities, roles and endpoints, so no surface calls a route that does not exist
  - Each surface app keeps its own entity scope, so a courier app does not ship the menu editor
  - A union entity takes the superset of its fields, so no surface loses a column
  - The customer-facing surface lands in apps/web and the admin dashboard in apps/admin, which the runner already treats specially
  - One brand.json, one database, one OpenAPI contract for the whole ecosystem
  - task verify passes offline with 0 model calls
