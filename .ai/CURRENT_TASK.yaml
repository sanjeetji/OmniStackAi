objective: >-
  A user who describes a food delivery app with customers, drivers and restaurants now receives
  four apps over one API — and no explanation. The build streams a line while it runs, then that
  scrolls away; the result carries `ecosystem_apps` and `ecosystem_reason`, and
  `app_build_result_to_dict` drops both, so they never leave the agent-engine at all. What is left
  on screen is four directories and no reason for them.
  Carry the decision through to the console and show it: which apps were built, and why there is
  more than one.
