objective: >-
  Smarter IR synthesis: the plan is checked against the prompt before anything is generated. A
  deterministic critique (no model call) lists what the prompt asks for and the plan lacks - things
  it names (book appointments, write reviews), features (uploads, search, a map, approvals,
  messages, a dashboard), roles, and entities with no pages or endpoints. When there are gaps, one
  revision pass asks the model for the complete plan with them added; the revision is kept only if it
  is valid and keeps everything the first plan had, else the first plan stands with a note.
