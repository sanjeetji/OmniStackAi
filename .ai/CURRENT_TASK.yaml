  - "ConfirmDialog is a proper modal overlay with ARIA role=dialog, aria-modal=true, aria-labelledby, aria-describedby, focus-trapped Confirm/Cancel buttons, and Escape key handler."
  - "All window.confirm() calls in generated collection screens (_collection_screen_page) are replaced with async confirmAsync() calls from useConfirm."
  - "All window.confirm() calls in generated detail screens (_detail_screen_page) are replaced with async confirmAsync() calls from useConfirm."
  - "All window.confirm() calls in generated form screens (_form_screen_page) are replaced with async confirmAsync() calls from useConfirm."
  - "Each screen that uses confirmAsync imports useConfirm from '../components/confirm-dialog' and renders <ConfirmDialog {...confirmProps} /> at the bottom of its JSX tree."
  - "components/confirm-dialog.tsx is registered as a GeneratedFile in NextjsWebAdapter.generate()."
  - "Diff invariance across ir.description is strictly preserved byte-for-byte."
  - "Stdlib-only, 100% offline codegen with zero external runtime npm dependencies."

