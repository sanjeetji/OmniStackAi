objective: >-
  Continue Phase D: R-473's build result panel lists filenames as inert text; this task makes that
  list clickable so a user can read the generated code, not just see it exists. The agent-engine's
  Studio server already has real, tested, path-safe read-only file access (studio/files.py, wired
  since R-467 as GET /api/build/{id}/files and GET /api/build/{id}/file?path=...) - this task
  bridges those two existing endpoints through the authenticated control-plane, the same "generic
  proxy, no new agent-engine code" shape R-472 established for the build endpoint itself. New
  control-plane routes GET /jobs/build/{id}/files and GET /jobs/build/{id}/file?path=... (auth
  required, no credit debit - browsing files is not a billable call), proxying verbatim. Console
  gains listBuildFiles/readBuildFile clients, two new proxy Route Handlers, and a clickable file
  list + read-only viewer in studio-form.tsx. No agent-engine changes. Known, honestly-documented
  limitation carried over unchanged from R-467: the Studio server has no per-user build scoping
  (single shared in-memory process) - not introduced or worsened by this task.
