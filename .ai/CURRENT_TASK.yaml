objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Slug / URL Input compound
  component suite (components/slug-input.tsx): a slugify() helper that converts arbitrary text into a
  URL-safe slug in real time (Unicode NFKD normalization to strip diacritics, lowercase, non-alphanumeric
  runs collapsed to a configurable separator, leading/trailing separators trimmed); auto-sync from an
  optional source prop (e.g. a title) until the user manually edits the slug; an optional prefix / base URL
  with a computed full URL; copy-to-clipboard (navigator.clipboard with copied feedback); controlled +
  uncontrolled value; maxLength; onChange (slug) and onCopy (fullUrl) callbacks; WAI-ARIA (labeled input,
  aria-label, aria-live copied announcement); 4 futuristic visual styling variants ("default", "card",
  "glass", "neon"); 3 size scales ("sm", "md", "lg"); React ref forwarding (forwardRef);
  useImperativeHandle (SlugInputHandle: getValue/getFullUrl/setValue/slugify/clear/focus); and explicit
  displayName across compound and semantic alias exports (SlugInput, Slugify, UrlSlugInput, PermalinkInput,
  default). Static module constant — never references ir.name/ir.description.
