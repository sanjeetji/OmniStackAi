objective: >-
  CareClinic part 4 of 4: Front Desk & Clinic Ops Console (apps/admin), Playwright 48 screenshots + cover,
  and publication to templates/catalog/care-clinic. Build control-room styled clinic operations console
  on Next.js 16 + React 19 + Turbopack + Tailwind CSS 4 across 18 routes: Staff Sign In (/login),
  Operations Dashboard (/), Front Desk Reception (/front-desk), Patient Check-In (/check-in),
  Walk-In Booking (/walk-in), Appointments Master (/appointments), Appointment Investigation (/appointments/[id]),
  Doctor Directory (/doctors), Doctor Rostering & Schedules (/doctors/[id]/schedule), Room Allocation (/rooms),
  Clinic Cashier & Billing (/billing), Invoice Details & Receipts (/billing/[id]), Cancellation & Refunds (/refunds),
  Diagnostic Lab Management (/labs), Clinical Analytics & Footfall (/reports), HIPAA Security & Audit (/audit),
  Clinic Settings (/settings), and Live OPD Waiting Room TV Display Board (/queue-display).
  Extend @careclinic/shared with admin SDK methods. Capture all 48 screens + cover image with Playwright.
  Publish template from templates/catalog/_care-clinic to templates/catalog/care-clinic.
