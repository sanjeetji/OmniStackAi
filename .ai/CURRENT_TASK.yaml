schema_version: 1
task_id: R-250
title: Richer field validation (max_length + enum) into the schema and FastAPI models
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the IR Field.validation tuple meaningful (Brief 9/26/27): define a small deterministic rule
  syntax (max_length:<int>, enum:<a>|<b>|<c>) and thread it into two generated targets. The PostgreSQL
  schema renders a STRING field with max_length as VARCHAR(n) (else TEXT) and an enum as a
  CHECK (<col> IN ('a','b')) constraint; the FastAPI Pydantic models render max_length via
  Field(max_length=n) and enum as a Literal[...] type. Unknown rules are ignored (forward-compatible).
  Go request-validation tags are deferred to a follow-up (the schema already constrains Go writes at the
  DB). Additive and offline; nothing connects to or runs a database; examples are unchanged so existing
  outputs stay stable (feature is exercised by constructed-IR tests).
