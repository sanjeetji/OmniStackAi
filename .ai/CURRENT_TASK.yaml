branch: ai/R-546-store-ready
objective: >-
  R-545 made the generated Expo app run on a phone. It cannot be built for the stores: there is no
  `eas.json`, so `eas build` has nothing to read; `app.json` sets a splash and adaptive-icon
  background colour but no icon or splash **image**, and Apple and Google both reject a submission
  without one; there is no `versionCode`/`buildNumber`, so a second upload to either store is
  refused; no permissions are declared; there is no iOS privacy manifest, which Apple has required
  since 2024; and the bundle identifier is `com.omnistackai.<slug>` — our domain on the user's app,
  which they cannot register.
  Generate everything a store build needs, so that the founder's only remaining work is buying the
  accounts and pasting credentials. No account, key or paid service is used by this task.
founder_gate: >-
  Founder approved React Native work on 2026-09-24 and asked specifically that publishing should
  need no further coding. This task does the code and configuration; R-547 is the credentials.
