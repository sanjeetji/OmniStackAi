schema_version: 1
task_id: R-222
title: First platform console slice (read-only model & cost overview)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-222-console-web
goal: >-
  Stand up the first slice of the visual platform console under apps/console-web, surfacing the model
  fabric from R-005..R-221: providers (local + all supported cloud, with tier / default model / active
  key-state), the Balanced routing ladder, the price book, and the usage/cost dashboard from the R-009
  accounting ledger. The console reads a deterministic, secrets-free JSON snapshot exported by the
  Python gateway and renders it with safe DOM APIs; it makes no external network calls and never shows
  a key.
scope_note: >-
  Founder asked for the best/advanced industry-standard approach (Next.js) and a smooth, secure
  platform. A full Next.js app was authored, but this sandbox's network repeatedly timed out fetching
  Next's native SWC binary, so it cannot be installed or built here and would break the offline
  task bootstrap. To deliver a working, verifiable, secure console now, this slice is dependency-free
  (static HTML/CSS/vanilla JS) with the identical data contract and design; the Next.js upgrade is the
  documented next step once the build environment can install the toolchain. The offline bootstrap
  contract is unchanged.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [8, 15.2, 40, 41, 74, 77, 87, 90, 91, 92]
project_profile:
  repository: platform_modular_monorepo
