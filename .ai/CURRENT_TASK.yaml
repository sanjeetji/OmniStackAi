objective: >-
  `localrun/plan.py` hard-codes exactly three apps: `apps/web`, `apps/admin` and `services/api`.
  Each was added by hand — R-542 for the console, R-545 for the mobile app — and every new surface
  needs another copy of the same block. That ceiling is now in the way: `plan_ecosystem_from_prompt`
  already plans four role-scoped surfaces for a food-delivery prompt (customer app, merchant
  portal, courier dispatch, super-admin), and none of them could be previewed because the runner
  only knows two names.
  Generalise it: discover every `apps/*` that has a package.json, run them all, and report them
  all. Keep `web` and `admin` special only where they genuinely are — the base path a proxy serves
  them under, and which one a bare preview URL redirects to.
founder_gate: >-
  Prerequisite for the founder's "single app to complete eco-system" requirement, restated on
  2026-09-24. R-554 assembles an ecosystem into one monorepo sharing one API and database;
  this makes such a project previewable at all.
