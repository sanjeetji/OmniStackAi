must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the IR schema (Field.validation already exists; this task only interprets it — no new IR field)
  - the model-gateway, runtime, verify, edit, data-access, auth, seed, index public behavior (additive)
  - example IRs / existing generated outputs (feature tested via constructed IRs to avoid churn)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - apply max_length to a non-string field or emit invalid Pydantic; fabricate a rule the IR didn't declare
  - connect to or run a database; make a network call
  - add a platform Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - parse_field_rules(field) parses max_length:<int> and enum:<a>|<b>|... from Field.validation; unknown
    rules are ignored; deterministic.
  - schema: a STRING field with max_length -> VARCHAR(n) (else TEXT); an enum -> CHECK (<col> IN ('...'))
    appended after NOT NULL/UNIQUE; enum values single-quote-escaped; the id PK is unaffected.
  - Pydantic models: max_length (STRING/TEXT) -> Field(max_length=n) (Field(default=None, max_length=n)
    when optional); enum -> Literal["a","b"] type; imports added only when used; models parse as valid
    Python.
  - No change when a field declares no rules; example IR outputs are unchanged; nothing runs.
  - Standard-library offline tests cover the parser, schema VARCHAR/CHECK, Pydantic Field/Literal, the
    no-rules pass-through, and that examples are unaffected.
required_gates:
