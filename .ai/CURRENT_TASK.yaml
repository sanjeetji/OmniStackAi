objective: >-
  Fifth task of the approved 7-task Phase D roadmap. An iframe rendering the real running
  generated app, wired to R-478's four routes. Preview start is synchronous (confirmed live during
  R-478), so polling's job is crash detection (5s interval while status is "ready"), not
  progress-watching. New studio-preview.tsx effect triggers POST /jobs/build/{id}/preview whenever
  buildId changes or a previewVersion counter (bumped by studio-chat.tsx after every successful
  edit, since _edit() never restarts the preview on its own) changes. Verified response shapes
  (idle/stopped/error/unavailable/ready) read directly from preview.py before implementation. A 404
  from either preview route renders an honest disabled message instead of a broken iframe. Manual
  Restart/Stop controls wired to the real R-478 routes, reusing the RefreshIcon/StopIcon that
  existed unused since R-475.
