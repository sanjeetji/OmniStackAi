acceptance:
  - NextjsWebAdapter generates components/navbar.tsx in apps/web.
  - app/layout.tsx imports and renders <Navbar /> above {children}.
  - components/navbar.tsx has "use client"; at the top and imports usePathname from "next/navigation".
  - Header renders brand name (ir.name) and logo badge linking to /.
  - Header renders "Overview" navigation link pointing to /.
  - Header renders navigation links for all collection and form screens with correct href (/{screen.id}).
  - Detail screens (ScreenType.DETAIL) are excluded from horizontal top nav to keep navigation focused.
  - Active navigation link is visually distinguished based on pathname.
  - Non-default screen roles render a badge adjacent to the screen link.
  - Renders a + {Entity} or + Create button linking to the first create form screen when available.
  - Clean fallback when ir.screens is empty.
  - Strict diff invariance across ir.description modifications.
  - Stage 0 verification (task verify), task lint, task security:quick, task doctor, and builder demos pass.
