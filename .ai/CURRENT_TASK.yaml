schema_version: 1
task_id: R-268
title: Subcollection Child Item Deletion & Mutation Feedback in Master-Detail Views
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add child item deletion and mutation feedback to master-detail views in generated Next.js screens:
  - In subcollection master-detail panels (_collection_screen_page and _detail_screen_page), detect when
    the child entity supports Op.DELETE (via wire_endpoint or DELETE endpoint matching).
  - Automatically import and wire useDelete<Child> from ../lib/hooks for each deletable subcollection.
  - Render an accessible, styled Delete button on each child card with confirmation prompt
    (confirm("Are you sure you want to delete this <Child>?")), loading/disabled state, and stopPropagation.
  - Automatically trigger child subcollection refetch (<subcol>.refetch()) upon successful deletion.
  - Display deletion mutation error feedback ({delete<Child>Error && ...}) if a delete request fails.
  - Clean fallback safety: subcollections whose child entity lacks Op.DELETE omit delete hooks and buttons.
  - Preserve byte-for-byte diff invariance across ir.description modifications.
  - Fully offline, 0 network, 0 external dependencies.
