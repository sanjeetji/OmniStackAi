objective: >-
  Phase A of R_&_D/OmniStackAI_Commercial_Platform_Kickoff_v1.md (founder-approved commercial
  platform kickoff, 2026-09-17): give the existing services/control-plane Go skeleton
  (health-check-only before this task) real users, authentication, and a plan/credit model. Two
  roles only (super_admin, user); a user's access is gated entirely by plan (free/developer/pro/
  agency/enterprise, byok as an add-on flag - reusing the tier names already named in the
  Implementation Brief Section 22), never a second role tier. Every signup gets the free plan and
  a starting credit grant (env-configurable, default 100) recorded in an append-only
  credit_ledger. New migration 000002_users_auth_billing (users, credit_ledger, sessions) plus a
  small embedded migration runner (migrations package, go:embed *.up.sql) that replays every
  migration file, in order, inside a Go-managed transaction on every control-plane boot - safe
  because every migration is written idempotently (IF NOT EXISTS / ON CONFLICT DO NOTHING), and
  necessary because docker-entrypoint-initdb.d only runs against a brand-new empty Postgres
  volume, never an existing one. Password hashing is PBKDF2-HMAC-SHA256 implemented directly on
  crypto/hmac+crypto/sha256+crypto/subtle - zero new go.mod dependency, matching this repo's
  minimal-dependency convention (verified in scripts/test.sh: go.mod's direct-dependency count
  stays exactly 1, pgx). Session tokens are opaque crypto/rand bearer tokens; only their SHA-256
  hash is ever persisted. Four new HTTP endpoints (POST /auth/register, /auth/login, /auth/logout,
  GET /auth/me) mounted alongside the existing health routes via a shared http.ServeMux
  (health.NewHandler became health.Register so main.go can combine both route groups). Login
  failure is a generic 401 regardless of wrong-password vs. unknown-email, including a same-cost
  dummy-hash Verify call on the "not found" path so there is no timing side channel for
  enumerating registered emails - proven both in the fake-store unit tests and against the real
  running container. No frontend, no agent-engine bridge, no payment processor, no team/org model
  - all named as separate later Tracker IDs (Phases B/C/D/E) in the kickoff doc, not attempted
  here.
