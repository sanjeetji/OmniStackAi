forbidden_changes:
  - A surface the prompt called an app is never assembled as a website
  - One shared API and one database; the apps do not each get a backend
  - The decision is deterministic — the same prompt gives the same surfaces twice
  - Existing single-app builds with one apps/mobile keep working unchanged
  - task verify stays offline with 0 model calls
required_gates:
  - "\"customer + driver apps\" produces React Native apps for those roles, not web pages"
  - An admin panel or a marketing site stays a web app
  - The monorepo carries more than one mobile app, each buildable
  - The preview offers a QR for each mobile app rather than assuming one
  - The reason each surface is an app or a site is recorded, not implicit
  - task verify passes offline with 0 model calls
