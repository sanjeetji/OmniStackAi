objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Masked / Pattern Input compound
  component suite (components/masked-input.tsx): token-based input masking (9=digit, A=letter, *=alphanumeric,
  other chars = literals) applied in real time as the user types, with built-in presets
  (phone/date/card/time/ssn) and custom masks; an applyMask() that produces both the formatted display value
  and the raw (unmasked) value plus a completeness flag; caret kept at the end of input after reformatting
  (requestAnimationFrame + setSelectionRange); controlled + uncontrolled value; onChange (formatted, raw)
  and onComplete callbacks; inputMode pass-through for mobile keyboards; WAI-ARIA (aria-label, aria-required
  when required); 4 futuristic visual styling variants ("default", "card", "glass", "neon"); 3 size scales
  ("sm", "md", "lg"); React ref forwarding (forwardRef); useImperativeHandle (MaskedInputHandle:
  getValue/getRawValue/setValue/clear/focus); and explicit displayName across compound and semantic alias
  exports (MaskedInput, InputMask, PatternInput, FormattedInput, default). Static module constant — never
  references ir.name/ir.description.
