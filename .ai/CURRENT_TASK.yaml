must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the R-005 records/registry, R-006 Ollama adapter, R-008 cloud adapters, R-009 accounting, or R-220 streaming public behavior
  - the existing single-provider routing outcome when no fallback chain is configured
  - local Compose services or infrastructure
  - auth, organizations, billing, Git integration, audit, or business APIs
  - native mobile or device-cloud functionality
  - the Section 74 top-level monorepo contract; no new top-level directory
  - the network-independence of static task verify
must_not_do:
  - fall back outside the explicitly configured allowlist chain (never silent)
  - fall back on non-retriable errors (budget, unknown model, unsupported request)
  - make any real cloud API call; add an external dependency or provider SDK; store secrets
acceptance:
  - RoutingPolicy accepts an optional ordered fallback chain of model descriptors; with none configured the gateway behaves exactly as before (single provider).
  - On a retriable failure the gateway advances to the next allowlisted candidate that is registered and whose circuit is closed; a non-retriable error is raised immediately without fallback.
  - A per-provider circuit breaker opens after a configurable consecutive-failure threshold, skips the provider until a cooldown elapses, then half-opens; success resets it. The breaker uses an injectable clock and is thread-safe.
  - When every candidate is unavailable, skipped, or failing, the gateway raises a stable AllProvidersFailedError; it never downgrades high-risk work or leaves the chain.
  - Each dispatch attempt (success or failure) is recorded by the accounting ledger when a recorder is configured.
  - Standard-library offline tests cover fallback success, non-retriable no-fallback, circuit open/skip/recover, all-failed, ordering, and accounting of attempts, with zero network access.
  - Static task verify stays network-independent and green.
