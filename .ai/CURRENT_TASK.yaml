schema_version: 1
task_id: R-233
title: Runtime & deployment provider layer (Tier 0/1 local now; Tier 2/3 add-keys)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Wire the preview/deploy system behind platform-owned provider contracts (Brief 51 SandboxProvider,
  75 RuntimeProvider/DeploymentProvider) so it works locally now (Tier 0/1, no keys) and cloud
  providers plug in by adding a key (Tier 2/3). Add a LocalRuntimeProvider that produces deterministic
  preview plans per target (Next.js/FastAPI/Go: install + run command + local URL), an env-driven
  registry that registers local always and each key-present cloud sandbox/deploy provider, and env
  placeholders + docs. Deterministic and offline: plans are constructed and asserted; nothing is
  installed, run, or deployed here (execution is an opt-in Tier-0 step on a network machine).
