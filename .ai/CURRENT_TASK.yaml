schema_version: 1
task_id: R-264
title: Field-Level Validation & Error Feedback in Generated Next.js Forms
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Enhance generated Next.js form screens (apps/web/app/<screen.id>/page.tsx) and API client
  (apps/web/lib/api.ts) with real-time and server-side field-level validation feedback:
  - Add extractFieldErrors helper in lib/api.ts normalizing Go backend {"errors": [...]}
    and FastAPI {"detail": [...]} payloads to a Record<string, string> map.
  - Track fieldErrors state in generated form screens, binding server and client validation
    errors to individual input elements.
  - Render accessible field error messages and red borders (#ef4444) on invalid inputs with
    aria-invalid attributes.
  - Automatically clear field errors when the user edits the input.
  - Perform client-side pre-validation for required fields and min/max constraints.
  - Additive, offline, 0 network, 0 external deps.
