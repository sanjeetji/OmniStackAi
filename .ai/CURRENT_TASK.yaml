objective: >-
  Named, independent follow-up from the Phase D roadmap. A real, live Model Provider settings page.
  platform_overview() already exists (real, tested, metadata-only) but is only ever used to
  generate a static build-time JSON snapshot for the public /fabric page - no live HTTP endpoint
  exists anywhere. New: resolve_generation_provider_from_env() always succeeds (falls through to
  Ollama, never raises) and its returned ModelProvider has a real .provider_id - calling it safely
  reports which provider would actually run the next build right now. New agent-engine
  GET /api/providers (build-only mode included, no toolchain needed), new control-plane
  GET /jobs/providers (no debit), new authenticated console /settings page reusing /fabric's
  existing table visual language but live-polled instead of a static snapshot.
