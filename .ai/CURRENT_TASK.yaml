objective: >-
  Second brick of the founder-approved hybrid engine, driven by the R-465/R-466 live runs: (1) rate-limit-aware
  pacing in the model gateway - a typed ProviderRateLimitedError carrying the HTTP status and a parsed
  Retry-After (header seconds/HTTP-date, else the provider body's "try again in Ns"), and a bounded,
  injectable-sleep retry of the same request inside the cloud provider's generate(), with the cap and retry
  budget env-tunable (OMNISTACKAI_MAX_RETRY_AFTER_SECONDS / OMNISTACKAI_RATE_LIMIT_RETRIES) and every wait
  logged; (2) compile-level repair - a capturing tsc executor (verify/compile.py: `tsc --noEmit --pretty false`
  parsed into per-file CompileErrors) and codegen/hybrid_repair.py, which feeds each LLM-written file's
  compiler errors back through R-465's _repair_message channel (bounded rounds, validator-gated, template
  fallback per file, UiSynthesisOutcome records), never rewrites deterministic files, and applies the result via
  a hand-built ProjectDiff + edit/apply_diff with one customer-identity commit; wired into the opt-in
  `task agent-engine:ui:synthesize` CLI as Step 3/3; (3) shrink-and-retry when a provider rejects a request as
  too large (413, or a 400 that says so): drop the echoed output, then switch to a compact grounding (every hook
  signature, one export per component) that fits an 8k-token tier; (4) outcome records carry the HTTP status of
  a failed call (ProviderHTTPError(413)), never the body. task verify stays model-, network- and toolchain-free.
