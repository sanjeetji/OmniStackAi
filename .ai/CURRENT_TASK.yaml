branch: ai/R-539-careclinic-doctor-api
objective: >-
  Rebuild the CareClinic doctor workstation (apps/doctor) against the real API, the way R-538 did
  the clinic console: every screen reads live clinic data, the consultation writes real SOAP notes,
  prescriptions and lab orders, and diagnosis coding searches a real ICD-10 catalogue instead of a
  list inside the app. Then give the platform itself the two operational commands it lacked —
  `omnistack.sh fresh` (wipe local data and create the first owner) and `omnistack.sh admin`
  (administer accounts) — and document every command in COMMANDS.md.
allowed_paths:
  - templates/catalog/care-clinic/
  - services/control-plane/cmd/platformctl/
  - scripts/omnistack.sh
  - scripts/test.sh
  - services/agent-engine/tests/test_template_care_clinic.py
  - COMMANDS.md
  - README.md
  - docs/
