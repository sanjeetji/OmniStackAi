must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the ModelProvider/gateway, IR, runtime, verify, edit, data-access, route-wiring public behavior (additive)
  - the route-wiring guard placement from R-241 (auth=true routes stay guarded; public routes untouched)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - fabricate or hard-code a JWT secret/default — the secret is read from JWT_SECRET (env), empty in .env.example
  - sign or verify a token at generation time; execute a handler; make a network call
  - add a platform Python dependency or import a vendor SDK in the platform code (the JWT dep is in the
    GENERATED project only)
acceptance:
  - The generated Python guard imports PyJWT, reads JWT_SECRET from env, verifies the token with HS256,
    401s on missing/invalid, 500s when the secret is unset; requirements.txt gains PyJWT and .env.example
    gains an empty JWT_SECRET. app/auth.py parses as valid Python.
  - The generated Go guard imports github.com/golang-jwt/jwt/v5, reads JWT_SECRET, parses+verifies the
    token (HMAC only), 401s on invalid; go.mod gains the golang-jwt require and .env.example gains JWT_SECRET.
  - No fabricated secret anywhere; the secret only ever comes from the env. The IR roles constant is
    retained. Emitted only when the IR has an auth=true endpoint; output is byte-stable; nothing runs.
  - Standard-library offline tests cover the JWT verification code + dependency/env additions, the
    no-fabricated-secret property, and that all-public IRs still emit no auth artifacts.
