branch: ai/R-559-substitute-and-explain
objective: >-
  The CareClinic seed generator calls itself deterministic and is not. Every date came from the
  current clock, so the committed seed stopped matching a fresh run the moment the date rolled over:
  the same test passed on 2026-09-24 and failed on 2026-09-25 with no code change in between,
  confirmed on a clean checkout. `task verify` therefore fails every day, which makes every later
  task's evidence unreliable. The generator also mixed UTC `toISOString()` with local `getDay()`, so
  its output depended on the timezone it ran in as well.
  Anchor every date to a fixed Monday so the file is byte-identical everywhere, and move the whole
  demo onto the current date when the seed loads so the clinic still looks live.
founder_gate: >-
  Founder on 2026-09-25: fix R-586 first, then continue with R-560.
allowed_paths:
  - templates/catalog/care-clinic/
