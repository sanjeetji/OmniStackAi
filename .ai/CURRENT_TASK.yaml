branch: ai/R-555-ecosystem-from-prompt
objective: >-
  R-554 assembles a planned ecosystem into one monorepo over one API and one database, and nothing
  calls it: `build_app_from_prompt` still produces a single app. Wire it, and answer the question
  that wiring forces — when should a prompt build four apps rather than one?
  The planner is keyword-driven and confident: "a simple blog" plans three surfaces and
  "a todo list app" plans two, so always building the `complete` option would hand someone four
  directories they never asked for. The signal that actually distinguishes the two cases is
  whether the prompt **names more than one kind of person**. "with customers, drivers and
  restaurants" does; "a simple blog" does not. That is the rule, and it is deterministic.
founder_gate: >-
  Founder's recurring requirement "single app to complete eco-system", and on 2026-09-24 they left
  the choice of trigger to me. Recorded here so the decision is reviewable rather than implicit:
  a prompt builds an ecosystem only when it names a second kind of user.
