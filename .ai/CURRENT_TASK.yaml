objective: >-
  Implement F-08 Logs and chat controls (spec R_&_D/specs/F-08-logs-chat.md).
  Structured workspace build logs (<workspace>/logs/build.jsonl) and app output logs (<workspace>/logs/app.log).
  Secrets scrubbing (***) and log rotation (OMNISTACKAI_LOG_MAX_BYTES default 5MB, 3 files).
  REST and SSE endpoints for workspace logs (GET/DELETE /projects/{id}/logs, GET /projects/{id}/logs/stream).
  Real build cancellation: Stop button in chat composer triggers AbortController and POST /projects/{id}/build/cancel.
  Cancellation flag checks during generation loop, clean exit, nothing committed, partial token debiting in model_calls (error_code = 'cancelled').
  Voice input via Web Speech API (SpeechRecognition) with idle/listening/transcribing states.
  Attachments support (text-like files up to 256KB max 4, fenced prompt inclusion, vision detection for images).
  Lovable-grade Manage -> Logs UI (Build/App switch, level filter, search, follow toggle, copy, download).
