objective: >-
  An ecosystem project cannot be edited after it is built. `live_serve.py:159` leaves ecosystem and
  pack builds with `editable_ir = None`, so no IR is written to the workspace and a follow-up edit
  answers "workspace has no IR; build first" — on a project the user just built, and on the one
  capability that most distinguishes this platform.
  Underneath it, `plan_edit` assembles both sides with `assemble_project`, which lays out a single
  app. Pointed at an ecosystem repo it would diff a five-app monorepo against a one-app layout and
  delete every surface app.
  Rescoped on 2026-09-25: the original premise was wrong. The console is already on the disk-backed
  workspace store — its edit path is `/projects/{id}/edit` -> `/api/workspaces/{id}/edit`, `ir.json`
  is written on every build, and a fresh store instance loads it back. Verified before rewriting
  this record. The in-memory LRU serves only the standalone Studio's build-id path.
founder_gate: >-
  Founder on 2026-09-25: decide the propagation rule first, then implement it.
decision: >-
  How an edit reaches scoped surfaces. Surfaces are scoped from a curated per-domain table, and
  `_relation_closure` follows relations outward from a surface's entities — so an entity added by
  an edit, which points *at* an existing entity rather than being pointed at, currently reaches no
  surface at all. The rule: a new entity reaches every surface that already holds an entity it
  points at; if it points at nothing any surface holds it stands alone and reaches every surface.
  Curated scoping still governs what it already knows, so the courier still gets no menu editor.
  The "reaches everything" fallback is not invented here — it is the rule this module already
  states for ambiguity ("Ambiguous intent is not permission to fabricate a partition"), and
  showing an entity too widely is recoverable where hiding it everywhere means the edit silently
  did nothing. Every edit reports which apps it changed.
