schema_version: 1
task_id: R-292
title: Loading Skeletons for Generated Next.js Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Replace the plain "Loading..." text in the generated screens' data-loading states with
  layout-preserving skeleton placeholders (gray rounded bars), so a loading screen shows the shape of
  content instead of a single centered line — a perceived-performance UX improvement. Scope: the
  collection table loading state, the subcollection (master-detail) list loading state (both render
  sites), and the detail-screen main loading state. Static inline-styled skeletons — no CSS keyframes, no
  new component/file, no dependency. Deterministic and description-only-stable.
tracker_ref: "R-292"
requirements:
  - Collection table loading cell renders a stack of ~5 skeleton bars instead of "Loading <plural>...".
  - Subcollection list loading renders ~3 skeleton item blocks instead of "Loading <child plural>..." (both the collection master-detail and detail render sites).
  - Detail-screen main loading renders ~4 skeleton field lines instead of "Loading <name>...".
  - Skeletons are inline-styled gray rounded divs; no @keyframes, no new file, no npm/platform dependency.
  - Refresh-button "Loading..." labels and other non-data-loading text are unchanged.
  - No hook/API-client/backend/IR change; deterministic; description-only IR stability preserved.
acceptance_criteria:
  - The collection loading state no longer emits "Loading <plural>... " text and instead maps skeleton bars.
  - The subcollection loading state (both sites) no longer emits "Loading <child>..." and instead maps skeleton blocks.
  - The detail main loading state no longer emits "Loading <name>..." and instead maps skeleton lines.
  - Description-only IR changes remain byte-identical; both example projects still generate.
  - Focused tests, related screen tests, full offline verification, lint, security, env check, and both builder demos pass.
