forbidden_changes:
  - No silent behaviour: every substitution carries a reason that reaches the user
  - The IR keeps recording what the user asked for; substitution never rewrites the request
  - Support is read from the adapter registry, never from a hardcoded list of unsupported stacks
  - One decision function; the assembler and the build result must not compute it separately
  - Generated copy is rendered as text in the console, never as HTML
  - task verify stays offline with 0 model calls
required_gates:
  - flutter, native and auto mobile requests assemble a real React Native app
  - Unsupported web strategies assemble a real Next.js app
  - Each substitution states what was asked, what was built and why, in plain words
  - The reason reaches AppBuildResult and the console, not only the generated README
  - Registering an adapter for a substituted target stops the substitution with no other change
  - nl_to_ir no longer offers the model a target that has no adapter
  - A supported stack produces no substitution and no note
  - task verify passes offline with 0 model calls
