next_action: >-
  R-478 is complete (see .ai/tasks/R-478.md for full Gates & Evidence). Next up per the approved
  plan (/Users/sanjeet_kumar/.claude/plans/hi-fancy-shannon.md): R-479 - Console: live preview UI.
  An iframe rendering the running generated app, wired to R-478's four routes. Preview start
  (replace()/restart()) is synchronous - there is no server-side "starting" state to poll for, so
  polling's real job is crash detection (5s interval while status is "ready", calling GET
  /jobs/preview), not progress-watching. "Starting" in the UI is just the pending state of the
  POST /jobs/build/{id}/preview call itself, using R-475's .spinner with real elapsed time (cold
  starts up to ~45s, confirmed live during R-478's own smoke test). Since _edit() never restarts
  the preview, trigger an automatic re-preview after every successful edit in the chat - confirm
  live whether HMR alone would have sufficed, but ship the safe automatic version regardless. A 404
  from GET /jobs/preview (build-only mode) renders a clear static message; the build-scoped 200-
  with-{"status":"error"} shape (verified live in R-478) renders the real message field.
