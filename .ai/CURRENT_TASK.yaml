title: Generated Collection Screen Boolean & Enum Visual Status Badges & Detail Screen One-Click Copy-to-Clipboard Affordances
phase: Phase 3 — Emergent Feature Parity
track: Web Frontend
module: apps/web (Next.js codegen)
status: DONE
owner: sanjeetji <sk698166@gmail.com>

requirements:
  - Collection table cells render styled visual status pill badges for boolean fields (emerald "Yes" badge if true, slate "No" badge if false).
  - Collection table cells render styled visual categorical badges for enum fields (blue pill badge with formatted text value).
  - Subcollection drawer/cards render styled badges for boolean and enum fields.
  - Detail screen renders an accessible one-click "Copy ID" button in the record header and definition list for ID / UUID fields.
  - Detail screen clipboard helper uses navigator.clipboard.writeText with graceful fallback and toasts success/error.
  - Backward-compatible, offline, deterministic (0 model calls), and diff-invariant across ir.description.

