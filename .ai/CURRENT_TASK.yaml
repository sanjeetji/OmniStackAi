schema_version: 1
task_id: R-248
title: Application IR fixtures + honest migrations/0002_seed.sql
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Close the seed-data gap honestly (Brief 26/27): the founder declares explicit seed rows in the
  Application IR (a new Fixture record: entity + rows of column->JSON value) and the platform emits a
  deterministic migrations/0002_seed.sql containing exactly those values — never inventing, defaulting,
  or guessing. Fixtures are validated (entity + columns must be declared; a required column missing from
  a row is a WARNING) and round-trip through to_dict/from_dict/normalize_ir. The seed emitter owns SQL
  literal quoting (single quotes doubled; bool->TRUE/FALSE; None->NULL; dict/list->jsonb). Both backends
  emit the file only when the IR has fixtures and database_strategy=postgres, next to 0001_init.sql.
  Pure/deterministic/offline; nothing connects to or runs a database.
