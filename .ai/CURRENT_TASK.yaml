objective: >-
  Add the user-facing "chat -> create an app" screen: a minimal, dependency-free local web studio (Python
  3.13 stdlib http.server only, no npm/pnpm) where a person types a plain-English description and watches a
  real app get generated. New omnistackai_agent_engine/studio/ package: page.py (self-contained HTML with a
  prompt textarea + Build button + results panel, inline CSS/JS, zero external deps), server.py
  (create_studio_server(build_fn, host, port) ThreadingHTTPServer: GET / serves the page, POST /api/build
  reads {prompt}, calls the injected build_fn -> dict, returns JSON; 400 empty/invalid, 502 build failure -
  build_fn injected so task verify tests the HTTP layer against an in-memory stub, 0 model calls),
  live_serve.py (opt-in real local-Ollama build path on OMNISTACKAI_STUDIO_HOST/PORT, default
  127.0.0.1:4173). Add app_build_result_to_dict(result) to intake/build_app.py (pure JSON-safe shape).
  Wire task agent-engine:studio:serve (opt-in, live). Static page is diff-invariant.
