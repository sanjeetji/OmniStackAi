found_and_fixed:
  - >-
    A single `UPDATE appointments SET scheduled_date = scheduled_date + shift` fails to load:
    `uq_doctor_slot (doctor_id, scheduled_date, start_time)` is checked row by row, so a row that
    has already moved collides with one that has not. The table is now parked 100000 days ahead
    and brought back, which leaves the destination empty on both passes. Found only by loading the
    seed into a real PostgreSQL -- an earlier version of the block appeared to work because that
    day's whole-week shift happened to be exactly zero, so nothing moved at all.
  - >-
    A whole-week shift preserves weekdays but leaves `/api/admin/front-desk` and
    `/api/admin/queue-display` empty on six days in seven, because both filter on today's date. The
    shift is exact instead, and `doctor_availability.day_of_week` is rotated by the same offset so
    no appointment lands on a day its doctor is not rostered. Verified in PostgreSQL: the closed day
    moves with the data and holds zero appointments.
  - >-
    The generator mixed UTC `toISOString()` with local `getDay()`, so its output also depended on
    the timezone it ran in. Now UTC throughout.
