  - For PC-133 - the booking domain plans a clinic as Booking + Service, without doctors, appointments or reminders.
  - For PC-126 - free tiers were exhausted mid-run (429s), leaving half of one project's pages as templates.
  - For PC-130 - a judged visual score from the screenshots; today the report shows them for a person to judge.
