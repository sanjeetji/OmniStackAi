branch: ai/R-559-substitute-and-explain
objective: >-
  Asking for something we cannot build returns something else, silently. A prompt for a Flutter app,
  a native iOS/Android app, or a React-Native-for-Web site produces a Next.js website and an admin
  panel, with no error, no warning and nothing in the console saying why. Verified across all four
  mobile profiles: only `react_native` emits `apps/mobile`; `flutter`, `native` and `auto` drop it
  in silence. `nl_to_ir` actively instructs the model to choose `flutter`, which is a guaranteed
  silent drop.
  The information already exists and is thrown away: `_plan_assembly` computes a `skipped` list of
  reasons, and the only consumer is the generated README.
  Replace dropping with substituting: build the nearest supported target, record what was asked
  beside what was built, and say why in one plain sentence that reaches the user. Decide it from a
  capability registry derived from the registered adapters, so that registering a Flutter or native
  adapter later turns the substitution off by itself with no other code change.
founder_gate: >-
  Founder on 2026-09-25: Next.js is the one web stack and React Native the one mobile stack for now;
  a Flutter request should build in React Native and state the reason, and the platform must be able
  to adopt Flutter, React and native later without rework. Also: never hand back a website when an
  app was asked for.
