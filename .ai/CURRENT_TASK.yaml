objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Duration Input compound
  component suite (components/duration-input.tsx): segmented numeric inputs for a configurable set of units
  (days/hours/minutes/seconds via a UNIT_SECONDS table) that convert to and from a single total-seconds
  value (toSegments/fromSegments), with min/max clamping (normalizing segments on clamp), a human-readable
  formatDuration helper, controlled + uncontrolled value (number of seconds), onChange(totalSeconds)
  callback, and WAI-ARIA (group with aria-label, per-segment aria-label + inputMode="numeric"); 4 futuristic
  visual styling variants ("default", "card", "glass", "neon"); 3 size scales ("sm", "md", "lg"); React ref
  forwarding (forwardRef); useImperativeHandle (DurationInputHandle: getValue/setValue/getFormatted/clear/
  focus); and explicit displayName across compound and semantic alias exports (DurationInput, DurationField,
  TimeSpanInput, IntervalInput, default). Static module constant — never references ir.name/ir.description;
  ASCII-only source.
