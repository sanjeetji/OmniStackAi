schema_version: 1
task_id: R-007
title: Balanced Model Gateway router with deterministic-first escalation and no silent cloud fallback
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-007-balanced-model-gateway
goal: >-
  Add a deterministic, platform-owned Model Gateway router that resolves which registered
  ModelProvider handles a request under Balanced routing: reject L0 deterministic work from model
  dispatch, route sub-L3 work to the local Ollama provider, escalate L3/L4 to a cloud provider only
  when one is registered (none yet), enforce a conservative context/token budget, and never silently
  fall back to a cloud model when the local provider is unavailable.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed because R-007 through R-009 are absent from the supplied workbook
  brief_sections: [18, 18.1, 18.2, 18.3, 25, 26, 27, 74, 75, 77, 83, 84, 85, 91, 92]
  founder_intent: >-
    Founder wants both API-key cloud LLM providers and local Ollama, added one Tracker ID at a time.
    R-007 delivers the routing seam; the first cloud adapter is deferred to R-008 and requires an
    explicit founder decision on the specific paid provider before implementation.
project_profile:
  repository: platform_modular_monorepo
  service: python_agent_engine
  control_plane_database: postgresql
  model_routing: balanced
complexity: L2
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/model_gateway/gateway.py
  - services/agent-engine/src/omnistackai_agent_engine/model_gateway/errors.py
  - services/agent-engine/src/omnistackai_agent_engine/model_gateway/__init__.py
  - services/agent-engine/tests/test_gateway.py
