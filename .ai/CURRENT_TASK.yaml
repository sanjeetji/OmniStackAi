must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway, Application IR, codegen contract, and Next.js adapter public behavior (additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install, build, or run the generated backend; write generated files to disk in this task
  - add an external Python dependency to the platform; store secrets (generated .env.example holds placeholders)
acceptance:
  - PythonBackendAdapter implements FrameworkAdapter (target backend-python) and returns a
    GeneratedProject from an ApplicationIR forming a coherent FastAPI app (app/main.py, app/models.py,
    app/routers/*, app/config.py, requirements.txt, README, .gitignore, .env.example).
  - Entities become Pydantic models (field types mapped; non-required fields optional with defaults);
    IR APIs become FastAPI routes grouped into routers by first path segment, with path params typed as
    function arguments and a 501 not-implemented scaffold body; main includes each router and a health
    endpoint.
  - All paths are safe and deterministically ordered; generation is a pure function of the IR;
    standard-library only; nothing installed/built/run/written to disk.
  - Standard-library offline tests assert emitted paths and key contents for a representative IR,
    entity->model mapping, route grouping/params, and registry wiring.
  - task verify stays green and network-independent.
required_gates:
