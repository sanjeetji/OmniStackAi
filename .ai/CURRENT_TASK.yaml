completed_at: "2026-09-20"
objective: >-
  Implement F-05 Secrets (spec R_&_D/specs/F-05-secrets.md).
  Encrypted per-project configuration (e.g. payment keys, SMTP passwords, third-party API keys)
  stored in PostgreSQL using AES-256-GCM (Go standard library crypto/aes + crypto/cipher).
  Master key OMNISTACKAI_SECRETS_KEY with key rotation via OMNISTACKAI_SECRETS_KEY_PREVIOUS.
  Secrets injected into preview process environment at runtime, never written into repository files,
  never committed to git, and never included in ZIP exports.
  Control-plane REST API (/projects/{id}/secrets, PUT, DELETE, POST /reveal/{key}, 503 when unconfigured).
  Console Web UI (Manage -> Secrets tab with masked values, 30s reveal timer, key validation, and preview restart alert).
allowed_paths:
