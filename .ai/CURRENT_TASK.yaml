objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Character & Word Counter
  Textarea compound component suite (components/character-counter.tsx): a textarea with live Unicode-safe
  character counting (Array.from code points) and word counting (trim + whitespace split), configurable
  maxLength / maxWords with a computed stats object ({characters, words, remaining, overLimit}), an
  optional hard limit that blocks input past maxLength, a warn threshold that recolors near the limit, an
  optional progress bar, controlled + uncontrolled value, onChange (value, stats) callback, and WAI-ARIA
  (labeled textarea, aria-describedby wiring to a role="status" aria-live counter region); 4 futuristic
  visual styling variants ("default", "card", "glass", "neon"); 3 size scales ("sm", "md", "lg"); React
  ref forwarding (forwardRef); useImperativeHandle (CharacterCounterHandle:
  getValue/setValue/getStats/clear/focus); and explicit displayName across compound and semantic alias
  exports (CharacterCounter, CharCounter, WordCounter, TextCounter, default). Static module constant —
  never references ir.name/ir.description.
