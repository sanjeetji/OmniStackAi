task_id: R-295
title: Consistent Error + Retry Affordance Across Every Generated Fetch State
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Bring every generated data-fetch error state to parity with the collection list, which already renders
  a "Retry" button that calls refetch(). Today the detail-screen main error state (`{error && ...}` in
  `_detail_screen_page`) and both subcollection (master-detail) error states (the collection master-detail
  block in `_collection_screen_page` and the detail block in `_detail_screen_page`, byte-identical) show
  only an "Error: ..." text banner with no recovery. Add a "Retry" button that calls the relevant refetch
  (the detail main `refetch()`; the subcollection `<s_var>.refetch()`), matching the collection error
  banner's flex layout and styling. This completes the error side to match the R-292/293 loading-skeleton
  completeness. Real runtime behavior; deterministic; description-only-stable.
tracker_ref: "R-295"
requirements:
  - Detail-screen main error banner renders a "Retry" button calling refetch(), in a flex row alongside the message span; the "Error loading <name>: <message>" text is preserved inside a span.
  - Both subcollection (master-detail) error banners (collection and detail render sites) render a "Retry" button calling `<s_var>.refetch()`, in a flex row alongside the message span; the "Error: <message>" text is preserved inside a span (the `<s_var>.error.message` expression stays present).
  - Retry buttons reuse the collection error banner's styling (dark-red `#991b1b` button, white text, small).
  - The collection top-level error banner (already has Retry) is unchanged; loading/empty/data-render states, delete-error toasts, and form errors are unchanged.
  - No hook/API-client/backend/IR change (refetch already exists on every affected hook); deterministic; description-only IR stability preserved.
acceptance_criteria:
  - The detail main error banner emits `onClick={() => refetch()}` and a "Retry" label.
  - Each subcollection error banner emits `onClick={() => <s_var>.refetch()}` and a "Retry" label, and still contains `<s_var>.error.message`.
  - The collection top-level error banner still emits exactly one Retry (unchanged).
  - Description-only IR changes remain byte-identical; both example projects still generate.
  - Focused tests, related detail/subcollection tests, full offline verification, lint, security, env check, and both builder demos pass.
