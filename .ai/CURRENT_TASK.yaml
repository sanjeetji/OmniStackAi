branch: ai/R-542-admin-console-reachable
objective: >-
  R-541 made every prompt assemble the admin console it had always been asking for, and the run
  plan starts it — but the Studio still shows a single preview app, so the console runs and lands
  in the user's repo while being unreachable in the product. Close that: a prompt-built project
  that has an admin console reports as a multi-app preview, so the console's existing
  MultiAppPreview switcher and proxy serve it with no console-web change. This follows the
  mechanism template previews already use: each Next app runs under its own BASE_PATH at
  /preview/<project>/<app>, and the generated next.config must honour it (today it does not, so
  the app would render at the wrong base and never load its assets).
