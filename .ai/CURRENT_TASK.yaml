  - the network-independence of static task verify
must_not_do:
  - make any network call; run or build generated code; add an external Python dependency; import a vendor SDK
  - write outside the caller-provided target directory; put a secret anywhere
acceptance:
  - diff_projects(old, new) returns a ProjectDiff classifying every path as added, modified (content or
    executable differs), deleted, or unchanged; identical projects diff to an empty change set.
  - plan_edit(old_ir, new_ir, registry=None) assembles both IRs and returns their ProjectDiff; a changed
    IR (e.g. a new description or entity) yields the expected modified/added files.
  - apply_diff(diff, target_dir) writes added/modified files and removes deleted ones inside a path-safe
    target (refuses escapes), returns an ApplyReport, and leaves the directory equal to the new project.
  - commit_edit applies a diff and records one commit as the given customer identity on the repo
    (reusing an additive git_service.commit_all); the previous history is preserved.
  - Standard-library offline tests cover diff classification, empty diff, plan_edit over a changed IR,
    apply round-trip (old -> new), path-safety refusal, and the commit_edit history.
required_gates:
