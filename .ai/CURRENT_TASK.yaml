  - Discovery is deterministic, so two runs of the same project produce the same plan
  - apps/web and apps/admin keep their existing ids, ports and base paths
  - apps/mobile is still handled as Expo and never proxied
  - A bare preview URL still redirects to the public web app
  - task verify passes offline with 0 model calls
