schema_version: 1
task_id: R-229
title: Python (FastAPI) backend framework adapter — generate a backend from the IR
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add the second framework adapter: a PythonBackendAdapter that turns an Application IR into a real
  FastAPI (Python) backend as a GeneratedProject — Pydantic models from entities, FastAPI routers from
  the IR APIs (grouped by resource), a main app with health, config, requirements.txt, README,
  .gitignore, .env.example. Paired with the Next.js web adapter, one IR now emits web + backend
  together (the multi-target differentiator). Deterministic and offline: emitted files are asserted in
  tests; nothing is installed, built, run, or written to disk. Registered via the AdapterRegistry.
