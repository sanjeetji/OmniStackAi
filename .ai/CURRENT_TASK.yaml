objective: >-
  Implement F-09 Database explorer & SQL editor (spec R_&_D/specs/F-09-database.md).
  Expose PostgreSQL tables and schema from the generated app's preview database.
  Agent-engine owns connection via project postgres container (psql --csv --pset=null=\N, zero new deps).
  Explorer queries strictly validated against information_schema.tables; injection attempts fail closed.
  SQL editor accepts arbitrary SQL, executed inside transaction rolled back unless Write mode enabled.
  Statement timeout (SET LOCAL statement_timeout = '10s'), max 500 rows limit with truncated flag.
  Forbidden statements refused (DROP DATABASE, CREATE/ALTER/DROP ROLE, COPY ... TO/FROM PROGRAM, etc.).
  Query logging via F-08 logger with duration and row count.
  REST endpoints: GET /projects/{id}/db/tables, GET /projects/{id}/db/tables/{table}, POST /projects/{id}/db/query, GET /projects/{id}/db/schema.
  409 Conflict with "Start the preview to create this project's database" when no database exists yet.
  Lovable-grade Manage -> Database UI (Explorer with table list, row counts, column badges, sortable grid, pagination, json viewer, NULL badges; SQL Editor with ⌘↵ shortcut, Write-mode toggle + warning, timing/count badges, verbatim Postgres error panel, results grid; 409 empty state with Start button).
