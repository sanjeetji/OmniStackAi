objective: >-
  Second task of the approved 7-task Phase D roadmap. New control-plane routes
  POST /jobs/build/{id}/edit and GET /jobs/build/{id}/turns, mirroring POST /jobs/build's exact
  proxy+debit shape (R-472). Also fixes two real, verified gaps in the Python edit path: _edit()
  has no usage_ledger at all today (confirmed by direct comparison with _build() - every edit
  currently debits 0 credits regardless of real cost), and _build() never records a chat turn
  (only _edit() does - a future chat hydrating history from /turns after a refresh would lose the
  first message). Both fixed by mirroring _build()'s own existing patterns. Go side extracts a
  shared proxyAndDebit helper out of handleBuild so handleBuildEdit reuses it, mirroring the
  writeAuthError extraction precedent R-474 set.
