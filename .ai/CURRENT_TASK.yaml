must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - provider adapters, including Ollama or any cloud provider
  - model routing, fallback, circuit breakers, budgets, or accounting behavior
  - agent orchestration, HTTP endpoints, or a deployable agent-engine process
  - local Compose services or infrastructure
  - Redis, NATS, object storage, Kubernetes, Temporal, or cloud resources
  - auth, organizations, billing, Git integration, audit, or business APIs
  - native mobile or device-cloud functionality
  - source documents other than the authorized execution tracker status and evidence
acceptance:
  - Provider, model, capability, request, response, usage, health, discovery, and stream records are immutable and validate invalid input.
  - A runtime-checkable ModelProvider protocol exposes provider identity, health, model discovery, generation, and streaming without a vendor SDK type.
  - The registry returns providers deterministically and rejects invalid, duplicate, and unknown providers with stable platform-owned errors.
  - Standard-library unit tests cover value invariants, protocol substitutability, registration order, duplicates, and unknown lookups.
  - Stable Taskfile commands compile and test the agent-engine contract in local and CI environments.
  - No adapter, routing policy, external Python dependency, service process, database change, or infrastructure is introduced.
required_gates:
  - impact_analysis
  - python_compile_test
  - model_provider_contract_tests
  - registry_determinism_tests
