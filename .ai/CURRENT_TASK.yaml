schema_version: 1
task_id: R-284
title: Server-Side Field Filters for FK-Scoped Subcollections
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Extend the existing R-282 boolean/enum equality-filter contract from top-level LIST endpoints to
  unambiguous FK-scoped LIST_BY subcollection endpoints. Preserve the parent relation ID as the first
  SQL parameter, compose optional search and field filters deterministically, and keep count/list query
  semantics aligned across generated FastAPI, Go, and OpenAPI output.
tracker_ref: "R-284"
requirements:
  - Reuse field_validation.filter_fields as the single allowlist for boolean and enum fields.
  - Add optional typed filter query parameters to generated FastAPI LIST_BY routes and forward them to both count and list repository calls.
  - Extend generated Python LIST_BY repository methods so relation scope, q search, and equality filters share one parameterized WHERE clause.
  - Extend generated Go LIST_BY stores and handlers with a filter map while preserving relation ID as $1, q as the next argument when present, and filter values after q.
  - Document the same boolean/enum query parameters on LIST_BY operations in generated OpenAPI 3.1 output.
  - Preserve byte-stable output for non-filterable subcollection entities and description-only IR changes.
acceptance_criteria:
  - Python list_<table>_by_<relation> and count_<table>_by_<relation> accept each allowlisted filter and use only %s-bound values.
  - FastAPI LIST_BY handlers declare bool | None or str | None filter parameters and forward identical filters to count and list calls.
  - Go List<Entity>By<Relation> and Count<Entity>By<Relation> accept filters map[string]string and use a shared relation-scoped builder for matching list/count predicates.
  - Go relation ID remains $1; a present q search uses the next placeholder; active filter placeholders follow len(args)+1; pagination placeholders follow all predicates.
  - Go LIST_BY handlers parse and pass filters only for filterable child entities.
  - OpenAPI LIST_BY operations expose boolean and enum filter schemas identical to top-level LIST.
  - Existing non-filterable minimal-blog Comment LIST_BY output remains compatible and all offline gates pass.
