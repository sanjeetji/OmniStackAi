schema_version: 1
task_id: R-271
title: CSV Data Export & Bulk Export in Generated Next.js Collection Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add client-side CSV data export and bulk selection export in generated Next.js collection screens:
  - Add handleExportCsv helper function in _collection_screen_page accepting selectedOnly boolean flag.
  - Implement RFC 4180 compliant CSV value formatting (quotes, commas, newlines, null handling).
  - Export all declared entity fields (header row and row data).
  - Use Blob([csvContent], { type: "text/csv;charset=utf-8;" }) and URL.createObjectURL for in-browser downloads.
  - Revoke object URL after download to prevent memory leaks.
  - Render an "Export CSV" button in the table actions header next to Refresh, disabled when no data is available.
  - When checkedIds.length > 0, render an "Export Selected ({checkedIds.length})" button in the Bulk Actions Bar.
  - File download naming: {plural.toLowerCase()}_export.csv.
  - Maintain strict diff invariance across ir.description modifications.
  - Fully offline, 0 network, 0 external dependencies.
