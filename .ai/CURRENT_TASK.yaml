  - services/agent-engine/tests/**
must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the R-005 ModelProvider protocol/records and the R-006 Ollama adapter public behavior
  - cloud model providers, adapters, SDKs, or any real cloud model call
  - agent orchestration, product APIs, or a deployable agent-engine process
  - local Compose services or infrastructure
  - Redis, NATS, object storage, Kubernetes, Temporal, or cloud resources
  - auth, organizations, billing, Git integration, audit, or business APIs
  - native mobile or device-cloud functionality
  - the Section 74 top-level monorepo contract; no new top-level directory
  - source documents other than the authorized execution tracker status and evidence
acceptance:
  - The router selects a registered provider for a task purely from deterministic inputs (complexity, routing mode, registry state, model descriptor) with no provider knowledge in product code.
  - L0 deterministic work is rejected from model dispatch with a stable typed error; the router never issues a model call for work a deterministic tool should perform.
  - Under Balanced routing, L1 and L2 work resolves to the local Ollama provider when it is registered and healthy.
  - L3 and L4 work returns a stable escalation-required outcome because no cloud provider is registered; the router never silently downgrades high-risk work to the local model.
  - When the resolved local provider reports UNAVAILABLE health, the router returns a stable provider-unavailable outcome and never silently escalates to an unregistered or unauthorized cloud provider.
  - A conservative deterministic budget guard rejects a request whose estimated input exceeds the model safe-input budget or whose requested output exceeds the model max-output budget, rather than silently truncating.
  - On a routable, in-budget decision the router dispatches to the provider generate/stream and returns the existing vendor-neutral records unchanged.
  - Standard-library tests cover L0 rejection, L1/L2 local routing, L3/L4 escalation-required, unavailable-provider no-fallback, budget overflow, empty/unknown registry, and a successful dispatch through a fake provider, all without network access.
  - No provider SDK/dependency, cloud provider/call, service process, database or Compose change, infrastructure, new top-level folder, or native/device work is introduced; static task verify stays network-independent.
required_gates:
  - impact_analysis
  - python_compile_test
  - gateway_routing_ladder_tests
  - no_silent_cloud_fallback_and_unavailable_provider_tests
  - context_budget_guard_tests
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
model_tool_trace:
  routing: local_only
  local_provider: ollama
  configured_model: qwen2.5-coder:14b
  local_calls: 0
  cloud_calls: 0
  note: >-
    Routing is deterministic and needs no model call to implement or test. Deterministic brief and
    repository evidence define the task. No cloud model is chosen or called; cloud adapters are
    deferred to R-008 under an explicit founder paid-provider decision.
