branch: ai/R-561-verify-every-surface
objective: >-
  R-560 type-checks `apps/web` and nothing else. A generated project also ships an admin console, a
  React Native app and a backend, and none of them is ever compiled — by us or by any test.
  Measured on a freshly generated project: `apps/admin` compiles cleanly, the Python backend parses,
  and **the Go backend does not run at all**. It ships `go.mod` with no `go.sum`, its README tells
  the user to run `go run .`, and that command fails immediately with "missing go.sum entry" for
  every dependency. The preview does the same thing, so a Go backend is broken end to end — while
  the Python path gets a virtualenv and a `pip install` step the Go path was never given.
  Fix the Go backend, and extend verification to every surface so the next one cannot break in
  silence. Nothing but `apps/web` has a model-written file, so a failure anywhere else is a fault in
  our generator and is reported as one.
