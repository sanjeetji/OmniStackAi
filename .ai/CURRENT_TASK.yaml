schema_version: 1
task_id: R-243
title: Per-endpoint role enforcement (IR required_roles -> 403 in the generated guard)
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add authorization on top of the R-242 JWT authentication (Brief 9/27/55/64): extend the Application IR
  ApiEndpoint with an optional required_roles (role ids), validate it (each must be a declared Role;
  a non-empty value implies auth), and generate a per-endpoint role check that returns 403 when the
  verified token's roles claim does not include any required role. Python gets a require_roles(*roles)
  dependency factory and role-gated routes declare dependencies=[Depends(require_roles("..."))]; Go gets
  RequireRoles(next, roles...) built on a shared verifyToken, and main wraps role-gated endpoints. This
  is the first additive change to the IR itself (required_roles defaults to () — backward compatible, no
  schema-version bump). Deterministic and offline; nothing runs.
