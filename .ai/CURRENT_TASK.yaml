objective: >-
  Add an accessible, zero-dependency, desktop-and-mobile-grade, futuristic Particle Network & Interactive
  Constellation Canvas compound component suite (components/particle-network.tsx) — an ambient, decorative-by-default
  animated background (distinct from the data-driven network-graph): particles generated internally (no required
  data props) from a count/density derivation, animated on an HTML5 Canvas 2D requestAnimationFrame loop with
  edge-bounce motion, proximity link lines with distance-proportional globalAlpha, pointer reactivity (attraction +
  accent-colored cursor links within interactionRadius), device-pixel-ratio-aware sizing, and a JS
  prefers-reduced-motion guard (single static frame, no rAF, live change listener); imperative
  ParticleNetworkHandle (pause, resume, toggle, restart, isPaused, getCanvas) via useImperativeHandle; WAI-ARIA
  decorative semantics (wrapper role="img" + aria-label, aria-hidden="true" canvas, no focus trap); 4 futuristic
  variants ("default", "card", "glass", "neon"); 3 size scales ("sm", "md", "lg"); React ref forwarding
  (forwardRef); semantic alias exports (ParticleNetwork, ConstellationCanvas, ParticleField, StarfieldBackground);
  and explicit displayNames across compound exports. Static module constant — never references ir.name/ir.description.
