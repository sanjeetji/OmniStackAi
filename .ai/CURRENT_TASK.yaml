objective: >-
  Make the platform safe to host for many users. Per-project isolation of builds, sessions and
  previews: the Studio accepts calls only from the control plane (service token); every preview
  gets its own database and database role, never the platform's credentials; a multi-tenant mode
  runs previews in containers (gVisor where registered) with CPU/memory/process limits, no route to
  platform services, and outbound traffic only through an allowlist proxy; per-user quotas on
  concurrent previews and builds, with idle previews stopped. A tenant-isolation test suite proves
  it (R-100, R-214, PG-05). Cloud-neutral, proven locally on Colima; the cloud account is PC-070.
founder_gate: >-
