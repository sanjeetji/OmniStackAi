forbidden_changes:
  - No new dependency in generated projects; app.config.js is plain Node
  - No credential value in brand.json — it is branding, not configuration for secrets
  - The app must still bundle, and icons stay valid PNGs at the sizes Expo expects
  - Generated output stays byte-stable for a given IR and prompt
  - task verify stays offline with 0 model calls
required_gates:
  - A generated project contains one brand.json holding name, colour, font, radius and identifier
  - apps/mobile reads it through app.config.js, and the static app.json no longer competes with it
  - The web and admin token stylesheets carry the same colour brand.json declares
  - The React Native design tokens carry it too, so all three surfaces agree
  - brand.json documents that the identifier is permanent once published
  - Editing brand.json alone changes what every surface renders
  - task verify passes offline with 0 model calls
