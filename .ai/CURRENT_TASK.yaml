  - No new dependency in generated projects beyond the pinned Next.js stack
  - task verify stays offline with 0 model calls
  - Dark mode must keep working — the dark theme's primary has to be derived, not left behind
  - Deterministic output stays byte-stable for a given IR and prompt
  - A project with no brand cue keeps exactly today's default palette, byte for byte
required_gates:
  - A prompt naming a colour produces a generated app whose tokens.css carries that colour
  - Colour names work, not only hex; the extractor reads "a red shop" as well as "#ff0000"
  - The derived hover, focus and subtle shades are valid hex and visibly distinct from the base
  - The dark theme's primary is derived from the same brand, so dark mode is not left blue
  - font_family and border_radius from the prompt reach the CSS too
  - An IR with default brand emits byte-identical CSS to today's static string
  - task verify passes offline with 0 model calls
