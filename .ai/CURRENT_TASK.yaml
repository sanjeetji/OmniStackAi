objective: >-
  Lovable-grade pass on the console, after surveying the founder's 96 reference screenshots
  (~/Desktop/AI_Platform_Screenshots; Lovable chosen as the primary reference, Dyad for the
  prompt-first home). Four real patterns, no facades: (1) a prompt-first home - the dashboard
  hero is a real composer (components/home-composer.tsx: "What do you want to build?", textarea,
  the three real example chips, Build -> /studio?prompt=...); (2) the Studio picks up ?prompt=
  with no ?build=, pre-fills the composer and starts exactly one build through the existing form
  submit path (requestSubmit + a ref guard, no setState in the effect), then cleans the URL;
  (3) assistant replies as prose rows with a brand-mark gutter (user bubbles kept, error rows
  kept), rail type at 13px; follow-up suggestion chips after a completed build/edit (three real
  generic next edits) that fill the composer; (4) a file-search filter above the tree in Files
  and Code, and an honest "Read only" label on the viewer. Out of scope on purpose: Lovable's
  Cloud/Publish/Payments panels (no backend), a project switcher (no per-user build list),
  Emergent's Web/Mobile tabs (mobile is a hard gate).
