task_id: R-269
title: Page Size Selector & Contextual Empty State CTAs in Generated Next.js Screens
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add page size selection and contextual empty state CTAs to generated Next.js screens:
  - Add setPageSize: (size: number) => void; to UseListState<T> interface.
  - Implement setPageSize in useList<Entities> and useList<Children>By<Rel> resetting offset to 0.
  - Return pageSize and setPageSize in both list hook implementations.
  - In _collection_screen_page, destructure pageSize and setPageSize and render an accessible
    page size selector dropdown (10, 25, 50, 100 per page) next to pagination buttons in the footer.
  - In _collection_screen_page table empty state (when data.length === 0):
    * If search is active (searchInput.trim()): render "No <plural> matching '<searchInput>'." with a "Clear search" CTA button.
    * If no search is active and form_screen exists: render "No <plural> found yet." with a "+ Create first <Entity>" CTA link.
    * Fallback if no form_screen: render "No <plural> found.".
  - In subcollection panels (_collection_screen_page and _detail_screen_page), when child data is empty and child_form exists,
    render a "+ Add first <Child>" CTA link pointing to the child form screen.
  - Maintain strict diff invariance across ir.description modifications.
  - Fully offline, 0 network, 0 external dependencies.
