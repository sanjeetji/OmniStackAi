objective: >-
  Third of the five-task sandbox-provider sequence (R-486..R-490). Adds a real Daytona driver,
  proving SandboxLifecycleProvider/sandbox_http.py generalize a third time. Verified against
  Daytona's real REST API (fetched directly): POST/GET/DELETE https://api.daytona.io/sandbox[/{id}],
  Bearer auth, and a genuinely different shape from both prior drivers - the create response
  carries no URL at all; a second call, GET .../sandbox/{id}/ports/{port}/preview-url, is required
  to get the real URL. create() always requests "public": true since SandboxHandle.url has no room
  for a companion preview-access token. Daytona's documented default isolation is plain Docker
  containers (weaker than E2B/Vercel's Firecracker microVMs) - a real tradeoff surfaced honestly,
  not attempted to be worked around. No real DAYTONA_API_KEY exists in this environment, so every
  gate is offline; live-cloud verification is honestly deferred.
