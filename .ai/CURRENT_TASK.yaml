branch: ai/R-545-mobile-app-runs
objective: >-
  `codegen/react_native.py` emits a genuine Expo app — 27 files, a design system, navigation, an
  API client, auth context and per-entity screens, with iOS and Android bundle identifiers already
  set. The platform can do nothing with it: `APP_KINDS` is ("web", "admin", "pwa", "api") with no
  mobile kind, and `localrun/plan.py` contains zero references to `apps/mobile`. A user who asks
  for a mobile app gets working code the platform never installs, starts, previews or offers a QR
  for. Make the generated mobile app run: install it, start Expo, and put its QR in front of the
  user so they can open it in Expo Go on a real phone. The console already has a from-scratch QR
  component and a phone frame; what is missing is a running app to point them at.
  PWA stays the default for generated apps — this adds React Native alongside it, it does not
  replace it.
founder_gate: >-
  AGENTS.md forbids starting native mobile work without approval. The founder asked for it
  explicitly on 2026-09-24 ("we need to build feature for React Native also, and it should be
  fully functional, so that user can publish the app in Google and App stores"). Recorded here as
  the approval. No paid service is used or required by this task; store submission needs an Apple
  Developer account, a Google Play account and an EAS account, and is a separate gated decision.
