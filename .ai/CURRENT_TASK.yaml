goal: >-
  Make the existing offline builder proof visible in the dependency-free Stage 0 console. Extend the
  metadata-only console snapshot with (1) the R-245 combined project plan for a real bundled IR example
  and (2) an R-246 hunk-level unified patch produced from an actual old/new IR assembly. Render both
  with safe DOM APIs alongside the model-fabric overview. This is a read-only demonstration surface:
  no generated app is installed, run, verified, deployed, or connected to a database.
