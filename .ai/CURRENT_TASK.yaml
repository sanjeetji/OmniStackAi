task_id: R-221
title: Cross-provider fallback and circuit breaking for the model gateway
status: done
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-221-cross-provider-fallback
goal: >-
  Add explicit, allowlist-driven cross-provider fallback and per-provider circuit breaking to the
  Balanced gateway. An operator configures an ordered fallback chain of model descriptors; on a
  retriable failure (provider unavailable, timeout, or HTTP error) the gateway advances to the next
  allowed candidate that is registered and whose circuit is closed, never silently and never outside
  the configured chain. A per-provider circuit breaker opens after repeated failures and recovers
  after a cooldown. Accounting records each attempt. Default behavior (no fallback configured) is
  unchanged.
