schema_version: 1
task_id: R-239
title: Data-access/repository layer for the generated backends (reads/writes the IR tables)
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Turn the R-238 schema into a usable persistence layer (Brief 9/34/42): generate a per-entity
  data-access layer for both backends so the generated code can read and write the tables. Python
  (FastAPI) gets app/db.py (an async psycopg connection helper reading DATABASE_URL) plus
  app/repositories/<entity>.py with list/get/create/delete using parameterized SQL; Go gets
  internal/store/store.go (a database/sql opener) plus internal/store/<entity>.go with
  List/Get/Create/Delete scanning into the generated model structs. Values are always parameterized
  (never string-interpolated); table/column identifiers come from the IR. Emitted only when the IR has
  entities and database_strategy=postgres, alongside the migration. Pure, deterministic, offline (emit
  files, assert contents) — no DB connection, no query executed, no network. The R-237 edit loop diffs
  the repositories when the IR entities change.
