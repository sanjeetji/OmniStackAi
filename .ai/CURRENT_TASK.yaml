must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the ModelProvider/gateway, IR, runtime, verify, edit, data-access, route-wiring public behavior (additive)
  - endpoints with auth=false (no guard added); the public behavior of routes stays otherwise identical
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - claim real token verification (signature/expiry/roles) — the generated guard only requires a bearer
    credential and marks verification as a TODO; do not fabricate a JWT secret or key
  - execute a handler or make a network call; add a platform Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - When the IR has at least one auth=true endpoint, the Python backend emits app/auth.py (require_auth
    dependency that 401s without an Authorization: Bearer token) and every auth=true route declares
    dependencies=[Depends(require_auth)]; auth=false routes are unchanged.
  - The Go backend emits internal/handlers/auth.go (RequireAuth middleware that 401s without a bearer
    token) and main wraps exactly the auth=true endpoints with handlers.RequireAuth(...); auth=false
    endpoints are registered directly.
  - The IR roles are surfaced as a generated constant (Python ROLES tuple, Go Roles slice) listing the
    role names; the generated code documents that per-endpoint role enforcement is future work.
  - Nothing is emitted when no endpoint requires auth; generated Python parses as valid Python; output
    is byte-stable; nothing runs.
  - Standard-library offline tests cover the guard emission + gating, per-route dependency/middleware
    wrapping for auth vs public endpoints, and the roles constant.
required_gates:
