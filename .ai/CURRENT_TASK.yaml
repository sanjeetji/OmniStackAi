branch: platform-completion
objective: >-
  File uploads in generated apps. An attachment field opens an upload window (Uppy): the device,
  the camera, a web link, and Google Drive / Dropbox / OneDrive / Box when their keys are set
  (a self-hosted Uppy Companion). What a field accepts follows the requirement - the planner sets
  the types, size and count per field ("resume" -> PDF/DOC/DOCX; "product photos" -> images),
  with a deterministic default from the field's name and executables always refused. The app's
  API receives the file, checks its real content (magic bytes, not the name) and size against the
  field's rules, and stores it in Cloudflare R2 (dev or prod bucket), AWS S3, or the local disk
  when no keys are set; files are private and served through short-lived signed links. The
  platform picks the store from its .env (OMNISTACKAI_STORAGE_TARGET; R2 dev -> local, or R2 prod
  -> S3 -> local), so production needs only keys. This task covers the default Python backend and
  the web and admin apps; rich text is PC-104 and Go/Node uploads PC-105.
founder_gate: none
decisions:
  - "Founder, 2026-09-29: Cloudflare R2 for development (free) and production, AWS S3 as the production alternative, local disk as the fallback; no MinIO"
  - "Uploads pass through the app's API (streamed, size-capped), not straight to the bucket: the server sees the bytes and checks the real type, and cloud-drive files arrive the same way via Companion. Direct-to-bucket multipart for very large media can be added later"
