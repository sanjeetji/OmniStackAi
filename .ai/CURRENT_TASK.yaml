schema_version: 1
task_id: R-294
title: Generated Next.js App Router Resilience — Error Boundary, Global Error, Not-Found & Loading Fallback
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add the four Next.js App Router "special files" the generated web app currently lacks, giving every
  generated app real runtime resilience: app/error.tsx (route-segment error boundary with a reset()
  "Try again" recovery), app/global-error.tsx (root-layout error boundary that renders its own
  <html>/<body>), app/not-found.tsx (friendly 404 with a link back to the overview), and app/loading.tsx
  (route-level Suspense fallback that reuses the R-292/293 skeleton visual language). All four are static,
  inline-styled to match the app aesthetic, dependency-free, and never reference ir.description or ir.name
  so generation stays deterministic and description-only-stable.
tracker_ref: "R-294"
requirements:
  - NextjsWebAdapter emits app/error.tsx as a client component ("use client") default-exporting a component that receives { error, reset } and renders a recovery card with a "Try again" button calling reset() and a "Back to overview" link to "/", logging the error via useEffect.
  - NextjsWebAdapter emits app/global-error.tsx as a client component ("use client") that renders its own <html lang="en"><body ...> and a reset() "Try again" recovery (root-layout error boundary contract).
  - NextjsWebAdapter emits app/not-found.tsx (server component) rendering a "Page not found" 404 with a Link to "/".
  - NextjsWebAdapter emits app/loading.tsx (server component) rendering layout-preserving skeleton blocks (reusing the R-292/293 gray-rounded-div palette, #e2e8f0 / #f1f5f9 / opacity ramp) as a route-level Suspense fallback.
  - The four files are static (no ir.description and no ir.name usage), inline-styled, no new npm/platform dependency; existing files, hooks, API client, backend, and IR are unchanged.
acceptance_criteria:
  - A generated project contains app/error.tsx, app/global-error.tsx, app/not-found.tsx, and app/loading.tsx.
  - error.tsx and global-error.tsx are "use client" and wire reset(); global-error.tsx renders its own <html>/<body>.
  - not-found.tsx and loading.tsx are server components (no "use client"); loading.tsx maps skeleton divs.
  - Output is byte-identical across ir.description changes; the console-snapshot description-edit diff set is unchanged (the new files never appear in it); both example projects still generate.
  - Focused tests, related adapter/console-snapshot tests, full offline verification, lint, security, env check, and both builder demos pass.
