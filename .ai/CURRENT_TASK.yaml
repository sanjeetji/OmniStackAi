next_action: >-
  R-490 shipped: 3,738 agent-engine tests OK (9 new). A real test-design risk was caught and
  avoided (a "real registry" test would have made a real Docker socket connection attempt via
  GVisorSandboxProvider.active - replaced with a class-identity wiring check instead, zero I/O).
  This completes the five-task sandbox-provider sequence (R-486..R-490): E2B, Vercel Sandbox,
  Daytona, and a free self-hosted gVisor option are all real, independently-tested, and now
  genuinely pluggable/switchable via build_sandbox_from_env() - a single config value or an
  explicit per-call override (the concrete "switch per userbase" mechanism). Per-user plan-based
  routing (reading a real user's plan from the Go control-plane) and actually wiring a selected
  provider into the Studio's preview flow both remain separate, not-yet-scoped future work,
  consistent with every task in this sequence's own stated boundary.
  Next (not yet scoped): per the founder's earlier direction, remaining named items are
  Publish/deploy (multi-target: Netlify one-click, Vercel/Cloudflare/self-host/GitHub-export),
  Node.js backend codegen support alongside Python/Go, and starting mobile technology work (React
  Native near-term). Full per-user process/tenant isolation as a wholesale architecture (beyond
  which sandbox technology runs one preview) remains a separate, larger decision needing its own
  founder sign-off.
