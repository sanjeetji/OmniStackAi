objective: >-
  Live updates in generated apps. A `realtime` capability names the entities whose changes reach
  people as they happen (an order's status, a delivery's position, a ticket's replies). A trigger
  publishes each change through Postgres LISTEN/NOTIFY; every backend (Python, Go, Express, Hono)
  streams it to signed-in users over Server-Sent Events, filtered by the entity's ownership rule so
  nobody hears of a record they cannot see; the generated pages' data hooks refetch quietly on a
  change. Planned from the prompt ("live status", "real-time", "track") as well as by the model.
