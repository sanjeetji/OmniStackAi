objective: >-
  Grounded Hybrid UI Synthesis (first brick of the founder-approved hybrid engine): the LLM writes the modern
  Next.js UI constrained to the deterministic typed data layer (real generated lib/types.ts / lib/api.ts /
  lib/hooks.ts, derived by parsing the same generators so it cannot drift) and the existing design-token layer,
  with a bounded validation->feedback->retry loop (retry only on validator rejection, never on exceptions) and a
  deterministic-template fallback. Replaced the never-set OMNISTACKAI_SYNTHESIZE_ALL_SCREENS env gate with an
  explicit synthesize_screens flag threaded generate -> assemble_project -> build_app_from_ir/prompt (default
  False; deterministic output byte-identical). Hardened the import whitelist (multi-line bypass, react-*,
  require, dynamic import). Added a JSON-safe secret-free UiSynthesisOutcome per file and an opt-in CLI
  `task agent-engine:ui:synthesize` (Groq/Gemini via OMNISTACKAI_CLOUD_PROVIDER, Ollama fallback). Model calls
  stay opt-in and never run under task verify (stub providers, 0 real calls).
