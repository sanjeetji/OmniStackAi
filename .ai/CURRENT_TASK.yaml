schema_version: 1
task_id: R-267
title: Foreign-Key Relation Selectors & Parent Auto-Population in Generated Next.js Forms
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Replace raw foreign key text inputs with typed parent relation selectors (<select> dropdowns)
  and automatic query parameter pre-population in generated Next.js forms:
  - In form screens (_form_screen_page), detect MANY_TO_ONE relations and foreign key fields (e.g. article_id, driver_id).
  - Automatically import parent list hook (useList<ParentPlural>) from ../lib/hooks when parent has Op.LIST.
  - Fetch parent items and render accessible <select> dropdowns showing parent primary display field (title/name).
  - Pre-populate foreign key fields from URL query params (searchParams.get(fk_field) or searchParams.get(rel_name + "Id"))
    when navigating from parent master-detail views (+ New <Child> links).
  - Provide fallback safety for entities without foreign key relations (clean schema inputs).
  - Maintain byte-for-byte diff invariance across ir.description changes.
  - Fully offline, 0 network, 0 external deps.
