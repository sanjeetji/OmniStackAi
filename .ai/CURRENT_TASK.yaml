schema_version: 1
task_id: R-280
title: Deep-Linked Collection List State + Debounced, Race-Safe Search in Generated Next.js Web App
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the generated Next.js collection list view URL-addressable and its data fetching correct and
  efficient. (A) The useList<Entities> hook syncs sort/order/q/page/pageSize to the URL query string and
  hydrates them from the URL on mount, so refresh / bookmark / share restore the exact view. (B) The
  collection screen search input is debounced (fixed delay) so typing no longer fires one request per
  keystroke, and useList.refetch aborts the previous in-flight request (AbortController) and ignores
  stale responses, so rapid typing yields correct, non-flickering results. Backend already exposes
  sort/order/q/limit/offset (R-255/258/261) and the API client already forwards a fetch signal.
tracker_ref: "R-280"
requirements:
  - useList<Entities> hydrates sort/order/q/page/pageSize from window.location.search once on mount (client-only, no hydration mismatch).
  - useList<Entities> reflects the current list params in the URL via new URL(...) + window.history.replaceState (only non-default values written), mirroring the R-276 detail-screen deep-link pattern.
  - useList<Entities>.refetch creates an AbortController per request, aborts the previous request, passes signal to the API call, and ignores aborted/stale responses (no setData/setError/setLoading on abort); aborts in-flight on unmount.
  - Collection screen search input debounces committing the query to setSearch by a fixed 300ms delay (setTimeout/clearTimeout); onChange only updates the local controlled input; the form submit still searches immediately.
  - Collection screen reflects the hydrated/deep-linked q back into the search input box.
  - No new IR fields, no new npm dependencies, "use client" preserved, strict diff invariance across ir.description.
acceptance_criteria:
  - Generated apps/web/lib/hooks.ts useList<Plural> contains a URL-hydrate useEffect (URLSearchParams over window.location.search) and a URL-sync useEffect calling window.history.replaceState with sort/order/q/page/pageSize.
  - Generated useList<Plural>.refetch uses an AbortController (abort previous, pass signal, guard AbortError) so out-of-order responses cannot clobber state.
  - Generated collection page.tsx debounces search (setTimeout + clearTimeout, 300) and no longer calls setSearch on every keystroke; imports useEffect.
  - Strict diff invariance: changing only ir.description produces byte-identical hooks.ts and collection page.tsx.
  - task verify passes (expect 760+ tests, 0 failures, new test_collection_deeplink_state.py).
  - task lint and task security:quick pass.
  - builder:demo passes for minimal-blog and rideshare-favourites.
