objective: >-
  Phase B of R_&_D/OmniStackAI_Commercial_Platform_Kickoff_v1.md: replaced the static,
  dependency-free apps/console-web (plain HTML/CSS/JS reading a committed data/overview.json
  snapshot) with a real Next.js (App Router, TypeScript) app. Register/login/logout wired to
  R-469's control-plane (POST /auth/register, /auth/login, /auth/logout, GET /auth/me) via
  server-side Route Handlers that proxy the calls and set/clear an httpOnly session cookie - the
  raw token is never handed to client-side JavaScript, no CORS needed. An authenticated home page
  shows the signed-in user's profile + credit balance; a /fabric page carries the old model/cost
  overview dashboard forward on the exact same data/overview.json data contract, now rendered by a
  React Server Component. No new UI dependency beyond React/Next.js itself - the existing console's
  CSS design tokens carry forward into app/globals.css. New env var
  OMNISTACKAI_CONTROL_PLANE_URL (server-side only). Old index.html/app.js/styles.css removed.
  scripts/console.sh rewritten around next dev/build/lint/start; scripts/verify.sh gained console
  lint/typecheck/build steps (next build succeeds without a live control-plane). Correction to the
  kickoff doc's own framing: scripts/doctor.sh already required node/pnpm before this task - what
  was actually new was pnpm install fetching real packages for the first time.
  Several real compatibility issues found and fixed while implementing (see .ai/tasks/R-470.md
  "Live discovery" for full detail): pnpm's default fetch timeout was too short for this network
  (fixed with a new root .npmrc); typescript@7.0.2 (npm's actual latest) is not yet supported by
  typescript-eslint (pinned to typescript@6.0.3, matching eslint-config-next's own tested version);
  the documented FlatCompat eslint.config.mjs pattern crashed on a circular-reference bug in
  @eslint/eslintrc's error formatter (fixed by importing eslint-config-next's own native flat-config
  export directly instead); pnpm 11.19 stopped reading package.json's pnpm.* fields (moved the
  onlyBuiltDependencies/allowBuilds setting to pnpm-workspace.yaml); and, most importantly, the
  session cookie's Secure flag was wired from NODE_ENV (always "production" under next start
  regardless of real protocol) rather than the actual request protocol - this would have silently
  broken login for anyone using the app locally over plain HTTP in a real browser (curl doesn't
  enforce the Secure attribute the way browsers do, so the first smoke test's 200s masked it; caught
  by inspecting the raw Set-Cookie header). Fixed with a per-request isSecureRequest() check; the
  full live smoke test was re-run afterward and confirmed correct. No agent-engine bridge, no
  payment processor, no Studio/builder UX yet - Phases C/D/E, separate Tracker IDs.
