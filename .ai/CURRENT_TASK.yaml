branch: ai/R-564-ir-v2-core
objective: >-
  The IR models entities, fields, relations, CRUD, screens and roles, and nothing else. Workflows,
  ledgers, scheduled jobs, realtime channels and row-level permissions cannot be written down at
  all, so no model — however good — can produce them: `route_wiring.wire_endpoint` returns `None`
  for anything that is not one of six CRUD shapes, and the endpoint is dropped. That is the
  "maximum features" ceiling, and it is in the data model rather than in the prompt.
  This task builds the frame the rest of Phase 2 fills: a capability layer on the IR, a registry of
  kinds that distinguishes what is implemented from what is merely declared, schema version 2, and
  a migration that keeps every existing project loadable.
  The migration is the hard part. `from_dict` currently rejects any version that is not exactly 1,
  and R-563 means every user's project has an `ir.json` on disk. Bumping the number without
  migrating would make every existing project unopenable and uneditable.
