schema_version: 1
task_id: R-290
title: Optimistic Delete with Rollback in the Generated Collection Screen
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the generated Next.js collection screen's deletes optimistic: single (handleDelete) and batch
  (handleBatchDelete) removals hide the affected rows immediately and reappear (with the existing error
  toast) only if the server rejects, instead of waiting for the round-trip. Safe on the deduped mutation
  hooks (R-288) and race-safe list fetch (R-280). Self-contained in the collection screen; no hook, API
  client, backend, or IR change.
tracker_ref: "R-290"
requirements:
  - Add a per-screen pendingDeleteIds state (useState<string[]>) next to checkedIds.
  - A reconcile useEffect on [data] prunes pending ids no longer present after refetch (no unbounded growth, no flash-back).
  - handleDelete optimistically adds the id to pending before await remove(id); on error it rolls the id back before the existing toast.error.
  - handleBatchDelete snapshots the checked ids, optimistically adds them; on error it rolls those ids back.
  - The row map iterates a visibleRows list that filters out pendingDeleteIds; the empty-state condition is unchanged.
  - No detail-screen/subcollection delete change; no mutation/list hook, API client, backend, or IR change.
  - Preserve deterministic generation and description-only IR stability.
acceptance_criteria:
  - Generated collection page emits `const [pendingDeleteIds, setPendingDeleteIds] = useState<string[]>([]);` and a reconcile `useEffect(... , [data]);` pruning ids not in data.
  - handleDelete adds `setPendingDeleteIds((prev) => [...prev, String(id)])` before `await remove(id)`, and its catch calls `setPendingDeleteIds((prev) => prev.filter((x) => x !== String(id)));` before `toast.error`.
  - handleBatchDelete adds the checked ids optimistically and rolls them back in catch.
  - The row map iterates `visibleRows` (displayData filtered by pendingDeleteIds); existing success toasts/refetch/checked clearing preserved.
  - Entities without delete emit no pendingDeleteIds; description-only IR changes remain byte-identical.
  - Focused tests, related collection tests, full offline verification, lint, security, env check, and both builder demos pass.
