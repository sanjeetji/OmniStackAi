objective: >-
  Implement F-06 AI — model configuration (BYOK) and usage per project/account (spec R_&_D/specs/F-06-ai-usage.md).
  Bring-Your-Own-Key (BYOK) provider keys stored encrypted with AES-256-GCM in PostgreSQL user_provider_keys.
  Per-project model pinning in projects.model_provider_id and projects.model_id.
  Immutable model_calls audit log table tracking tokens, latency, cost, and credits, written in the same transaction as credit debits.
  Model resolution precedence: Project pinned model -> User BYOK key (0 credits) -> Platform cloud provider (credits) -> Local Ollama (0 credits).
  Control-plane REST API (/ai/providers, /ai/keys/{providerId}, /ai/keys/{providerId}/test, /ai/models, /projects/{id}/model, /projects/{id}/usage, /usage).
  Console Web UI: Settings -> AI (BYOK keys with test button), Settings -> Usage (account totals & per-project table), Manage -> AI (project model pinning & usage stats).
