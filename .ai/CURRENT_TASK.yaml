objective: >-
  Phase C of R_&_D/OmniStackAI_Commercial_Platform_Kickoff_v1.md (renumbered from R-471, which
  became a real bug-fix task instead): the control-plane's Job API proxies "build this app"
  requests to the existing agent-engine, and a real generation call actually debits the
  authenticated user's credit balance, with local-Ollama usage staying credit-exempt. Correction
  found while researching: the Studio's real build path returns a raw ModelProvider (bypassing the
  ModelGateway's existing but currently demo-only UsageLedger accounting), so a small additive
  agent-engine change is needed - a new RecordingProvider decorator (model_gateway/recording.py)
  implementing the exact same ModelProvider protocol, wrapping any provider to record real
  usage/cost into an injected UsageLedger, with zero changes to any existing call site.
  resolve_generation_provider_from_env gains an optional usage_ledger param (default None = todays
  unchanged behavior); live_serve.py's _build creates one per request and adds a JSON-safe usage
  summary (cost_micros_usd as an int, not a decimal string, to avoid any float/precision issue
  crossing the Go/Python boundary) to the response, additive like R-467's ui_outcomes. Go side: new
  internal/jobs package proxies POST /jobs/build (authenticated via a new exported
  auth.RequireUser helper) to the agent-engine, converts cost_micros_usd to credits via
  OMNISTACKAI_CREDITS_PER_USD, debits atomically via a new users.Store.DebitCredits (row-locked,
  clamped so balance never goes negative - v1 policy is to never block a build, only clamp the
  charge). No console-web changes (Phase D); no /jobs/build/{id}/edit yet (named follow-up); no
  hard pre-flight balance blocking (named follow-up, needs its own UX); agent-engine is reached via
  a configured URL, not Docker Compose (scripts/test.sh already hard-blocks adding it as a
  service at this stage).
