objective: >-
  Fix a real, reproducible bug found live during R-481's own manual smoke test, scoped and fixed as
  its own Tracker ID per the founder's "complete one by one all" direction. Two independent,
  compounding defects in the edit-delta codegen path: (1) a Next.js dynamic-route slug collision
  ('counterId' !== 'counter_id') caused by an unreconciled casing mismatch between the full-build
  prompt (no path-param casing rule, camelCase by example) and the edit-delta prompt (explicit
  lower_snake_case instruction); (2) a duplicate lib/types.ts identifier when an edit's entity
  declares both an explicit '<relation>_id' field and a same-named relation. Fixed at the root:
  ApiEndpoint.__post_init__ now canonicalizes every {param} to camelCase unconditionally (every
  construction path, not just the two known ones); _entity_interface() now skips the synthesized FK
  field when an explicit same-named field already exists.
