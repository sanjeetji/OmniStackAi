schema_version: 1
task_id: R-289
title: Debounced Live Subcollection Search in Generated Next.js Web App
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Make the generated subcollection (master-detail) search live and debounced, matching the top-level
  collection search (R-280). R-281 shipped a submit-only subcollection search form; now that R-286 made
  the useList<Child>By<Parent> hook race-safe (superseded LIST_BY requests are aborted), a live
  search-as-you-type is safe. Each subcollection gets a controlled search input backed by component state
  that commits to the hook's setSearch after a fixed 300ms debounce; the form submit still searches
  immediately. Applies to both subcollection render sites (collection master-detail and detail screen).
tracker_ref: "R-289"
requirements:
  - Each subcollection owns a controlled search input state (useState) declared next to its hook.
  - A 300ms debounce useEffect commits the trimmed input to <hook>.setSearch, guarded so it does not recommit an unchanged value.
  - The subcollection search input is controlled (value + onChange); the form onSubmit still commits immediately (Enter to search now).
  - Applies in both the collection master-detail screen and the dedicated detail screen.
  - Reuse the R-280 debounce pattern and the race-safe R-286 LIST_BY hook; no hook, IR, backend, or API-client change.
  - Preserve the sort select, filter controls (R-285), and pagination; preserve description-only IR stability.
acceptance_criteria:
  - Each subcollection emits `const <s_var>Search, set<...>Search = useState("")` and a `setTimeout(..., 300)` debounce useEffect committing to `<s_var>.setSearch`.
  - The subcollection search input uses `value={<s_var>Search}` + `onChange`, no longer `defaultValue` + FormData; the form onSubmit calls `<s_var>.setSearch(<s_var>Search.trim())`.
  - Both the collection master-detail and detail screens carry the debounced search per subcollection.
  - Entities without a subcollection emit no such state/effect; description-only IR changes remain byte-identical.
  - Focused tests, R-281 subcollection-controls tests (updated), full offline verification, lint, security, env check, and both builder demos pass.
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/codegen/nextjs.py
  - services/agent-engine/tests/test_subcollection_search_debounce.py
  - services/agent-engine/tests/test_subcollection_list_controls.py
  - .ai task/state/handoff/work-log files, PROJECT_STATE.md, CHANGELOG.md, docs/CODEGEN.md, docs/PROGRESS.md, docs/RESUME_PROMPT.md, and execution tracker
