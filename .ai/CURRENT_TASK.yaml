must_not_change:
  - PostgreSQL as the control-plane database or the platform's own schema/migrations
  - the ModelProvider/gateway, IR, runtime, verify, edit public behavior (additive)
  - the Next.js/Python/Go adapters' existing emitted files (only ADD the migration file)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - connect to or run any database; execute a migration; make a network call
  - add an external Python dependency; import a vendor SDK; put a secret anywhere
acceptance:
  - render_postgres_schema(ir) returns deterministic SQL DDL: one CREATE TABLE per entity, snake_case
    table names, FieldType->PostgreSQL column types, NOT NULL for required fields, a UUID primary key
    (entity id field if present else a surrogate id).
  - many_to_one / one_to_one relations emit a <name>_id UUID column REFERENCES the target table(id);
    many_to_many relations emit a single deterministic join table with a composite primary key; empty on
    an IR with no entities.
  - The Python (FastAPI) and Go backend adapters emit migrations/0001_init.sql exactly when the IR has
    entities and database_strategy=postgres, without changing any previously emitted file.
  - Output is byte-stable across runs; the edit loop (plan_edit) picks up a migration change when the IR
    entities change.
  - Standard-library offline tests cover the type map, required->NOT NULL, PK selection, FK columns,
    many_to_many join table, determinism, the postgres/entities gate, and adapter emission.
