objective: >-
  A design direction per project. Every project used to share one byte-identical tokens.css, so
  all apps looked alike. Each build now gets a coherent direction - style, primary and accent
  colours with checked contrast, a body and heading font pairing (loaded as web fonts), corner
  radius and density - chosen deterministically from the prompt's cues and the product's domain
  and archetype, varied between projects, and the same for the same prompt. It is saved in the
  project's plan (so edits keep it), written to brand.json and the tokens, and handed to the page
  writer. Also: a designed page no longer adds a second header under the app's navigation bar.
