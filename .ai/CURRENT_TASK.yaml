forbidden_changes:
  - The generator reads no clock; output is identical on every run and in every timezone
  - The demo still looks current after the seed loads
  - No appointment on a day its doctor is not rostered
  - The seed loads into a real PostgreSQL with no error
  - A date column added later cannot be silently left out of the shift
required_gates:
  - Two runs of the generator are byte-identical
  - The generator contains no clock read and no NOW()
  - The committed seed matches a fresh run byte for byte
  - Every column that receives a date literal is covered by the shift block
  - The seed loads into PostgreSQL cleanly and the data lands around today
