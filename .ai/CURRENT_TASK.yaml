must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway, IR, codegen, git-service public behavior (additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install, run, or deploy anything in task verify (execution is opt-in on a network machine)
  - put a key value into any command/plan/log; add an external Python dependency; choose a paid service
acceptance:
  - OMNISTACKAI_TIER (0/1/2) resolves default runtime/deploy selections; explicit
    OMNISTACKAI_RUNTIME_PROVIDER / OMNISTACKAI_DEPLOY_PROVIDER override; tier 0/1 force local runtime and
    no deploy; tier 2 permits the cloud selections that have keys.
  - Every declared provider has a driver: deploy providers (vercel/render/netlify/fly) produce a
    DeployPlan of their official-CLI commands; sandbox providers (e2b/daytona/fly-machines) produce a
    PreviewPlan; the key is read from env and NEVER placed in a command or shown in a plan.
  - resolve_platform() returns the active runtime + deploy providers and a platform_status() summary
    (tier, selected providers, which providers have keys, what is missing); selecting a cloud provider
    without its key or at the wrong tier raises a clear error.
  - run_preview / run_deploy executors run a plan (opt-in). task platform:status, task preview, and task
    deploy expose this; task verify stays green and network-independent.
  - Standard-library offline tests cover tier resolution, per-provider driver plans, no-key-in-plan,
    activation/selection errors, and the status summary.
required_gates:
  - impact_analysis
  - tier_resolution_tests
  - per_provider_driver_plan_tests
  - no_key_in_plan_test
  - status_and_selection_error_tests
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
