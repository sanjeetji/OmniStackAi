branch: ai/R-543-archetype-family
objective: >-
  There are only two archetypes, `public_website` and `admin_panel`, so a storefront, a blog and a
  booking site all get the same landing page — the repetitiveness the founder keeps asking about.
  Detection is eight prompt keywords defaulting to `admin_panel`, which is why "a website to sell
  my product" was classified as a console; it reads only the prompt, never the IR, although the
  IR's entity names are the strongest available signal. And it lives entirely in `llm_ui.py`, so
  the deterministic path — everything a user sees when no model is available, or when the model
  fails validation — has no archetype awareness at all beyond web-vs-admin.
  Give the platform a real archetype family, detected deterministically from prompt *and* IR, and
  honoured by both the deterministic generator and the model prompt.
