  - Live - a benchmark run on spent free tiers moves past spent providers without retry waits
  - scripts/verify.sh passes
found_and_fixed:
  - Each chain remembered a spent provider only for its own run (page design) or not at all (builds), so every page and build asked spent free tiers again; health is now shared and persisted.
  - Page design waited out a spent provider's per-minute limit (20 + 40 + 60 s) while another provider could answer; it waits only on the last provider left.
  - Chained cloud clients retried 429s themselves (about 30 s each) before the chain could move on; chained entries do not retry.
  - Groq's 413 (tokens-per-minute limit) was not treated as a limit.
  - The page-chain log said "Ollama answering - False" when Ollama simply had not been probed.
  - The Anthropic default model was out of date (claude-sonnet-5 -> claude-sonnet-5-5).
deferred:
  - Per-task credit budgets exist (PC-010); a per-job cost cap for paid keys is for the credentials step (PC-070).
