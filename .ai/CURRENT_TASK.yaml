objective: >-
  Fourth brick of the differentiating spine. Turn each R-431/R-432 app surface into a deliberately scoped
  Application IR: retain only the business entities the surface needs (plus relation dependencies), separate
  read-visible entities from writable entities, declare only its actor role, and attach that
  role to every authenticated CRUD mutation. Preserve deterministic curated and refined planning, valid
  repository wiring, runnable public reads, and fully offline verification.
