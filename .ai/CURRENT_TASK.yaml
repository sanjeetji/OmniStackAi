task_id: R-427
id: R-427
title: "Fix malformed single-brace inline styles in generated Next.js screens"
status: done
phase: MVP
tracker_row: null
started_at: "2026-09-13"
completed_at: "2026-09-13"
objective: >-
  Fix a real generated-code bug: several f-string templates in codegen/nextjs.py write style={{ ... }},
  which Python collapses to single-brace style={ ... } in the emitted TSX (JSX requires double braces). This
  is a syntax error, so any generated web app with the affected form/list/detail screen headers and
  definition lists fails to compile and returns HTTP 500 - the Studio preview shows a blank/500 page even
  though the backend runs. task verify never caught it because it asserts generated code as strings and never
  compiles the TSX. Fix every affected f-string to emit proper double-brace JSX (quadruple braces in the
  f-string), and add a deterministic regression test that generates real projects and asserts no single-brace
  style={ appears in any generated .tsx. Do not change any component template, screen layout, styling value,
  or logic - only correct the brace escaping.
requirements:
  - Fix all f-string inline styles emitting single-brace style={ ... } in codegen/nextjs.py to double-brace; do not touch correct regular/raw templates.
  - Add a regression test generating both example IRs asserting no generated .tsx has a single-brace inline style.
  - No change to component templates, screen structure, styling values, diff-invariance, or other behavior.
acceptance_criteria:
  - No f-string in codegen/nextjs.py emits style={ <non-brace>; every generated .tsx across both examples is free of single-brace inline styles.
  - The regression test fails before the fix and passes after.
  - Existing generation/screen/diff-invariance tests green; focused + full verify + lint + security + env + both demos pass; 0 model calls in verify.
