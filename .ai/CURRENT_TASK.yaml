found_and_fixed:
  - The model gateway could not send an image; messages carry screenshots now, in each provider's own form (OpenAI-compatible, Anthropic, Gemini).
  - The preview's UI check ran before page design, so its screenshots showed templates; the review screenshots the pages again first.
  - Gemini's free daily quota was spent mid-day and no other vision model was configured; OpenRouter's free vision models follow it.
  - Free vision tiers refuse per minute; a refused review is retried once after a pause.
  - A redesign from its review did not always score higher (live, 5 -> 5, 5 -> 4); it is now re-screenshotted, re-scored and kept only if higher, else the previous page is restored.
  - A model plan with an empty validation rule failed a whole build (found starting this proof); blank rules are dropped.
deferred:
