schema_version: 1
task_id: R-291
title: Optimistic Subcollection Child Delete with Rollback in Generated Next.js Screens
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Extend R-290's optimistic delete to the subcollection (master-detail) child lists, completing the
  optimistic-delete story. In both the collection master-detail screen and the dedicated detail screen,
  deleting a child row hides it immediately (per-subcollection deleting overlay) and rolls it back (row
  reappears + existing error toast) if the server rejects; a reconcile effect prunes ids once the
  subcollection refetch removes them. Safe on the deduped mutation hooks (R-288) and the race-safe
  R-286 LIST_BY hook. No hook/API-client/backend/IR change.
tracker_ref: "R-291"
requirements:
  - Each deletable subcollection gets a per-subcollection deleting state (useState<string[]>) + a reconcile useEffect on [<s_var>.data].
  - The child delete handler adds String(id) to the deleting overlay before await remove<Child>(id) and rolls it back in catch before the existing toast.error.
  - The child row map iterates the deleting-filtered list (only when the subcollection is deletable; non-deletable subcollections map <s_var>.data unchanged).
  - Applies in both the collection master-detail and detail screens; existing success path (refetch + success toast) preserved.
  - No mutation/list hook, API client, backend, or IR change; deterministic; description-only IR stability preserved.
acceptance_criteria:
  - Generated deletable subcollection emits `const [<s_var>Deleting, set<S_var>Deleting] = useState<string[]>([]);` and a reconcile `useEffect(... , [<s_var>.data]);`.
  - The child delete handler adds the id before `await remove<Child>(id)` and removes it in catch before `toast.error`.
  - The child row map source is `(<s_var>.data ?? []).filter((child: any) => !<s_var>Deleting.includes(String((child as any).id)))` for deletable subcollections.
  - Non-deletable subcollections emit no deleting state and map `<s_var>.data` unchanged.
  - Both render sites carry it; description-only IR changes remain byte-identical.
  - Focused tests, related subcollection tests, full offline verification, lint, security, env check, and both builder demos pass.
expected_impact:
