objective: >-
  Real API + DB behind every feature. A generated app has no mock data on its pages, no endpoint
  answering 501, no button that does nothing, and no backend that pretends to save when the
  database is down. What cannot be wired is reported to the user by name instead of shipped fake.
founder_gate: >-
  Founder: "API + DB should be real for each feature, not just only modern UI"; "continue task one
  by one without asking".
companions:
  - A 'Not connected to data yet' report in every build result and generated README
  - Malformed values answer 422 on every backend instead of 500
  - Express 5, so async database errors reach the error handler instead of crashing the server
