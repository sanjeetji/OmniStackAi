objective: >-
  A quality benchmark: a fixed set of varied, real prompts built end to end through the platform's own
  build pipeline and scored - does it build, does it run, does every page and API answer, how much of
  what the prompt asked for was delivered, and how the pages look (screenshots). Results are saved
  with a baseline, and a drop is reported as a regression. It calls real (free) models, so it is
  opt-in and never part of task verify.
