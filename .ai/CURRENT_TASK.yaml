schema_version: 1
task_id: R-232
title: Customer project assembler — one IR into a customer-owned monorepo
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Assemble a complete customer project from one Application IR: select the framework adapters implied
  by the IR project strategy, generate each target, place it under the customer monorepo layout
  (apps/web for the Next.js web app, services/api for the Go/Python backend), and merge into a single
  GeneratedProject with root README/.gitignore. Combined with the Git service, one IR becomes one
  customer-owned monorepo repository (Brief 6/34/35). Deterministic and offline; nothing installed,
  built, run, or written to disk in the assembler.
source:
  tracker_sheet: Phase_Roadmap
  tracker_row: reconstructed; new IDs continue after the workbook backlog's R-010..R-219
  brief_sections: [6, 34, 35, 16, 46, 74, 77, 91, 92]
  founder_note: Committed directly to main (only branch). Author solely sanjeetji; tooling adds a Co-Authored-By trailer.
project_profile:
  repository: platform_modular_monorepo
  service: python_agent_engine
  control_plane_database: postgresql
  model_routing: balanced
complexity: L2
expected_impact:
  - services/agent-engine/src/omnistackai_agent_engine/codegen/assembler.py
  - services/agent-engine/src/omnistackai_agent_engine/codegen/__init__.py
  - services/agent-engine/tests/test_assembler.py
  - docs/CODEGEN.md
  - portable state, changelog, handoff, task doc, and tracker evidence
allowed_paths:
  - .ai/**
  - CHANGELOG.md
  - PROJECT_STATE.md
  - R_&_D/OmniStackAI_Execution_Tracker_v6.xlsx
  - docs/**
  - services/agent-engine/**
must_not_change:
  - PostgreSQL as the control-plane database or the existing schema
  - the model-gateway, Application IR, codegen contract, adapters, and git-service public behavior (additive)
  - local Compose services or infrastructure; the Section 74 top-level contract; the offline bootstrap
  - the network-independence of static task verify
must_not_do:
  - install, build, or run the generated project; write generated files to disk in the assembler
  - add an external Python dependency; store secrets (generated files hold placeholders only)
acceptance:
  - default_registry() returns an AdapterRegistry with the Next.js, Python, and Go adapters registered.
  - assemble_project(ir) selects targets from ir.project_strategy (web_strategy nextjs -> apps/web;
    backend_strategy go/python -> services/api; unsupported strategies are skipped, node backend and
    admin/mobile are documented as not yet assembled), generates each, re-paths its files under the
    monorepo layout, and returns a single GeneratedProject (target "customer-monorepo") plus a root
    README listing the assembled apps and a root .gitignore.
  - All paths are safe, unique, and deterministically ordered; generation is a pure function of the IR;
    standard-library only; nothing installed/built/run/written to disk.
  - The assembled project can be materialized by the Git service into one customer-owned repo with a
    single commit (verified offline in a temp dir).
  - task verify stays green and network-independent.
required_gates:
  - impact_analysis
  - assembler_layout_and_selection_tests
  - default_registry_test
  - end_to_end_materialize_test
  - python_compile_test
  - vendor_import_exclusion
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
model_tool_trace:
  routing: local_only
  local_provider: ollama
  configured_model: qwen2.5-coder:14b
  local_calls: 0
  cloud_calls: 0
  note: Deterministic; no model call. No cloud key set; cloud_calls zero.
completion:
  implementation_commit: null
  verified_at: null
  verification: []
  acceptance_results: []
blockers: []
next_action: >-
  Implement the assembler + default registry with offline tests (including end-to-end materialize via
  the Git service); run the gates; record completion. Next real steps (sandbox/preview/deploy) need a
  cloud/network environment.
next_command: task agent-engine:test
