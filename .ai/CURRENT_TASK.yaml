must_not_change:
  - model provider boundary or implement a product-side provider adapter
  - cloud provider configuration or API keys
  - control-plane database choice or schema
  - Docker Compose services
  - Redis, Kubernetes, Temporal, or deployed infrastructure
  - native mobile or device-cloud functionality
  - source documents other than the authorized execution tracker status and evidence
acceptance:
  - The Ollama endpoint is configurable but restricted to loopback for Stage 0.
  - The configured coder model is environment-selected and discovered from Ollama at runtime.
  - Stable task commands validate configuration, show health/models, pull the selected model,
    serve locally, and run a real inference smoke test.
  - The live smoke test succeeds with an already-pulled coding model and records zero cloud calls.
  - Repository verification passes without requiring Ollama to be running.
  - No cloud provider, extra service, product provider adapter, or native work is introduced.
required_gates:
  - impact_analysis
  - local_endpoint_policy_test
  - model_discovery_test
  - live_local_inference_verification
  - secret_exclusion_check
  - task_verify
  - blast_radius_check
  - tracker_evidence
