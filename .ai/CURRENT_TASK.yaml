  - services/agent-engine/src/omnistackai_agent_engine/git_service/materialize.py
# Widened deliberately: GeneratedFile.content is str-only and materialize.py is the single writer
# (`write_text`), so an app icon — a PNG — cannot reach disk without a binary path. An icon is the
# most visible thing in a store listing, and R-544 now extracts the user's brand colour, so the
# generated app can carry its own colour rather than Expo's default. Two contained changes: an
# opt-in flag on GeneratedFile, and one branch in the writer.
