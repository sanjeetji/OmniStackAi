objective: >-
  A published app's database keeps up with its project. PC-008 applies 0001_init.sql once; a
  changed plan (a new field, a new entity, a new capability) never reached the live database. Now
  every generated schema statement is safe to run again, and publishing evolves the live database:
  the new schema is applied to a scratch schema, compared, missing columns are added to the live
  tables (never dropped; leftovers and type changes are reported), and the schema is re-applied for
  new tables, indexes, functions and triggers. A backup is taken before any schema change and the
  last five kept. Hosted providers (Neon, Supabase) need the founder's account: their own task.
founder_gate: none
companions: []
allowed_paths:
  - services/agent-engine/
  - .ai/
  - R_&_D/Platform_Completion/
  - PROJECT_STATE.md
  - CHANGELOG.md
  - docs/
forbidden_changes:
  - a live database never loses a column, a table or a row through publishing
required_gates:
  - Live - an app published, its plan changed (a new field, a new entity, notifications), published again - the live database has the new column and tables, the old rows are intact, a backup exists, a dropped field is reported and kept
  - scripts/verify.sh passes
