schema_version: 1
task_id: R-237
title: IR-diff -> patch-apply edit loop (edit an existing generated app)
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Add the "edit an existing app" motion (Brief 6/27/34): compute the minimal file-level change set
  between two generated projects and apply only that delta to an existing project on disk, then record
  it as a new commit on the customer-owned repo. plan_edit(old_ir, new_ir) regenerates both via the
  assembler and diffs them into a ProjectDiff (added/modified/deleted, classified deterministically);
  apply_diff writes/removes exactly those files inside a path-safe target; commit_edit applies and
  commits as the customer identity. Diffing is pure and offline; applying/committing is a bounded,
  path-safe disk step (like the R-228 git service) — no network, no code execution, no platform-repo
  writes.
