schema_version: 1
task_id: R-220
title: True per-provider streaming for the cloud model adapters
status: in_progress
phase: BASIC/MVP
founder_stage: 0
branch: ai/R-220-cloud-streaming
goal: >-
  Replace the Stage 0 single-event stream wrapper on the cloud adapters with real incremental
  Server-Sent-Events streaming for OpenAI-compatible (OpenAI/OpenRouter/Groq), Anthropic Messages,
  and Google Gemini, so tokens arrive live like the local Ollama adapter. Streaming reuses the same
  HTTP-safety bounds, maps into the existing vendor-neutral StreamEvent records with usage only on the
  final event, and keeps API keys out of logs and records. No real cloud call is made (no key set);
  offline tests drive the SSE parsers with injected fake streaming responses.
