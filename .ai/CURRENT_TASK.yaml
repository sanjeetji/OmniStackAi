objective: >-
  An ecosystem build ignores the backend language the user asked for. `surface_to_ir` hardcodes
  `BackendStrategy.PYTHON` for every surface, so "a logistics platform with drivers and dispatchers
  and the backend should be in Go language" produces a Python backend and says nothing. The
  single-app path honours it — `nl_to_ir` tells the model to choose Go when asked — so the same
  sentence gets a different answer depending on how many apps the prompt implies.
  Rescoped after checking: R-565's other claims are already true. R-559 made the stack carried in
  the IR, honoured where implemented, and explained where not; verified for a round-trip, a Go
  backend that really generates `go.mod`, and a Flutter request that returns React Native with a
  reason. This task is the one part that was not: the ecosystem planner.
founder_gate: >-
