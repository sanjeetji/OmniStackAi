schema_version: 1
task_id: R-279
title: Global Notification Toast System & Action Feedback in Generated Next.js Web App
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Implement a lightweight, dependency-free global notification toast system in the generated Next.js web application
  (apps/web/components/toast.tsx, apps/web/app/layout.tsx), and wire real-time toast feedback into generated
  collection screens, detail screens, and form screens.
tracker_ref: "R-279"
requirements:
  - Implement apps/web/components/toast.tsx exporting ToastProvider and useToast hook with typed helpers (success, error, info).
  - Floating viewport at fixed bottom-right with auto-dismiss, dismiss button, and status color accents.
  - Wrap apps/web/app/layout.tsx with <ToastProvider>.
  - Wire toast feedback into collection screens (single delete, bulk delete, CSV export).
  - Wire toast feedback into detail screens (delete, JSON export).
  - Wire toast feedback into form screens (create and update success).
  - 100% offline, zero new external npm dependencies, zero new IR fields, strict diff invariance.
acceptance_criteria:
  - apps/web/components/toast.tsx is generated as a client component exporting ToastProvider and useToast.
  - apps/web/app/layout.tsx imports and renders <ToastProvider>.
  - Collection screens import useToast and emit toasts for delete and CSV export.
  - Detail screens import useToast and emit toasts for delete and JSON export.
  - Form screens import useToast and emit toasts on create/update success.
  - Strict diff invariance: changing only ir.description produces byte-identical output across toast components.
  - task verify passes (expect 755+ tests passing, 0 failures).
  - task lint and task security:quick pass.
  - builder:demo passes for minimal-blog and rideshare-favourites.
