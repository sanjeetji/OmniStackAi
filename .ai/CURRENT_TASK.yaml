title: Verifiable-engineering verify plans (per-target gate ladders + IR/monorepo mapping)
status: done
phase: BASIC/MVP
founder_stage: 0
branch: main
goal: >-
  Give the platform the "verifiable engineering" backbone (Brief 26/27/77): a deterministic verify plan
  per generation target — the ordered ladder of gate commands (install, typecheck, lint, test, build)
  that the generated code for that target is engineered to pass. A verify plan is pure data (validated
  command descriptions classified by gate kind), mirroring the runtime preview/deploy plan pattern.
  Map an Application IR to the verify plans for its assembled monorepo apps (apps/web, services/api),
  and add an opt-in run_verify executor that runs a plan fail-fast and returns a structured report.
  Deterministic and offline: plans are asserted; nothing is installed, built, or run by task verify
  (execution is opt-in on a machine with the toolchain).
