found_and_fixed:
  - A second Expo app took a port already allocated to a web app; Expo asked to switch ports and exited, so a two-phone-app ecosystem never previewed. Every phone app now gets its own allocated port.
  - A crashed preview said only "a background process exited"; it names the process and exit code, and the benchmark saves the apps' output.
  - Scoring counted a Python API that only parses (and skipped web apps) as type-checked; build is now 100% only when every surface is clean or repaired.
  - Without the Studio's type-check cache every designed page was put back to its template; the benchmark uses the cache the Studio uses.
  - The page-provider log said "Ollama answering: False" when Ollama was simply not probed yet.
deferred:
