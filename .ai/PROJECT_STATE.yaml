  Two real bugs found and fixed: (1) an error-classification ordering bug - the first draft checked
  provider-runtime-support before validating the target existed at all, misclassifying an unknown
  target's error; fixed by validating the target first via the shared _port_for_target() helper.
  (2) adding a RUNTIME_SPECS entry broke a pre-existing test (test_tier_drivers.py) expecting a
  matching drivers.py _SANDBOX_URLS placeholder for the old planning-stub path; fixed with one
  added line, drivers.py added to allowed_paths mid-task.
  No real VERCEL_TOKEN/VERCEL_PROJECT_ID exist in this environment - every gate is offline via the
  same injected-fake-opener pattern R-486 established; live-cloud verification honestly deferred.
  Gates: agent-engine task verify 3,694 OK (14 new tests), 0 model/network calls; every pre-existing
  suite passes unmodified beyond the one-line drivers.py fix. Repo task verify/lint/security:quick/
  env:check all pass; new scripts/test.sh contract block.
  NEXT: R-488 (Daytona driver - notable because its documented default is plain Docker containers
