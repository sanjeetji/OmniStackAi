  has no price-book entry, a pre-existing unrelated fact already documented in R-472/R-476's own
  evidence). All three unsupported build kinds (pack_id/ecosystem_id/hybrid_ui) confirmed cleanly
  rejected with a 400 and application/json content-type before any SSE framing began. The existing
  non-streaming POST /jobs/build/POST /api/build were not touched by any edit and remain covered
  unchanged by every pre-existing passing test.
  NEXT: R-485 (console: streaming build UI, consuming this endpoint in studio-chat.tsx's
  sendBuild()). Then properly SCOPE (not build) full per-user process/sandbox isolation as its own
