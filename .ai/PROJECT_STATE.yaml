_prior_last_completed_task_summary_R484: >-
  Completed R-484 (2026-09-19): backend real-time build streaming (SSE). First of the founder's
  post-roadmap priorities ("streaming first, then scope isolation properly"), chosen after three
  parallel research passes (competitor streaming architecture, per-user isolation scoping,
  deploy/stack breadth). Backend only - console UI is R-485.
  ModelProvider.stream() already existed at the model_gateway layer but _build()'s entire call
  chain never called it. Added purely additive streaming twins: generate_ir_stream()
  (intake/nl_to_ir.py), build_app_from_prompt_stream() (intake/build_app.py), _build_stream()
  (studio/live_serve.py, plain-prompt-only - Solution Pack/Ecosystem/hybrid_ui explicitly rejected
  via StreamingBuildNotSupportedError, matching _edit()'s own scope precedent). New
  POST /api/build/stream (agent-engine SSE) and POST /jobs/build/stream (Go relay via
  http.Flusher, appending a trailing "credits" event once the upstream "done" event's usage is
  known - crediting can't happen mid-stream; a "done" with no usage still gets a credits_spent: 0
  frame via a separate sawDone boolean; a debit failure after streaming started surfaces as a
  named credits_error frame since a plain 500 is no longer possible once headers are sent).
  Two real bugs found and fixed, not glossed over: (1) the SSE route sent Connection: keep-alive,
  which BaseHTTPRequestHandler treats as "never close this socket" - since there's no
  Content-Length/chunked framing, that hung every real client; caught by the first HTTP-level
  test, fixed to Connection: close. (2) RecordingProvider (every production build's real
  usage-tracking wrapper via resolve_generation_provider_from_env) had no .stream() method -
  invisible to every mocked test (they hand _build_stream() a raw stub provider directly), only
  caught by the task's own required live curl -N smoke test
  ('RecordingProvider' object has no attribute 'stream'); fixed by adding
  RecordingProvider.stream(), mirroring generate()'s own success/failure ledger-recording shape,
  plus 4 new tests in test_recording_provider.py (both files added to allowed_paths mid-task once
  the gap was found).
  Gates: agent-engine task verify 3,658 OK (27 new tests: 9 in test_intake_nl_to_ir.py, 3 in
  test_build_app.py, 11 in test_studio_server.py, 4 in test_recording_provider.py), 0
  model/network calls. Control-plane go build/vet/test all green (7 new tests in
  handler_test.go, 55 total). Repo task verify/lint/security:quick/env:check all pass; new
  scripts/test.sh contract block.
  Live - a real curl -N session through the real Go control-plane (rebuilt via
  task control-plane:verify; agent-engine Studio server restarted since Python doesn't hot-reload
  - the first attempt against the still-running pre-fix process is exactly what surfaced bug #2)
  showed genuine token-by-token generating_ir deltas with real millisecond-scale gaps over ~9 real
  seconds, ending with a real "done" frame (177 files, entities Tag/TaskComment/TaskItem/
  TaskTag/TodoList/User, real git commit sha 75f4b0addf7d08267efc751680d4b50fe339df3f, real usage
  input_tokens:1875/output_tokens:3144), followed by a real trailing "credits" frame
