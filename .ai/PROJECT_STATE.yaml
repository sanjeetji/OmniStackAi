  (None, "stub-model", 4096, 5.0). Gates: focused 144 passed; task verify 3,529 OK (0 model calls; full
  local suite 3,529 passed + 42 subtests in 68.80s, materially faster post-fix, confirming no hidden network
  calls remain); lint/security/env green; demos clean (359/353 files). Manual smoke (opt-in, real HTTP,
  build-only mode, no hybrid_ui to avoid today's exhausted Groq daily quota): a real 160-file build via
  POST /api/build; GET /api/build/1/files listed 160 real paths; GET /api/build/1/file?path=... returned
  real file content; unknown build id -> 404; a ../../../etc/passwd traversal attempt -> 400 "path escapes
  the build directory"; missing path query -> 400; server stopped cleanly. hybrid_ui end-to-end threading
  (synthesize_screens actually firing, a real page.tsx on disk carrying the LLM-Synthesized marker) was
  proven by stub-provider tests rather than a second live Groq call, since today's daily quota was already
  spent per R-466. Previously:
  Completed R-466 (2026-09-17): Compile-Level Repair for LLM-Written UI + Rate-Limit-Aware Pacing - the second
  brick of the hybrid engine, driven by what the live runs proved. model_gateway: ProviderHTTPError carries
  status_code + retry_after_seconds; new ProviderRateLimitedError (429); parse_retry_after (Retry-After header
  seconds/HTTP-date, else the body's "try again in Ns"); the cloud adapter's generate() waits the hint (+0.5s;
