  install node_modules, compile, repair, revert, commit the repair as the customer, print rounds and verdict.
  Tests: test_cloud_rate_limit (15), test_compile_report (11), test_hybrid_repair (12), test_llm_ui_compact (10);
  task verify 3,490 OK; lint/security/env green; demos clean; web-typecheck PASSED x2. Live (Groq free tier):
  the 3-step CLI ran end-to-end in 13s with every UI call failing on a non-429 status and the fallback repo
  compiling at 0 errors; a direct probe with the full grounded prompt succeeded on an empty window; a
  reproduction showed the 429 path working (Retry-After 112 honoured) but capped at 60s - the limiter was
  tokens per DAY (200k, 191k used), so the daily budget was spent. Pacing + status outcomes are live-verified;
  compile repair with real tsc errors and shrink-on-413 are stub-verified only. Previously:
  Completed R-465 (2026-09-17): Grounded Hybrid UI Synthesis - the first brick of the founder-approved HYBRID
  engine (LLM writes the modern UI over the deterministic typed data layer, with a bounded repair loop and a
  template fallback; model calls opt-in, never in task verify). codegen/nextjs.py gained summarize_data_layer
