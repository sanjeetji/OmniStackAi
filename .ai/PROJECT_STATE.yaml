  loading.tsx with that note. Also caught: the new contract block's rg -qF "--shadow-tint"
  parsed the pattern as a flag - both loops now pass "--".
  Gates: typecheck/lint clean; build 25 routes (/opengraph-image, /twitter-image new);
  scripts/test.sh passes; task verify 3,738 OK; lint/security/env pass. Live smoke: every route
