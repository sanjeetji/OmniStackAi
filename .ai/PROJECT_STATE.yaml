_prior_last_completed_task_summary_R490: >-
  Completed R-490 (2026-09-19): runtime sandbox provider-selection surface. Fifth and final task
  in the sandbox-provider sequence (R-486..R-490).
  New runtime/sandbox_selection.py: build_sandbox_from_env(selection=None, *, providers=None) ->
  SandboxSetup, mirroring bootstrap.py's own established build_runtime_from_env() shape, plus a
  new SandboxSelectionError in errors.py. Defaults to sandboxing disabled (selected=None) - zero
  behavior change until an operator opts in via OMNISTACKAI_SANDBOX_PROVIDER.
  The explicit selection parameter is the concrete "switch per user base" mechanism the founder
  asked about - a caller can pass a per-user choice without touching global state, proven by a
  dedicated test. Kept deliberately separate from the older, still-untouched tier.py/bootstrap.py
  planning system (confirmed via direct read this is a genuinely separate concern); not wired into
  studio/console/control-plane, matching every prior task's own scope boundary - per-user plan
  data lives in the Go control-plane and is a separate future integration.
  A real test-design risk was caught and avoided before it was ever committed: an early draft test
  would have made a real local Docker socket connection attempt via GVisorSandboxProvider.active
  just to test registry wiring (since active-reporting evaluates every registered provider
  regardless of selection) - replaced with a zero-I/O class-identity check instead
  (TestRealRegistryWiring).
  Gates: agent-engine task verify 3,738 OK (9 new tests), 0 model/network/Docker calls. Repo task
  verify/lint/security:quick/env:check all pass; new, final scripts/test.sh contract block for
  this five-task sequence. Every other file across the sequence remains completely unmodified.
  THIS COMPLETES THE FIVE-TASK SANDBOX-PROVIDER SEQUENCE (R-486..R-490): E2B, Vercel Sandbox,
  Daytona, and a free self-hosted gVisor option are all real, independently-verified, and now
