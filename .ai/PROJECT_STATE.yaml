_prior_last_completed_task_summary_R489: >-
  Completed R-489 (2026-09-19): runtime free, self-hosted gVisor sandbox driver. Fourth of the
  five-task sequence (R-486..R-490) - replaces the originally planned WebContainers option after
  real research found it requires a paid commercial license for any non-prototype use and only
  runs Node.js anyway.
  After comparing every candidate's real licensing (Vercel Sandbox/Fly/CodeSandbox: paid-only; raw
  Firecracker: free but a multi-quarter build-your-own-orchestrator project; E2B/Daytona: open
  source but self-hosting means running their full orchestrator; gVisor: genuinely free, open
  source, small lift), the founder approved gVisor, then asked two real follow-ups before
  continuing: real resource cost (light - ~50MB binary, ~15-30MB RAM/sandbox, layers onto the
  Docker daemon already running for Postgres/control-plane) and why not use this in production
  instead of paying (answered honestly: a self-hosted loopback URL only works for a same-machine
  viewer; the managed providers' real value beyond isolation is a global public routing/proxy/
  scale layer this task doesn't build) - confirmed: free/dev tier, not a production replacement.
  New docker_socket.py (Docker's Unix socket - urllib has no Unix-socket support) and gvisor.py's
  GVisorSandboxProvider (create: POST /containers/create -> start -> inspect for the real
  auto-assigned host port). A real, necessary contract correction found and fixed: SandboxHandle's
  https-only URL validation (from R-486) was too narrow once a local provider existed; relaxed to
  match PreviewPlan's own loopback-or-https pattern. active is a live local capability check (is
  runsc registered?), not an env-var check - the only driver with no credential at all. Docker's
  own image ecosystem covers Go, unlike Vercel Sandbox.
  No live gVisor/Docker daemon exists in this environment - every gate is offline via an injected
  fake Unix-socket connection; live verification honestly deferred.
  Gates: agent-engine task verify 3,729 OK (22 new tests), 0 model/network/Docker calls; every
  pre-existing suite passes unmodified beyond the one deliberate SandboxHandle relaxation. Repo
  task verify/lint/security:quick/env:check all pass; new scripts/test.sh contract block.
  NEXT: R-490 (provider-selection surface: free gVisor vs paid E2B/Vercel/Daytona, switchable per
  user/config) - the fifth and final task in this sequence.
_prior_last_completed_task_summary_R488: >-
  Completed R-488 (2026-09-19): runtime real Daytona driver. Third of the five-task sequence
  (R-486..R-490). E2B and Vercel Sandbox each proved SandboxLifecycleProvider/sandbox_http.py
  generalize; this task adds Daytona, whose real API is shaped a third, genuinely distinct way.
  Design verified against Daytona's real docs (fetched across several pages, no single page had
  the complete schema). A real base-URL ambiguity across Daytona's own docs (app.daytona.io/api/
  sandbox vs api.daytona.io/sandbox) was resolved the same way E2B's v1/v2 ambiguity was -
  preferring the more specific, structured, directly-fetched source. The create response carries
  no URL at all (unlike E2B's pattern or Vercel's routes[] array) - a second real call, GET
  /sandbox/{id}/ports/{port}/preview-url, is required, verified by a dedicated test asserting both
  requests' exact shapes and strict ordering. create() always requests "public": true since a
  non-public sandbox's preview link needs a companion X-Daytona-Preview-Token header
  SandboxHandle.url's single-string shape has no room for.
  A real, honest isolation-strength tradeoff surfaced, not hidden: Daytona's documented default
  isolation is plain Docker containers, weaker than E2B/Vercel's Firecracker microVMs - not worked
  around, called out explicitly for R-490.
  No real DAYTONA_API_KEY exists in this environment - every gate is offline via the same
  injected-fake-opener pattern established in R-486/R-487; live-cloud verification honestly
  deferred.
  Gates: agent-engine task verify 3,707 OK (13 new tests), 0 model/network calls. Unlike R-487, no
  runtime/providers.py or drivers.py change was needed - RUNTIME_SPECS["daytona"] already existed,
  so every pre-existing suite passes completely unmodified. Repo task verify/lint/security:quick/
  env:check all pass; new scripts/test.sh contract block.
  All three sandbox providers the founder asked for (E2B, Vercel Sandbox, Daytona) now have real,
  tested, pluggable drivers behind one shared contract.
  NEXT: R-489 (free WebContainers browser-only option, Node.js/frontend apps only), R-490
  (provider-selection surface exposing the founder's "switch easily" ask).
_prior_last_completed_task_summary_R487: >-
  Completed R-487 (2026-09-19): runtime real Vercel Sandbox driver. Second of the five-task
  sequence (R-486..R-490), proving R-486's SandboxLifecycleProvider pattern is genuinely pluggable
  by adding a second, independent real driver against a differently-shaped API, reusing
  sandbox_http.py completely unchanged.
  Design verified against Vercel's real REST API (fetched directly, not assumed): POST /v2/sandboxes
  (only one creation model, "named", persistent:false for ephemeral behavior), GET/DELETE
