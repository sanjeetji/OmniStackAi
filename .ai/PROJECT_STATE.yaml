last_completed_task_summary: >-
  Completed R-539 (2026-09-23): the CareClinic doctor workstation rebuilt against the API, and the platform's own account commands. apps/doctor was a mock like the console had been: every screen rendered hard-coded state and only three called the API at all, overlaying invented values on the response. All 15 screens now read live clinic data behind a shared doctor session, guard and event stream. New API: GET /api/doctor/consult/:appointmentId (the whole consultation context in one read, 404 for another doctor's patient), GET /api/doctor/earnings, POST/DELETE /api/doctor/schedule/overrides, and GET /api/public/icd10 over a new icd10_catalog table of 70 codes so diagnosis coding searches real reference data. Fixed: the earnings query double-counted a consultation fee when a visit had both a consultation and a diagnostics invoice; and the shared clinical types named columns the API never returns, which blanked the medicine, form and dose on the patient's prescription slip. Platform: omnistack.sh fresh wipes all local data and creates the first owner as a super_admin; omnistack.sh admin administers accounts through a new platformctl that reuses the control-plane's PBKDF2 hashing; COMMANDS.md documents every command and what the role/plan/credit model does and does not enforce. Evidence: 18/18 API unit tests, 9/9 live workflow tests, 23/23 offline tests, 48/48 pages verified in a browser, 48 screens recaptured, go test 22 packages, an owner created by the CLI signs in to the console.
_prior_last_completed_task_summary_R538: >-
  Completed R-538 (2026-09-23): CareClinic part 4/4 and publish. Built the clinic operations console (apps/admin, "CareClinic Ops") across 18 routes against the real API, in its own control-room design behind a staff-only guard: operations dashboard, front desk, check-in, walk-in booking, appointments and appointment investigation, doctors, doctor rostering with absences, room board, cashier and itemised receipt, refunds, diagnostics bench with result entry, reports, chart-access audit, settings, and a waiting-room display board. The draft console was a static mock (all 18 pages rendered hard-coded arrays; sign-in wrote a fake token), so it was rewritten. Added the admin endpoints it needs, admin SDK methods and types in @careclinic/shared, and role-aware sign-in (each app sends the role it is for; the API answers 403 for an account of another kind). Fixed defects in the parts already signed off: the seed never loaded (48 times of day were HH:60:00; queue_status was copied from the appointment status although no_show is not one of its values), nine tables were never written, the demo patient's chart was empty, seven patient-app route folders were URL-encoded so every detail page 404'd on a real id, doctor cards linked to /doctors/undefined, services/api did not type-check, the shared types named columns the API never returns, and document numbers came from COUNT(*) + 1, which collides. Captured 48 screens plus a composed cover from the running template and published templates/catalog/care-clinic v1.0.0 (healthcare). Evidence: 18/18 API unit tests, 6/6 live cross-app workflow tests, 18/18 new offline tests, 48/48 pages verified in a real browser, 40/40 live gate through the console with the preview ready in 35 s. Known and recorded, not fixed: apps/doctor (R-537) is still a mock and needs its own task.
