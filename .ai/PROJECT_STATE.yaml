_prior_last_completed_task_summary_R486: >-
  Completed R-486 (2026-09-19): runtime real sandbox lifecycle contract + E2B driver. First of a
  five-task sequence (R-486..R-490) toward the founder's "Full isolation: per-user
  processes/sandboxes" direction. Dedicated research (codebase audit + competitor platforms +
  sandbox technology tradeoffs, delegated to a subagent, sourced) confirmed every serious
  2025-2026 AI app-builder running real server-side code uses a managed microVM/gVisor sandbox
  provider - self-hosting Firecracker/K8s from scratch is a multi-quarter effort this project
  doesn't have headcount for. Presented to the founder via AskUserQuestion as a hard-gate decision
  (a new paid external cloud dependency); the founder's answer: build real, pluggable drivers for
  multiple providers (E2B, Vercel Sandbox, Daytona) switchable by cost/speed/smoothness, plus one
  free browser-only option (WebContainers).
  Design verified by direct source read: the existing RuntimeProvider/PreviewPlan abstraction is a
  pure planner (local install/run commands + a URL, not a real orchestrator) - the existing
  CloudSandboxProvider was a stub reusing a hardcoded placeholder URL, never calling any real API.
  New, additive SandboxHandle/SandboxLifecycleProvider (create/status/kill) alongside the
  untouched planner. New runtime/sandbox_http.py (small, safe, stdlib-only JSON HTTP helper,
  shared by every sandbox driver this sequence adds) and runtime/e2b.py's E2BSandboxProvider,
  verified against E2B's actual documented REST API fetched directly from docs.e2b.dev (not
  assumed): POST/DELETE https://api.e2b.app/sandboxes[/{id}], X-API-Key auth, public URL pattern
  https://{port}-{sandboxID}.e2b.app, templateID defaulting to E2B's own "base" with an
  E2B_TEMPLATE_ID override. Target->port mapping reused (not duplicated) from the existing
  LocalRuntimeProvider via a new _port_for_target() helper. E2B's GET status response shape
  couldn't be independently verified - status() defensively keeps the existing status when no
  recognizable state field is present, an honest documented gap.
  No real E2B_API_KEY exists in this environment - every gate is offline via an injected fake HTTP
  transport (mirroring model_gateway/cloud.py's own testable-opener pattern); live-cloud
  verification is honestly deferred to a real key from the founder, not faked. Not in scope: wiring
  E2BSandboxProvider into the Studio's actual preview flow - that's R-490's job once more than one
  provider exists to choose between.
  Gates: agent-engine task verify 3,680 OK (22 new tests: 9 in test_runtime_sandbox_http.py, 13 in
  test_runtime_e2b.py), 0 model/network calls; the pre-existing test_runtime.py suite passes
  completely unmodified. Repo task verify/lint/security:quick/env:check all pass; new
  scripts/test.sh contract block.
  NEXT: R-487 (Vercel Sandbox driver), R-488 (Daytona driver), R-489 (free WebContainers
  browser-only option, Node.js/frontend apps only), R-490 (provider-selection surface exposing the
  founder's "switch easily" ask).
