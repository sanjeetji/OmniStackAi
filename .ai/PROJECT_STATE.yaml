_prior_last_completed_task_summary_R472: >-
  Completed R-472 (2026-09-18): Phase C of the kickoff doc - the control-plane's new Job API
  (POST /jobs/build) proxies an authenticated caller's build request to the agent-engine and
  debits real credits from the cost the agent-engine actually reports, closing the loop the
  founder asked for in Phase A/B. Live discovery while researching: the Studio's real
  plain-prompt build path returns a raw ModelProvider that bypasses the gateway's own (real,
  tested, but previously demo-only) UsageLedger accounting entirely - fixed with a new, additive
  model_gateway.RecordingProvider decorator (agent-engine) wrapping any provider to record real
  usage/cost, wired through resolve_generation_provider_from_env's new optional usage_ledger
  param and surfaced as an additive "usage" key (cost_micros_usd as an int, not a decimal string)
  from studio/live_serve.py's plain-prompt build. Go side: new auth.RequireUser (handleMe
  refactored to use it too), users.Store.DebitCredits (row-locked SELECT...FOR UPDATE, clamped so
  balance never goes negative - v1 policy is never block a build, only clamp the charge), and a
  new internal/jobs package that forwards the body verbatim and augments the response with
  credits_spent/credit_balance. A real, caught-before-commit bug: RecordingProvider originally
  sourced provider_id/model_id from the response's own echoed field instead of the actually-
  dispatched provider/request (matching ModelGateway._record's real pattern) - the test suite
  caught it immediately. A real, live-smoke-only bug: the control-plane's global 15s
  http.Server.WriteTimeout was killing /jobs/build's connection before a real multi-minute build
  finished; fixed with a per-request http.ResponseController.SetWriteDeadline instead of
  loosening the server-wide timeout. Live proof: real Docker Postgres+control-plane, a real local
  Ollama build via the Studio server (host.docker.internal + extra_hosts wired into compose.yaml
  so the container can reach it) produced a real 161-file "Task Tracker" repo with usage
  cost_micros_usd=0/credits_spent=0 (correctly free, local usage is credit-exempt by price, not by
  a special case); since a free build has nothing to debit, DebitCredits's real Postgres path
  (row lock + clamp) was proven separately with a throwaway, never-committed go run program,
  confirmed independently via a real GET /auth/me showing the debited balance. Gates: agent-engine
  3603 tests (0 model calls); control-plane go test all green incl. 7 new internal/jobs cases and
  a 6-case clampCharge table test; task verify - Stage 0 verification passed.
  NEXT R-473 (Phase D): rebuild the real Studio/builder UX inside apps/console-web so a logged-in
  user can actually call the now-real /jobs/build from the product itself, not just curl.
_prior_last_completed_task_summary_R471: >-
  Completed R-471 (2026-09-17): fixed a real dev-mode hydration bug found by the founder's own
  first live try of R-470, and added a full_name field to registration. The founder opened the
  console at http://127.0.0.1:4321/register and registration silently did nothing. Root cause found
  in the dev server's own log: Next.js 16 blocks cross-origin access to its dev/HMR resources by
  default and treats 127.0.0.1 and localhost as distinct origins for that check - with no client JS
  hydrated, the register form's onSubmit handler never attached, so the browser's native default
  form submission fired instead (a GET request with email/password serialized into the URL query
  string, doing nothing, with no visible error). Fixed with allowedDevOrigins in next.config.ts;
  verified live by fetching the register page's actual client JS chunk with
  Origin: http://127.0.0.1:4321 and confirming both a 200 and the absence of the
  previously-triggered "Blocked cross-origin request" warning in the dev server log - the strongest
  verification possible without literally driving a browser.
  Also answered and implemented the founder's question about whether to collect more profile info:
  added full_name (broadly useful - personalization, addressing the user, the home page previously
  only showed an email) but explicitly recommended against and did not add Gender or Age (no
  function anywhere in this product's actual roadmap - credits, plans, a builder Studio - and
  collecting them would be unused PII with real privacy/compliance liability for zero product
  benefit). Threaded full_name through a new migration (000003_users_full_name, additive, does not
  touch 000001/000002), internal/auth's Store interface/handler/types, and the console's register
  form + home page greeting ("Welcome back, {name}"). Renumbered the kickoff doc's Phase C from
  R-471 to R-472 since this task took the R-471 slot as its own real, scoped work.
  Gates: control-plane go test all green (internal/auth 15 incl. 2 new sub-cases, config 2, health
  3, password 8, migrations 4); console typecheck/lint/build clean; task verify - Ran 3593 tests in
  62.945s, OK, Stage 0 verification passed. Live: rebuilt/restarted the real control-plane (picked
  up migration 000003 cleanly on the existing volume); register without a name -> 400; with a name
  -> 201 with the name in the body; home page shows "Welcome back, Saurabh Chopra"; a direct
  control-plane check (bypassing the console) confirmed the same round trip against the real
  Postgres-backed Store.
  NEXT R-472 (Phase C): bridge the control-plane's Job API to the unmodified agent-engine so a real
  generation call actually debits a user's credits (local Ollama stays credit-exempt).

_prior_last_completed_task_summary_R470: >-
  Completed R-470 (2026-09-17): real Next.js console-web, wired to R-469's auth API. Phase B of
  R_&_D/OmniStackAI_Commercial_Platform_Kickoff_v1.md - replaced the static, dependency-free
  apps/console-web (plain HTML/CSS/JS reading a committed data/overview.json snapshot) with a real
  Next.js (App Router, TypeScript) app. Register/login/logout wired to R-469's control-plane via
  server-side Route Handlers (app/api/auth/*) that proxy the calls and set/clear an httpOnly
  session cookie - the raw token is never handed to client-side JavaScript, no CORS needed (the
  browser only ever talks to the Next.js origin). An authenticated home page shows the signed-in
  user's profile + credit balance; a /fabric page carries the old model/cost overview dashboard
  forward on the exact same data/overview.json data contract, now a React Server Component instead
  of hand-written DOM JS. No new UI dependency beyond React/Next.js itself (no Tailwind/component
  library) - the console's existing CSS design tokens carry forward into app/globals.css. New env
  var OMNISTACKAI_CONTROL_PLANE_URL (server-side only). Old index.html/app.js/styles.css removed.
  scripts/console.sh rewritten around next dev/build/lint/start; scripts/verify.sh gained console
  lint/typecheck/build steps (next build succeeds with no live control-plane - Route Handlers are
  compiled, not executed, at build time).
  Real compatibility issues found and fixed while implementing (full detail in
  .ai/tasks/R-470.md "Live discovery"): pnpm's default fetch timeout was too short for this
  network's throughput on large packages (fixed with a new root .npmrc); typescript@7.0.2 (npm's
  actual current latest) is not yet supported by typescript-eslint (pinned to typescript@6.0.3,
  matching eslint-config-next's own tested version); the documented FlatCompat eslint.config.mjs
  pattern crashed on a circular-reference bug inside @eslint/eslintrc's error formatter (fixed by
  importing eslint-config-next's own native flat-config export directly, dropping
  @eslint/eslintrc entirely); pnpm 11.19 stopped reading package.json's pnpm.* fields (moved
  onlyBuiltDependencies/allowBuilds to pnpm-workspace.yaml). Most importantly: the session cookie's
  Secure flag was originally derived from NODE_ENV (always "production" under next start regardless
  of the real protocol) rather than the actual request protocol - this would have silently broken
  login for anyone using the app locally over plain HTTP in a real browser (curl does not enforce
  the Secure attribute the way browsers do, so the first smoke test's 200/204s masked it; caught by
  inspecting the raw Set-Cookie header instead of trusting status codes alone). Fixed with a
  per-request isSecureRequest() helper; the full live smoke test was re-run afterward and confirmed
  correct (cookie issued without Secure over plain HTTP, verified in curl's own cookie-jar file).
  Gates: apps/console-web typecheck/lint/build all clean; task verify - Ran 3593 tests in 63.552s,
  OK, Stage 0 verification passed; live smoke against a real running Next.js server + the real
  R-469 control-plane container proved register(201, no token leaked) -> duplicate(409) ->
  home-authenticated(200, real email shown) -> fabric(200) -> home-no-cookie(307 to /login) ->
  logout(204) -> home-after-logout(307 to /login, real server-side invalidation) -> login(200, new
  cookie) end to end.
  NEXT R-471 (Phase C): bridge the control-plane's Job API to the unmodified agent-engine so a real
  generation call actually debits a user's credits (local Ollama stays credit-exempt).

_prior_last_completed_task_summary_R469: >-
  Completed R-469 (2026-09-17): control-plane foundation - users, auth, plans, credits. Phase A of
  R_&_D/OmniStackAI_Commercial_Platform_Kickoff_v1.md, the founder-approved decision (2026-09-17)
  to advance from the Stage-0 static console/stdlib Studio prototype toward the real commercial
  platform Implementation Brief Section 33 always specified. Gave the existing services/
  control-plane Go skeleton (health-check-only before this task) real users, authentication, and a
  plan/credit model: two roles only (super_admin, user - a user's access is gated entirely by plan,
  never a second role tier); plans reuse the Brief Section 22 tier names (free/developer/pro/
  agency/enterprise, byok as an add-on flag); every signup gets the free plan plus a starting
  credit grant recorded in an append-only credit_ledger. New migration 000002_users_auth_billing
  (users, credit_ledger, sessions) plus a small embedded migration runner (migrations package,
  go:embed *.up.sql) that replays every migration in order on every boot - safe because every
  migration file is idempotent, and necessary because docker-entrypoint-initdb.d only runs against
  a brand-new empty Postgres volume, never an existing one. Password hashing is PBKDF2-HMAC-SHA256
  implemented directly on crypto/hmac+crypto/sha256+crypto/subtle - zero new go.mod dependency
  (golang.org/x/crypto/bcrypt was considered and rejected for that reason), verified mechanically
  by a new scripts/test.sh check that go.mod's direct-dependency count stays exactly 1 (pgx).
  Session tokens are opaque crypto/rand bearer tokens; only their SHA-256 hash is ever persisted.
  Four new endpoints (POST /auth/register, /auth/login, /auth/logout, GET /auth/me) mounted
  alongside the existing health routes on one shared http.ServeMux (health.NewHandler became
  health.Register). Login failure is a generic 401 regardless of wrong-password vs. unknown-email,
  including a same-cost dummy-hash Verify call on the "not found" path - no email-enumeration
  timing leak, proven both in fake-store unit tests and against the real running container.
  internal/users' real PostgreSQL-backed Store is deliberately not unit-tested against a live
  database in go test (keeps control-plane:test exactly as hermetic as it already was, matching
  how internal/health tests a fake Pinger) - instead proven by a real Docker Compose + curl smoke
  test: register -> duplicate-register(409) -> login -> wrong-password(401) -> unknown-email(401,
  byte-identical error body) -> me(200) -> me-with-no-token(401) -> logout(204) ->
  me-after-logout(401, real session deletion) -> logout-again(204, idempotent). No frontend, no
  agent-engine bridge, no payment processor, no team/org model - all named as separate later
  Tracker IDs (Phases B/C/D/E) in the kickoff doc, not attempted here.
  Gates: go test (migrations 4, password 8, auth 15, health 3, config 2/9 subtests, all passing);
  control-plane lint/build passed; scripts/test.sh's new R-469 contract block passed; task verify
  (full pipeline, 3593 agent-engine tests, 62.4s, 0 model/network calls, no slowdown) passed;
  live Docker Compose smoke test passed end to end as above.
  NEXT R-470 (Phase B): replace the static apps/console-web with a real Next.js (App Router,
  TypeScript) app wired to this task's four auth endpoints - the point where task bootstrap/
  task doctor deliberately gain a real Node/npm toolchain requirement for the console.

_prior_last_completed_task_summary_R468: >-
  Completed R-468 (2026-09-17): Multi-turn chat / "continue editing this app" in the Studio. Every
  /api/build call used to be a fresh, stateless one-shot prompt with no way to say "now add a favorites
  feature" and have it land as a further commit on the same repo. New intake/app_delta.py is a generic
  (non-pack-coupled) sibling of solution_packs/ai_delta.py: AppDeltaProposal (entities/apis/screens/
  rationale, bounded+unique-validated), build_app_delta_messages (lists the app's REAL existing entities/
  apis/screens/roles as context, strict JSON-only, no-collision instruction), parse_app_delta_proposal
  (strict untrusted-JSON parsing, rejects any collision with the base IR at parse time - including a screen
  role that isn't one of the app's real roles, a gap found and fixed while implementing, see below),
  apply_app_delta (independent defense-in-depth collision re-check, then dataclasses.replace concatenation
  - base_ir.entities + proposal.entities etc., mirroring solution_packs/application.py's merge exactly -
  backstopped by ApplicationIR.__post_init__ and the same validate_ir/has_errors final check), and
  generate_app_delta_proposal (a bounded validate->feedback->retry loop, retry only on a validation
  rejection never on a provider exception, mirroring R-465's _synthesize_file idiom). The diff/commit half
  needed ZERO changes: edit/diff.py::plan_edit and edit/apply.py::commit_edit (proven end-to-end already by
  test_edit_loop.py) are reused exactly as-is. New studio/session.py's StudioSessionStore is a small,
  bounded (LRU-by-last-touched), in-memory, server-only store (same idiom as StudioBuildHistory) keyed by
  the same build id, holding the app's CURRENT ApplicationIR (never sent to the browser) and a bounded turn
  history; live_serve.py's _build starts a session only for the two build kinds with exactly one IR -
  plain-prompt and single-surface Ecosystem Pack builds. New POST /api/build/{id}/edit and
  GET /api/build/{id}/turns routes (server.py, via the R-467 _build_id_for_suffix pattern), wired
  unconditionally (no toolchain needed - just git and a model). studio/history.py gained .update() to
  refresh file_count/commit_sha/entities on an existing "Recent builds" entry in place after an edit.
  page.py: a small "Continue editing this app" chat box (turn list + input + Apply button) under the file
  browser; a successful edit re-renders entities/file-count/commit and refreshes the file browser; zero
  external assets preserved. v1 scope: ADDITIVE changes only (new entities/apis/screens; renaming/removing
  existing structure is rejected, never merged); Solution Pack builds (they already have their own AI-delta
  mechanism at build time) and "all surfaces" Ecosystem builds (no single IR) get an honest
  EditNotSupportedError (400) rather than being silently ignored. No changes to edit/, git_service/, or
  application_ir/ - every primitive reused exactly as-is.
  LIVE DISCOVERY while implementing (via the end-to-end test suite, not a live run): neither this new module
  nor solution_packs/ai_delta.py (the pattern it mirrors) validated that a proposed screen's role refers to
  one of the base IR's ACTUAL declared roles - only checked it was well-formed lower_snake_case.
  ApplicationIR.__post_init__ does catch an invalid role as a last resort (it did, in the first failing test
  run: minimal-blog-ecosystem's "author-studio" surface only declares an "author" role, unlike minimal-blog's
  author+reader), but only AFTER generate_app_delta_proposal had already returned successfully - too late
  for the retry-with-feedback loop to use it. Fixed: an explicit role-existence check added to
  parse_app_delta_proposal (same layer as every other base-IR collision check, gets the retry benefit) and
  to apply_app_delta (defense in depth, matching the existing pattern), plus the app's real roles are now
  listed in the prompt so the model has the information to avoid the mistake. New tests cover both the
  parse-time rejection and the merge-time defense-in-depth check.
  Gates: focused 214 passed; task verify 3,593 OK (0 model/network calls; 63.8s, no slowdown vs before -
  confirms no hidden calls were introduced); lint/security/env green; demos clean (359/353 files). Manual
  smoke (opt-in, real HTTP, build-only mode, no live model call - today's Groq daily quota was already
  exhausted per R-466/R-467): healthz ok; unknown-build turns -> {"turns": []} (200, honest empty view);
  unknown-build edit -> 404; a build id with a slash -> 404 (not matched); page HTML contains "Apply change".
  The actual delta->merge->diff->real-second-commit round trip (the core of this feature) is proven by
  test_studio_edit.py against real temporary git repos: a real SECOND git commit lands with the new entity's
  files actually present in the working tree; a second edit stacks a THIRD commit and keeps the first edit's
  entity; a collision is rejected with zero commits made and state unchanged; StudioBuildHistory's entry is
  updated in place (not appended); a provider exception is never retried and makes no commit; both excluded
  build kinds return the honest EditNotSupportedError. Previously:
  Completed R-467 (2026-09-17): Studio File Browser + Hybrid UI Toggle - the first slice of the hybrid
  engine reaching the actual product UI (the Studio a user opens in a browser, studio/server.py +
  live_serve.py + page.py - confirmed by direct reading to be a dependency-free stdlib http.server app with
