_prior_last_completed_task_summary_R501: >-
  Completed R-501 (2026-09-20): Code ownership — download, connect GitHub, push (F-03-git spec).
  Implemented instant .zip download (GET /projects/{id}/export) streaming repository at HEAD,
  strictly excluding .git, node_modules, build caches (.next, __pycache__, .venv), and secret environment
  files (.env* except .env.example) with zero memory buffering. Implemented GitHub App integration:
  AES-256-GCM authenticated encryption for OAuth refresh tokens in PostgreSQL (000005_git_connections.up.sql / down.sql),
  Go RS256 JWT minting from GitHub App private key using crypto/rsa (zero external JWT dependencies), on-demand
  installation token generation, user repository creation, and secure push (POST /projects/{id}/git/push and
  /api/workspaces/{id}/git/push) with 100% token scrubbing across stderr, logs, and responses, never storing
  credentials in .git/config. Implemented Lovable-grade Manage -> Git settings tab with connection states,
  repository creation form, commit sync badges ("N commits ahead"), copyable git clone command, and Studio
  header Download code action. 3,754 tests passed; full task verify, contract tests, and Next.js build clean.
_prior_last_completed_task_summary_R500: >-
  Completed R-500 (2026-09-20): Multi-Process Preview & Diagnostics Service (F-02-preview spec).
  Eliminated 127.0.0.1 loopback isolation for generated apps by introducing an authenticated same-origin
  Next.js reverse proxy at /preview/{projectId}/** and /preview/{projectId}/api/**. Defended strictly against
  SSRF by enforcing loopback destination addresses and determining internal ports strictly through Control-Plane
  project ownership checks (returning 404 for foreign users). Injected <base href="/preview/{projectId}/"> into
  proxied HTML and dynamically rewrote /_next/ chunk paths, Location headers, and Set-Cookie paths to maintain
  seamless app navigation across LAN devices and browsers. Upgraded agent-engine localrun and preview manager
  with named phase progression (install -> migrate -> start -> ready), process ID tracking, and an automatic
  idle timeout reaper governed by OMNISTACKAI_PREVIEW_IDLE_MINUTES (default 30m). Added control-plane GET /projects/{id}/preview,
  POST /projects/{id}/preview, and POST /projects/{id}/preview/stop with full tenant verification. In the console UI,
  StudioPreview auto-starts previews on project load, visualizes the real-time named phase progress and timer, provides
  restart/stop controls, and displays an honest build-only banner when preview mode is disabled. 3,750 tests passed
  in 79.7s; full task verify, go tests, and contract suites green.
  NEXT: F-03 Git Push / GitHub Export (R-501, spec R_&_D/specs/F-03-git.md).
