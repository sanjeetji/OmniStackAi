name: omnistackai-local

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OMNISTACKAI_POSTGRES_DB:-omnistackai}
      POSTGRES_USER: ${OMNISTACKAI_POSTGRES_USER:-omnistackai}
      POSTGRES_PASSWORD: ${OMNISTACKAI_POSTGRES_PASSWORD:?set OMNISTACKAI_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OMNISTACKAI_POSTGRES_PORT:-5432}:5432"
    volumes:
      - omnistackai-postgres-data:/var/lib/postgresql
      - ../../../services/control-plane/migrations/000001_platform_foundation.up.sql:/docker-entrypoint-initdb.d/000001_platform_foundation.sql:ro
      - ../../../services/control-plane/migrations/000002_users_auth_billing.up.sql:/docker-entrypoint-initdb.d/000002_users_auth_billing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  control-plane:
    image: omnistackai/control-plane:r004
    build:
      context: ../../../services/control-plane
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OMNISTACKAI_CONTROL_PLANE_ADDRESS: 0.0.0.0:8080
      OMNISTACKAI_POSTGRES_HOST: postgres
      OMNISTACKAI_POSTGRES_PORT: 5432
      OMNISTACKAI_POSTGRES_DB: ${OMNISTACKAI_POSTGRES_DB:-omnistackai}
      OMNISTACKAI_POSTGRES_USER: ${OMNISTACKAI_POSTGRES_USER:-omnistackai}
      OMNISTACKAI_POSTGRES_PASSWORD: ${OMNISTACKAI_POSTGRES_PASSWORD:?set OMNISTACKAI_POSTGRES_PASSWORD in .env}
      OMNISTACKAI_DATABASE_PING_TIMEOUT: ${OMNISTACKAI_DATABASE_PING_TIMEOUT:-2s}
      OMNISTACKAI_SHUTDOWN_TIMEOUT: ${OMNISTACKAI_SHUTDOWN_TIMEOUT:-10s}
      OMNISTACKAI_SESSION_TTL: ${OMNISTACKAI_SESSION_TTL:-720h}
      OMNISTACKAI_SIGNUP_CREDIT_GRANT: ${OMNISTACKAI_SIGNUP_CREDIT_GRANT:-100}
      # R-472: the agent-engine's Studio server runs directly on the host (scripts/test.sh hard-
      # blocks adding it as a Compose service at this stage), so the container reaches it via the
      # Docker-provided host gateway alias rather than 127.0.0.1 (which inside the container means
      # the container itself). extra_hosts below makes host.docker.internal resolve on Linux
      # Docker Engine too, not just Docker Desktop/Colima where it already works.
      OMNISTACKAI_AGENT_ENGINE_URL: ${OMNISTACKAI_AGENT_ENGINE_URL:-http://host.docker.internal:4173}
      OMNISTACKAI_CREDITS_PER_USD: ${OMNISTACKAI_CREDITS_PER_USD:-1000}
      # A local model needs far longer than a cloud one for a build or a chat edit (R-530).
      OMNISTACKAI_AGENT_CALL_TIMEOUT: ${OMNISTACKAI_AGENT_CALL_TIMEOUT:-5m}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${OMNISTACKAI_CONTROL_PLANE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  omnistackai-postgres-data:
    name: omnistackai-postgres-data
